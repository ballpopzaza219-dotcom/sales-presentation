<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Build-Con Admin — ระบบจัดการลูกค้า</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-alt:#F7F8FA;
  --surface-sunken:#EFF1F4;
  --navy:#16233F;
  --navy-2:#223458;
  --steel:#4A6E93;
  --orange:#C25A28;
  --orange-dark:#A34A1F;
  --orange-tint:#FBEEE5;
  --green:#1E7A54;
  --green-bg:#E7F5EE;
  --red:#B23B2E;
  --red-bg:#FBEAE7;
  --amber:#A8730E;
  --amber-bg:#FBF1DC;
  --text:#161D2E;
  --text-muted:#68738C;
  --text-faint:#9AA3B5;
  --border:#E4E7ED;
  --border-strong:#D4D9E2;
  --radius:9px;
  --radius-sm:6px;
  --shadow-xs:0 1px 2px rgba(15,23,41,.05);
  --shadow-sm:0 1px 3px rgba(15,23,41,.06), 0 1px 2px rgba(15,23,41,.04);
  --shadow-md:0 4px 14px rgba(15,23,41,.08), 0 1px 3px rgba(15,23,41,.05);
  --shadow-lg:0 16px 40px rgba(15,23,41,.14), 0 4px 12px rgba(15,23,41,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
#app{min-height:100vh;}
h1,h2,h3,h4{font-family:'Manrope',sans-serif; letter-spacing:-.01em; margin:0; color:var(--navy); font-weight:800;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--orange-tint); color:var(--orange-dark);}

.btn{border:none; border-radius:var(--radius-sm); padding:10px 18px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:background .12s ease, border-color .12s ease, box-shadow .12s ease, transform .06s ease; white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy); color:#fff; box-shadow:var(--shadow-xs);}
.btn-primary:hover{background:var(--navy-2); box-shadow:var(--shadow-sm);}
.btn-primary:disabled{background:var(--border-strong); color:var(--text-faint); cursor:not-allowed; box-shadow:none;}
.btn-ghost{background:var(--surface); color:var(--navy); border:1px solid var(--border-strong);}
.btn-ghost:hover{border-color:var(--steel); color:var(--steel); background:var(--surface-alt);}
.btn-sm{padding:7px 12px; font-size:12px;}
.btn-danger{background:transparent; color:var(--red); border:1px solid var(--red-bg);}
.btn-danger:hover{background:var(--red-bg);}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-xs);}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--navy); margin-bottom:6px; letter-spacing:.01em;}
.field .hint{font-size:11.5px; color:var(--text-muted); margin-top:5px; line-height:1.5;}
.hint{font-size:11.5px; color:var(--text-muted); line-height:1.5;}
.field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); font-size:14px; background:#fff; color:var(--text); transition:border-color .12s ease, box-shadow .12s ease; font-family:inherit;}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(22,35,63,.09);}

.badge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:4px 10px 4px 8px; border-radius:20px; letter-spacing:.01em;}
.badge::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0;}
.badge-active{background:var(--green-bg); color:var(--green);}
.badge-suspended{background:var(--red-bg); color:var(--red);}
.badge-paid{background:var(--green-bg); color:var(--green);}
.badge-unpaid{background:var(--amber-bg); color:var(--amber);}
.badge-partial{background:var(--amber-bg); color:var(--amber);}
.badge-overdue{background:var(--red-bg); color:var(--red);}
.badge-cancelled{background:var(--surface-sunken); color:var(--text-muted);}

.filter-bar{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
.filter-bar select{padding:8px 12px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); font-size:13px; background:#fff; font-family:inherit; color:var(--text);}
.settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;}
@media (max-width:1100px){.settings-grid{grid-template-columns:1fr;}}

.auth-shell{min-height:100vh; display:grid; grid-template-columns:minmax(0,460px) 1fr;}
.auth-brand-side{background:var(--navy); position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:44px 44px 40px; color:#fff;}
.auth-brand-side::before{content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px); background-size:22px 22px; opacity:.5;}
.auth-brand-side::after{content:''; position:absolute; right:-120px; bottom:-120px; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(194,90,40,.25), transparent 70%);}
.abs-top, .abs-bottom{position:relative; z-index:1;}
.abs-tagline{font-family:'Manrope'; font-size:27px; font-weight:800; line-height:1.32; letter-spacing:-.01em; margin-top:40px; max-width:360px;}
.abs-desc{font-size:13.5px; color:rgba(255,255,255,.6); margin-top:14px; max-width:320px; line-height:1.7;}
.abs-foot{font-size:11.5px; color:rgba(255,255,255,.4); letter-spacing:.02em;}

.auth-form-side{display:flex; align-items:center; justify-content:center; padding:40px 32px;}
.auth-box{width:100%; max-width:400px;}
.brand{display:flex; align-items:center; gap:11px; margin-bottom:8px;}
.brand-logo-img{height:40px; width:auto; display:block;}
.auth-form-side .brand-logo-img, .auth-brand-side .brand-logo-img{height:110px;}

.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px 30px; box-shadow:var(--shadow-md); margin-top:26px;}
.form-error{background:var(--red-bg); color:var(--red); font-size:12.5px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:16px;}
@media (max-width:860px){.auth-shell{grid-template-columns:1fr;} .auth-brand-side{display:none;}}

.shell{display:flex; min-height:100vh;}
.sidebar{width:256px; background:var(--navy); color:#fff; flex-shrink:0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
.sidebar .brand{justify-content:flex-start; padding:22px 22px 20px; margin:0;}
.role-tag{margin:0 16px 14px; padding:12px 13px; background:rgba(255,255,255,.05); border-radius:var(--radius-sm); display:flex; align-items:center; gap:10px;}
.rt-avatar{width:32px; height:32px; border-radius:50%; background:var(--orange); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Manrope'; font-weight:800; font-size:12.5px; color:#fff;}
.rt-name{font-size:12.5px; font-weight:700; line-height:1.3;}
.rt-group{font-size:10.5px; color:rgba(255,255,255,.48); letter-spacing:.03em; margin-top:1px;}
.nav{flex:1; padding:4px 12px; overflow-y:auto;}
.nav-item{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--radius-sm); color:rgba(255,255,255,.62); font-size:13.5px; font-weight:500; margin-bottom:1px; border:none; background:none; width:100%; text-align:left; position:relative; transition:background .12s, color .12s;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(255,255,255,.09); color:#fff; font-weight:600;}
.nav-item.active::before{content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--orange);}
.nav-item.disabled{color:rgba(255,255,255,.28); cursor:default;}
.nav-item.disabled:hover{background:none; color:rgba(255,255,255,.28);}
.nav-item .soon{margin-left:auto; font-size:9.5px; font-family:'IBM Plex Mono'; letter-spacing:.04em; text-transform:uppercase; color:rgba(255,255,255,.32); border:1px solid rgba(255,255,255,.18); padding:2px 6px; border-radius:20px;}
.nav-item .nav-badge{margin-left:auto; font-size:11px; font-weight:700; line-height:1; color:#fff; background:var(--red); padding:3px 7px; border-radius:20px; min-width:9px; text-align:center;}
.unseen-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--red); margin-right:7px;}
.quo-items-table th, .quo-items-table td{padding:8px 10px; font-size:12.5px;}
.quo-items-table td{vertical-align:top;}
.quo-items-table input, .quo-items-table select{width:100%; padding:6px 8px; font-size:12.5px;}
.quo-items-table .quo-item-product{margin-bottom:5px;}
.quo-item-subtotal{font-weight:700; color:var(--navy); padding:6px 0; white-space:nowrap;}
.quo-total{text-align:right; font-weight:700; color:var(--navy); margin:14px 0; font-size:15px;}
.nav-foot{padding:14px 22px 18px; border-top:1px solid rgba(255,255,255,.08); margin-top:6px;}
.logout-btn{color:rgba(255,255,255,.5); font-size:12.5px; background:none; border:none; padding:0;}
.logout-btn:hover{color:#fff;}

.main{flex:1; padding:32px 42px 60px; max-width:calc(100vw - 256px);}
.page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
.page-head h2{font-size:23px;}
.page-head .sub{color:var(--text-muted); font-size:13px; margin-top:5px;}

.grid-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:26px;}
.stat-card{padding:19px 20px; display:flex; flex-direction:column; gap:12px;}
.stat-card .stico{width:32px; height:32px; border-radius:8px; background:var(--orange-tint); color:var(--orange-dark); display:flex; align-items:center; justify-content:center; font-size:15px;}
.stat-card .num{font-family:'Manrope'; font-size:28px; font-weight:800; color:var(--navy); line-height:1;}
.stat-card .lbl{font-size:12.5px; color:var(--text-muted); margin-top:3px;}
.stat-card .lbl-note{font-size:10.5px; color:var(--text-faint); margin-top:2px;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; padding:11px 16px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); border-bottom:1px solid var(--border); font-weight:700; background:var(--surface-alt);}
th:first-child{border-top-left-radius:var(--radius);}
th:last-child{border-top-right-radius:var(--radius);}
td{padding:13px 16px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-alt);}
tr.clickable{cursor:pointer;}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
.table-wrap table{border:none;}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}

.empty{padding:56px 20px; text-align:center; color:var(--text-muted);}

.modal-overlay{position:fixed; inset:0; background:rgba(15,23,41,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; backdrop-filter:blur(2px);}
.modal{background:#fff; border-radius:var(--radius); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; padding:28px 30px; box-shadow:var(--shadow-lg); scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent;}
.modal::-webkit-scrollbar, .contact-list-scroll::-webkit-scrollbar{width:9px;}
.modal::-webkit-scrollbar-track, .contact-list-scroll::-webkit-scrollbar-track{background:transparent;}
.modal::-webkit-scrollbar-thumb, .contact-list-scroll::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:20px;}
.modal::-webkit-scrollbar-thumb:hover, .contact-list-scroll::-webkit-scrollbar-thumb:hover{background:var(--steel);}
.contact-list-scroll{max-height:260px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent;}
.modal h3{margin-bottom:6px; font-size:18px;}
.modal .modal-sub{color:var(--text-muted); font-size:12.5px; margin-bottom:20px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
.split2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.section-title{font-size:14.5px; font-weight:700; color:var(--navy); margin:22px 0 14px; padding-bottom:10px; border-bottom:1px solid var(--border); font-family:'Manrope'; display:flex; justify-content:space-between; align-items:center;}

.contact-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border);}
.contact-row:last-child{border-bottom:none;}
.contact-name{font-weight:600; font-size:13.5px; color:var(--navy);}
.contact-meta{font-size:12px; color:var(--text-muted); margin-top:2px;}

.renew-card{margin-top:14px; padding:18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-xs);}
.grid-cards .renew-card{margin-top:0;}
.renew-card-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px;}
.renew-card-title{font-family:'Manrope'; font-weight:800; font-size:16px; color:var(--navy);}
.renew-card-sub{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
.price-input{position:relative;}
.price-input span{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:14px; pointer-events:none;}
.price-input input{padding-left:28px !important;}
.duration-group{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.duration-btn{position:relative; border:1px solid var(--border-strong); background:#fff; border-radius:var(--radius-sm); padding:10px 6px; font-size:12.5px; font-weight:600; color:var(--text); cursor:pointer; text-align:center; transition:border-color .12s ease, box-shadow .12s ease;}
.duration-btn:hover{border-color:var(--steel);}
.duration-btn.active{border-color:var(--navy); box-shadow:0 0 0 2px rgba(22,35,63,.12); color:var(--navy);}
.duration-btn .discount{display:block; font-size:11px; font-weight:700; color:var(--green); margin-top:2px;}
.stepper{display:flex; align-items:center; gap:0; border:1px solid var(--border-strong); border-radius:var(--radius-sm); overflow:hidden; width:fit-content;}
.stepper button{width:34px; height:34px; border:none; background:var(--surface-alt); color:var(--navy); font-size:16px; font-weight:700; cursor:pointer; line-height:1;}
.stepper button:hover{background:var(--border);}
.stepper span{min-width:44px; text-align:center; font-size:14px; font-weight:700; color:var(--text);}
.renew-summary{margin-top:14px; padding:14px; background:var(--surface-alt); border-radius:var(--radius-sm); font-size:13px;}
.renew-summary .row{display:flex; justify-content:space-between; padding:4px 0; color:var(--text-muted);}
.renew-summary .row.discount{color:var(--green);}
.renew-summary .row.total{margin-top:6px; padding-top:10px; border-top:1px solid var(--border); font-weight:700; font-size:15px; color:var(--navy);}

.toast{position:fixed; bottom:26px; right:26px; background:var(--navy); color:#fff; padding:13px 18px; border-radius:var(--radius-sm); font-size:13px; z-index:100; box-shadow:var(--shadow-lg); font-weight:500;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}

@media (max-width:900px){
  .sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .main{max-width:100vw; padding:22px;}
  .split2{grid-template-columns:1fr;}
}

#invoice-print-area{display:none;}
.invoice-doc{font-family:'Sarabun','Tahoma',sans-serif; color:#161225; font-size:12.5px; position:relative; --doc-blue:#1B4B96; --doc-blue-tint:#EAF0FA; display:flex; flex-direction:column; min-height:267mm;}
.invoice-doc .doc-bottom-box{margin-top:auto;}
.invoice-doc .doc-page-no{position:absolute; top:0; right:0; font-size:11px; color:#333;}
.invoice-doc .doc-topbar{height:3px; background:#E7A9A6; margin:-6px -6px 16px;}
.invoice-doc .doc-header{display:flex; align-items:center; justify-content:flex-start; gap:14px; margin-bottom:8px;}
.invoice-doc .doc-logo{height:64px; flex-shrink:0;}
.invoice-doc .doc-company-info{text-align:left;}
.invoice-doc .doc-company-name{font-size:19px; font-weight:800; color:var(--doc-blue);}
.invoice-doc .doc-company-addr{font-size:11.5px; margin-top:4px;}
.invoice-doc .doc-company-contact{font-size:11.5px; margin-top:2px;}
.invoice-doc .doc-title-row{position:relative; margin:18px 0 14px; min-height:52px;}
.invoice-doc .doc-title{font-size:22px; font-weight:800; text-align:center; padding:0 210px;}
.invoice-doc .doc-no-table{position:absolute; top:0; right:0; width:auto; border-collapse:collapse; font-size:11.5px; border:1px solid var(--doc-blue);}
.invoice-doc .doc-no-table td{padding:5px 14px; border:1px solid var(--doc-blue);}
.invoice-doc .doc-no-table td:first-child{background:var(--doc-blue-tint); font-weight:600;}
.invoice-doc .doc-info-box{display:flex; border:1px solid var(--doc-blue); margin-bottom:14px; font-size:12px;}
.invoice-doc .doc-info-col{flex:1; padding:10px 14px; line-height:1.85;}
.invoice-doc .doc-info-col:first-child{border-right:1px solid var(--doc-blue);}
.invoice-doc .doc-info-col b{display:inline-block; min-width:120px;}
.invoice-doc table.items{width:100%; flex:1; border-collapse:collapse; margin-bottom:14px; border:1px solid var(--doc-blue);}
.invoice-doc table.items td{border:none; border-left:1px solid var(--doc-blue); border-right:1px solid var(--doc-blue); padding:8px 10px; font-size:12px;}
.invoice-doc table.items th{background:var(--doc-blue-tint); text-align:center; font-weight:700; border:1px solid var(--doc-blue); padding:8px 10px; font-size:12px;}
.invoice-doc .doc-bottom-box{border:1px solid var(--doc-blue); margin-bottom:20px;}
.invoice-doc .doc-bottom-row{display:flex;}
.invoice-doc .doc-note-box{flex:1; padding:10px 14px; border-right:1px solid var(--doc-blue); min-height:80px;}
.invoice-doc .totals-box{flex:1;}
.invoice-doc .totals-box table{width:100%; border-collapse:collapse; font-size:12px;}
.invoice-doc .totals-box td{padding:5px 14px;}
.invoice-doc .totals-box .label{text-align:right;}
.invoice-doc .totals-box .value{text-align:right; width:120px;}
.invoice-doc .totals-box .net-row td{border-top:1px solid var(--doc-blue); font-weight:800; font-size:13.5px; padding-top:8px;}
.invoice-doc .doc-baht-row{border-top:1px solid var(--doc-blue); text-align:center; padding:8px; font-style:italic; font-size:12px;}
.invoice-doc .signatures{display:flex; gap:14px;}
.invoice-doc .sig-box{flex:1; border:1px solid var(--doc-blue); text-align:center; font-size:11.5px; padding:55px 10px 12px;}
.invoice-doc .sig-box b{display:block; margin-bottom:4px;}
.invoice-doc .sig-date{margin-top:10px; font-size:11px;}

@media print{
  @page{size:A4; margin:15mm;}
  body > *:not(#invoice-print-area){display:none !important;}
  #invoice-print-area{display:block !important; position:absolute; top:0; left:0; width:100% !important; box-sizing:border-box;}
  #invoice-print-area .invoice-doc{width:100%; box-sizing:border-box;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="invoice-print-area"></div>

<script src="/i18n.js"></script>
<script>
/* SiteReq Admin — customer CRM panel (phase 1: login, dashboard, customer companies) */

// See i18n.js for the shared loader. Named tr(), not t(), to stay consistent with pr-system.html
// (which has pre-existing `t` loop variables this avoids colliding with).
function tr(key){ return window.I18N.t(key); }

let S = {
  view: 'login',
  page: 'dashboard',
  currentAdmin: null,
  loginError: '',
  loginBusy: false,
  stats: null,
  companies: [],
  companiesLoaded: false,
  modal: null,          // 'newCompany' | 'companyDetail' | 'account' | 'package' | 'invoice' | 'slips' | 'lead'
  companyForm: null,     // {mode:'new'|'edit', values, saving, error}
  contactForm: null,     // {mode:'new'|'edit', id, values, saving, error}
  renewForm: null,       // {values, saving, error}
  detailCompanyId: null,
  companyDetail: null,   // {company, customers, subscription}
  leads: [],
  leadsLoaded: false,
  leadForm: null,        // {mode:'new'|'edit', id, values, saving, error}
  leadViewId: null,
  accounts: [],
  accountsLoaded: false,
  accountForm: null,     // {mode:'new'|'edit', id, values, saving, error}
  packages: [],
  packagesLoaded: false,
  packageForm: null,     // {mode:'new'|'edit', id, values, saving, error}
  products: [],
  productsLoaded: false,
  productForm: null,     // {mode:'new'|'edit', id, values, saving, error}
  quotations: [],
  quotationsLoaded: false,
  quotationForm: null,   // {mode:'new'|'edit', id, values:{...,items:[]}, saving, error}
  expenses: [],

const RENEW_DURATIONS = [
  { months: 1, days: 30, discount: 0 },
  { months: 3, days: 90, discount: 0.05 },
  { months: 6, days: 180, discount: 0.10 },
  { months: 12, days: 365, discount: 0.17 },
];
function computeRenewTotals(v){
  const dur = RENEW_DURATIONS.find(d => d.months === Number(v.months)) || RENEW_DURATIONS[0];
  const price = Number(v.customPrice) || 0;
  const seatPrice = Number(v.customSeatPrice) || 0;
  const addUsers = Number(v.additionalUsers) || 0;
  const packageCost = price * dur.months;
  const addUsersCost = addUsers * seatPrice * dur.months;
  const subtotal = packageCost + addUsersCost;
  const discountAmount = subtotal * dur.discount;
  return { ...dur, packageCost, addUsersCost, subtotal, discountAmount, total: subtotal - discountAmount };
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function thaiDate(dateStr){
  if(!dateStr) return '-';
  const d = new Date(dateStr);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear() + 543;
  return `${dd}/${mm}/${yyyy}`;
}

function thaiBahtText(amount){
  const digits = ['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
  const positions = ['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  function convertGroup(numStr){
    let out = '';
    const len = numStr.length;
    for(let i = 0; i < len; i++){
      const digit = parseInt(numStr[i], 10);
      const pos = len - i - 1;
      if(digit === 0) continue;
      if(pos === 0 && digit === 1 && len > 1){ out += 'เอ็ด'; continue; }
      if(pos === 1 && digit === 1){ out += 'สิบ'; continue; }
      if(pos === 1 && digit === 2){ out += 'ยี่สิบ'; continue; }
      out += digits[digit] + (positions[pos] || '');
    }
    return out;
  }
  function convert(numStr){
    numStr = numStr.replace(/^0+/, '') || '0';
    if(numStr === '0') return digits[0];
    let out = '';
    while(numStr.length > 6){
      const head = numStr.slice(0, numStr.length - 6);
      out += convertGroup(head) + 'ล้าน';
      numStr = numStr.slice(numStr.length - 6);
    }
    out += convertGroup(numStr);
    return out;
  }
  const rounded = Math.round((Number(amount) || 0) * 100) / 100;
  const intPart = Math.floor(rounded);
  const decPart = Math.round((rounded - intPart) * 100);
  let text = convert(String(intPart)) + 'บาท';
  text += decPart === 0 ? 'ถ้วน' : convertGroup(String(decPart).padStart(2, '0')) + 'สตางค์';
  return text;
}

async function api(method, url, body){
  const res = await fetch(url, {
    method,
    headers: body !== undefined ? {'Content-Type':'application/json'} : undefined,
    credentials: 'include',
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch(e){}
  if(!res.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');
  return data;
}

function isInvoiceDueSoon(i){
  if(i.status !== 'unpaid' || !i.dueDate) return false;
  const due = new Date(i.dueDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.ceil((due - today) / 86400000);
  return diffDays >= 0 && diffDays <= 7;
}

const COA_CATEGORY_LABELS = { asset:'สินทรัพย์', liability:'หนี้สิน', equity:'ส่วนของเจ้าของ', revenue:'รายได้', expense:'ค่าใช้จ่าย' };

const REPORT_TABS = { pl:'กำไรขาดทุน', ar:'ลูกหนี้ค้างชำระ', vat:'ภาษีขาย (VAT)' };
const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function thaiMonthLabel(yyyyMM){
  if(!yyyyMM) return '-';
  const [y, m] = yyyyMM.split('-').map(Number);
  return `${THAI_MONTHS[m - 1]} ${y + 543}`;
}
const fmtBaht = (n, decimals) => Number(n).toLocaleString('th-TH', { minimumFractionDigits: decimals || 0, maximumFractionDigits: decimals || 0 });

function renderReportsPage(){
  const tabs = Object.entries(REPORT_TABS).map(([k,label]) => `<button class="btn ${S.reportTab===k?'btn-navy':'btn-ghost'} btn-sm" data-act="report-tab" data-tab="${k}">${label}</button>`).join('');
  let body = '';
  if(S.reportTab === 'pl') body = renderPLReportBody();
  else if(S.reportTab === 'ar') body = renderARReportBody();
  else if(S.reportTab === 'vat') body = renderVATReportBody();

  return `
    <div class="page-head">
      <div><h2>รายงาน</h2><div class="sub">สรุปข้อมูลการเงินจากใบแจ้งหนี้และรายจ่าย</div></div>
    </div>
    <div class="filter-bar">${tabs}</div>
    ${body}
  `;
}

function renderReportDateFilter(){
  const f = S.reportFilters;
  return `
    <div class="filter-bar">
      <input type="date" data-report-filter="from" value="${esc(f.from)}">

}

  const rows = rep.months.map(m => `
    <tr>
      <td>${thaiMonthLabel(m.month)}</td>
      <td>฿${fmtBaht(m.revenue)}</td>
      <td>฿${fmtBaht(m.expenses)}</td>
      <td style="font-weight:700; color:${m.net>=0?'var(--green)':'var(--red)'};">฿${fmtBaht(m.net)}</td>
    </tr>`).join('');
  return `
    ${renderReportDateFilter()}
    <div class="table-wrap">
      <table>
        <thead><tr><th>เดือน</th><th>รายรับ</th><th>รายจ่าย</th><th>กำไร/ขาดทุนสุทธิ</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="4"><div class="empty">ไม่มีข้อมูลในช่วงเวลานี้</div></td></tr>`}</tbody>
        <tfoot><tr style="font-weight:700;">
          <td>รวม</td><td>฿${fmtBaht(rep.totals.revenue)}</td><td>฿${fmtBaht(rep.totals.expenses)}</td>
          <td style="color:${rep.totals.net>=0?'var(--green)':'var(--red)'};">฿${fmtBaht(rep.totals.net)}</td>
        </tr></tfoot>
      </table>
    </div>
  `;
}

function renderARReportBody(){
  const rep = S.arReport;
  if(!rep) return `<div class="card" style="padding:20px 22px;"><div class="empty">กำลังโหลด...</div></div>`;
  const rows = rep.invoices.map(inv => `
    <tr>
      <td><b>${esc(inv.invoiceNo)}</b></td>
      <td>${esc(inv.companyName)}</td>
      <td>฿${fmtBaht(inv.amount)}</td>
      <td>${esc(inv.dueDate || '-')}</td>
      <td style="font-weight:700; color:${inv.daysOverdue>0?'var(--red)':'var(--text-muted)'};">${inv.daysOverdue!=null ? (inv.daysOverdue>0?inv.daysOverdue+' วัน':'ยังไม่ครบกำหนด') : '-'}</td>
      <td><span class="badge ${inv.status==='overdue'?'badge-overdue':'badge-unpaid'}">${inv.status==='overdue'?'เกินกำหนด':'ยังไม่ชำระ'}</span></td>
    </tr>`).join('');
  return `
    <div style="background:var(--surface-alt); border-radius:var(--radius); padding:14px 18px; margin-bottom:18px; font-size:14px;">ยอดค้างชำระรวม: <b>฿${fmtBaht(rep.totalOutstanding)}</b></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>เลขที่</th><th>บริษัท</th><th>จำนวนเงิน</th><th>ครบกำหนด</th><th>ค้างชำระ</th><th>สถานะ</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6"><div class="empty">ไม่มีลูกหนี้ค้างชำระ</div></td></tr>`}</tbody>
      </table>
    </div>
  `;
}

    ${renderReportDateFilter()}
    <div class="table-wrap">
      <table>

function addDaysToDateStr(dateStr, days){
  if(!dateStr || !days) return null;
  const d = new Date(dateStr);
  d.setDate(d.getDate() + Number(days));
  return d.toISOString().slice(0, 10);
}

async function printInvoice(id, taxRate){
  const invoice = S.invoices.find(i => i.id === id);
  if(!invoice) return;
  if(!S.settingsLoaded){
    try { await loadSettings(); } catch(err){ showToast(err.message, 'err'); return; }
  }
  const settings = S.settings || { company_name:'Build-Con', address:'', contact_phone:'', contact_email:'', tax_id:'', contact_fax:'' };
  const amount = Number(invoice.amount) || 0;
  const rate = Number(taxRate) || 0;
  const taxLabel = rate === 7 ? 'หักภาษี 7%' : rate === 3 ? 'หัก ภาษี ณ ที่จ่าย 3%' : '';
  const tax = amount * (rate / 100);
  const net = amount - tax;
  const fmt = n => n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const QUOTE_VALIDITY_DAYS_FIXED = 7;
  const expireDate = addDaysToDateStr(invoice.dueDate, QUOTE_VALIDITY_DAYS_FIXED);
  const tierLabel = invoice.packageName || (invoice.subTier ? invoice.subTier.charAt(0).toUpperCase() + invoice.subTier.slice(1) : '-');
  const items = [];
  if(invoice.subPeriodStart && invoice.subExpiresAt){
    const rangeLabel = `(${thaiDate(invoice.subPeriodStart)} - ${thaiDate(invoice.subExpiresAt)})`;
    items.push({ label: `ค่าบริการระบบ Build-Con แพ็กเกจ ${esc(tierLabel)} ${rangeLabel}`, amount: fmt(amount) });
    if(invoice.subAdditionalUsers > 0){
      items.push({ label: `ผู้ใช้งานเพิ่ม ${esc(invoice.subAdditionalUsers)} คน ${rangeLabel}`, amount: '' });
    }
  } else {
    items.push({ label: `ค่าบริการระบบ Build-Con แพ็กเกจ ${esc(tierLabel)}`, amount: fmt(amount) });
  }
  const fillerRow = `<tr><td class="filler">&nbsp;</td><td class="filler"></td><td class="filler"></td></tr>`;
  const itemRows = items.map((it, idx) => `<tr style="height:1px;"><td style="text-align:center;">${idx + 1}</td><td>${it.label}</td><td style="text-align:right;">${it.amount}</td></tr>`).join('');
  const itemTableBody = itemRows + fillerRow;

  const html = `
  <div class="doc-page-no">หน้า 1/1</div>
  <div class="doc-topbar"></div>
  <div class="doc-header">
    <img src="/logo.svg" alt="logo" class="doc-logo">
    <div class="doc-company-info">
      <div class="doc-company-name">${esc(settings.company_name)}</div>
      <div class="doc-company-addr">${esc(settings.address || '')}</div>
      <div class="doc-company-contact">
        ${settings.contact_phone ? 'โทร. ' + esc(settings.contact_phone) + '  ' : ''}${settings.contact_fax ? 'โทรสาร ' + esc(settings.contact_fax) + '  ' : ''}${settings.tax_id ? 'เลขประจำตัวผู้เสียภาษี ' + esc(settings.tax_id) : ''}
      </div>
    </div>
  </div>

  <div class="doc-title-row">
    <div class="doc-title">ใบแจ้งหนี้</div>
    <table class="doc-no-table">
      <tr><td>เลขที่</td><td>${esc(invoice.invoiceNo)}</td></tr>
      <tr><td>วันที่</td><td>${thaiDate(invoice.issueDate)}</td></tr>
    </table>
  </div>

  <div class="doc-info-box">
    <div class="doc-info-col">
      <div><b>ชื่อบริษัท</b> ${esc(invoice.companyName)}</div>
      <div><b>เลขผู้เสียภาษี</b> ${esc(invoice.companyTaxId || '-')}</div>
      <div><b>ที่อยู่</b> ${esc(invoice.companyAddress || '-')}</div>
      <div><b>โทร.</b> ${esc(invoice.companyPhone || '-')} &nbsp; <b>โทรสาร</b> ${esc(invoice.companyFax || '-')}</div>
      <div><b>E-mail</b> ${esc(invoice.companyEmail || '-')}</div>
    </div>
    <div class="doc-info-col">
      <div><b>วันครบกำหนด</b> ${invoice.dueDate ? thaiDate(invoice.dueDate) : '-'}</div>
      <div><b>ยืนราคาภายใน (วัน)</b> ${QUOTE_VALIDITY_DAYS_FIXED} วัน</div>
      <div><b>จำนวนวันเครดิต</b> ไม่มี</div>
      <div><b>Expire Date</b> ${expireDate ? thaiDate(expireDate) : '-'}</div>
    </div>
  </div>

  <table class="items">
    <thead><tr><th style="width:8%;">ลำดับ</th><th style="width:62%;">รายการ</th><th>จำนวนเงิน (บาท)</th></tr></thead>
    <tbody>
      ${itemTableBody}
    </tbody>
  </table>

  <div class="doc-bottom-box">
    <div class="doc-bottom-row">
      <div class="doc-note-box">${invoice.note ? `<b>หมายเหตุ:</b> ${esc(invoice.note)}` : ''}</div>
      <div class="totals-box">
        <table>
          <tr><td class="label">ยอดเงิน</td><td class="value">${fmt(amount)}</td></tr>
          ${taxLabel ? `<tr><td class="label">${taxLabel}</td><td class="value">-${fmt(tax)}</td></tr>` : ''}
          <tr class="net-row"><td class="label">จำนวนเงินที่ต้องชำระสุทธิ</td><td class="value">${fmt(net)}</td></tr>
        </table>
      </div>
    </div>
    <div class="doc-baht-row">( ${thaiBahtText(net)} )</div>
  </div>

  <div class="signatures">
    <div class="sig-box"><b>ผู้รับวางบิล</b><div class="sig-date">วันที่ _______________</div></div>
    <div class="sig-box"><b>ผู้มีอำนาจลงนาม</b>${esc(settings.company_name)}<div class="sig-date">วันที่ _______________</div></div>
  </div>`;

  const container = document.getElementById('invoice-print-area');
  container.innerHTML = `<div class="invoice-doc">${html}</div>`;
  const logoImg = container.querySelector('img.doc-logo');
  if(logoImg && !logoImg.complete){
    logoImg.addEventListener('load', () => window.print(), { once: true });
    logoImg.addEventListener('error', () => window.print(), { once: true });
  } else {
    window.print();
  }
}

/* ---------- handlers ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-act]').forEach(el => {
    if(el.__bound) return;
    el.__bound = true;
    el.addEventListener('click', onAction);
  });
  const loginForm = document.querySelector('[data-form="login"]');
  if(loginForm) loginForm.addEventListener('submit', onLoginSubmit);
  const companyForm = document.querySelector('[data-form="company"]');
  if(companyForm) companyForm.addEventListener('submit', onCompanyFormSubmit);
  const contactForm = document.querySelector('[data-form="contact"]');
  if(contactForm) contactForm.addEventListener('submit', onContactFormSubmit);
  const renewForm = document.querySelector('[data-form="renew"]');
  if(renewForm) renewForm.addEventListener('submit', onRenewFormSubmit);
  document.querySelectorAll('[data-form="renew"] [data-calc="renew"]').forEach(el => {
    if(el.__boundCalc) return;
    el.__boundCalc = true;
    el.addEventListener('input', onRenewCalcInput);
  });
  const leadForm = document.querySelector('[data-form="lead"]');
  if(leadForm) leadForm.addEventListener('submit', onLeadFormSubmit);
  const accountForm = document.querySelector('[data-form="account"]');
  if(accountForm) accountForm.addEventListener('submit', onAccountFormSubmit);
  const packageForm = document.querySelector('[data-form="package"]');
  if(packageForm) packageForm.addEventListener('submit', onPackageFormSubmit);
  const invoiceForm = document.querySelector('[data-form="invoice"]');
  if(invoiceForm) invoiceForm.addEventListener('submit', onInvoiceFormSubmit);
  const receivePaymentForm = document.querySelector('[data-form="receivePayment"]');
  if(receivePaymentForm) receivePaymentForm.addEventListener('submit', onReceivePaymentFormSubmit);
  const paymentInvoiceSelect = document.querySelector('[data-act-change="select-payment-invoice"]');
  if(paymentInvoiceSelect) paymentInvoiceSelect.addEventListener('change', onSelectPaymentInvoiceChange);
  const slipUploadForm = document.querySelector('[data-form="slip-upload"]');
  if(slipUploadForm) slipUploadForm.addEventListener('submit', onSlipUploadSubmit);
  const settingsForm = document.querySelector('[data-form="settings"]');
  if(settingsForm) settingsForm.addEventListener('submit', onSettingsFormSubmit);
  const myAccountForm = document.querySelector('[data-form="myAccount"]');
  if(myAccountForm) myAccountForm.addEventListener('submit', onMyAccountFormSubmit);
  const passwordForm = document.querySelector('[data-form="password"]');
  if(passwordForm) passwordForm.addEventListener('submit', onPasswordFormSubmit);
  const filterCompany = document.querySelector('[data-filter="invoice-company"]');
  if(filterCompany) filterCompany.addEventListener('change', onInvoiceFilterChange);
  const filterStatus = document.querySelector('[data-filter="invoice-status"]');
  if(filterStatus) filterStatus.addEventListener('change', onInvoiceFilterChange);
  const invoicePackageSelect = document.querySelector('[data-act-change="fill-invoice-amount"]');
  if(invoicePackageSelect) invoicePackageSelect.addEventListener('change', onInvoicePackageChange);
  const invoiceCompanySelect = document.querySelector('[data-act-change="fill-invoice-from-company"]');
  if(invoiceCompanySelect) invoiceCompanySelect.addEventListener('change', onInvoiceCompanyChange);
  const packageCycleSelect = document.querySelector('[data-act-change="package-cycle-change"]');
  if(packageCycleSelect) packageCycleSelect.addEventListener('change', onPackageCycleChange);
  const coaAccountForm = document.querySelector('[data-form="coaAccount"]');
  if(coaAccountForm) coaAccountForm.addEventListener('submit', onCoaFormSubmit);
  const productForm = document.querySelector('[data-form="product"]');
  if(productForm) productForm.addEventListener('submit', onProductFormSubmit);
  const coaCategorySelect = document.querySelector('[data-act-change="coa-category-change"]');
  if(coaCategorySelect) coaCategorySelect.addEventListener('change', onCoaCategoryChange);
  const quotationForm = document.querySelector('[data-form="quotation"]');
  if(quotationForm) quotationForm.addEventListener('submit', onQuotationFormSubmit);
  document.querySelectorAll('[data-form="quotation"] [data-calc="quotation-item"]').forEach(el => {
    if(el.__boundCalc) return;
    el.__boundCalc = true;
    el.addEventListener('input', onQuotationItemInput);
  });
  document.querySelectorAll('[data-act-change="quotation-item-product"]').forEach(el => {
    if(el.__boundChange) return;
    el.__boundChange = true;
    el.addEventListener('change', onQuotationItemProductChange);
  });
  const expenseForm = document.querySelector('[data-form="expense"]');
  if(expenseForm) expenseForm.addEventListener('submit', onExpenseFormSubmit);
}

async function onAction(e){
  const el = e.currentTarget;
  const act = el.dataset.act;
  const id = el.dataset.id ? parseInt(el.dataset.id, 10) : null;

  try {
    if(act === 'close-modal-overlay' && e.target !== el) return;
    if(act === 'close-modal' || act === 'close-modal-overlay'){
      S.modal = null; S.companyForm = null; S.contactForm = null; S.renewForm = null; S.companyDetail = null; S.detailCompanyId = null;
      S.accountForm = null; S.packageForm = null; S.invoiceForm = null; S.slipsModal = null; S.printTaxModal = null; S.leadForm = null; S.leadViewId = null; S.coaForm = null; S.productForm = null; S.quotationForm = null; S.expenseForm = null;
      render();
    } else if(act === 'nav'){
      S.page = el.dataset.page;
      render();
      if(S.page === 'companies' && !S.companiesLoaded) await loadCompanies();
      else if(S.page === 'leads' && !S.leadsLoaded) await loadLeads();
      else if(S.page === 'accounts' && !S.accountsLoaded) await loadAccounts();
      else if(S.page === 'packages' && !S.invoicesLoaded) await loadInvoices();
      else if(S.page === 'products'){
        if(!S.productsLoaded) await loadProducts();
        if(!S.packagesLoaded) await loadPackages();
      }
      else if(S.page === 'invoices'){
        if(!S.companiesLoaded) await loadCompanies();
        if(!S.packagesLoaded) await loadPackages();
        if(!S.invoicesLoaded) await loadInvoices();
      } else if(S.page === 'receivePayment'){
        if(!S.invoicesLoaded) await loadInvoices();
        if(!S.receivePaymentForm) S.receivePaymentForm = { invoiceId:'', amount:'', paymentDate:new Date().toISOString().slice(0,10), note:'', saving:false, error:'' };
        render();
      } else if(S.page === 'quotations'){
        if(!S.companiesLoaded) await loadCompanies();
        if(!S.productsLoaded) await loadProducts();
        if(!S.quotationsLoaded) await loadQuotations();
      } else if(S.page === 'coa' && !S.coaAccountsLoaded) await loadCoaAccounts();
      else if(S.page === 'expenses'){
        if(!S.coaAccountsLoaded) await loadCoaAccounts();
        if(!S.expensesLoaded) await loadExpenses();
      }
      else if(S.page === 'payables' && !S.expensesLoaded) await loadExpenses();
      else if(S.page === 'journal' && !S.journalEntriesLoaded) await loadJournalEntries();
      else if(S.page === 'reports'){
        if(S.reportTab === 'pl' && !S.plReport) await loadPLReport();
        else if(S.reportTab === 'ar' && !S.arReport) await loadARReport();
        else if(S.reportTab === 'vat' && !S.vatReport) await loadVATReport();
      }
      else if(S.page === 'settings'){
        if(!S.settingsLoaded) await loadSettings();
        if(!S.settingsForm && S.settings){
          S.settingsForm = { values:{ companyName:S.settings.company_name, logoUrl:S.settings.logo_url, address:S.settings.address, contactEmail:S.settings.contact_email, contactPhone:S.settings.contact_phone, taxId:S.settings.tax_id, contactFax:S.settings.contact_fax }, saving:false, error:'' };
        }
        if(!S.myAccountForm) S.myAccountForm = { values:{ name:S.currentAdmin.name }, saving:false, error:'' };
        if(!S.passwordForm) S.passwordForm = { values:{ currentPassword:'', newPassword:'', confirmNewPassword:'' }, saving:false, error:'' };
        render();
      }
    } else if(act === 'set-locale'){
      await I18N.setLocale(el.dataset.locale);
    } else if(act === 'logout'){
      await api('POST', '/api/admin/logout');
      S = {
        view:'login', page:'dashboard', currentAdmin:null, loginError:'', loginBusy:false, stats:null,
        companies:[], companiesLoaded:false, modal:null, companyForm:null, contactForm:null, renewForm:null, detailCompanyId:null, companyDetail:null,
        leads:[], leadsLoaded:false, leadForm:null, leadViewId:null,
        accounts:[], accountsLoaded:false, accountForm:null,
        packages:[], packagesLoaded:false, packageForm:null,
        invoices:[], invoicesLoaded:false, invoiceFilters:{companyId:'',status:''}, invoiceForm:null, slipsModal:null, printTaxModal:null,
        receivePaymentForm:null, receivePaymentHistory:null,
        coaAccounts:[], coaAccountsLoaded:false, coaForm:null,
        products:[], productsLoaded:false, productForm:null,
        quotations:[], quotationsLoaded:false, quotationForm:null,
        expenses:[], expensesLoaded:false, expenseForm:null,
        journalEntries:[], journalEntriesLoaded:false, journalFilters:{from:'',to:'',sourceType:''},
        reportTab:'pl', reportFilters:{from:'',to:''}, plReport:null, arReport:null, vatReport:null,
        settings:null, settingsLoaded:false, settingsForm:null, myAccountForm:null, passwordForm:null,
        toast:null,
      };
      render();
    } else if(act === 'new-company'){
      S.modal = 'newCompany';
      S.companyForm = { mode:'new', values:{ code:generateCompanyCode(), name:'', taxId:'', phone:'', email:'', address:'', packageId:'', fax:'' }, saving:false, error:'' };
      render();
    } else if(act === 'lookup-lead-for-company'){
      const input = document.querySelector('[data-lead-ref-input]');
      const code = input ? input.value.trim() : '';
      if(!code){ showToast('กรุณากรอกรหัสอ้างอิง', 'err'); return; }
      const data = await api('GET', `/api/admin/leads/by-code/${encodeURIComponent(code)}`);
      const l = data.lead;
      Object.assign(S.companyForm.values, { name: l.company_name, taxId: l.tax_id, phone: l.company_phone, email: l.company_email, address: l.address });
      render();
      showToast('ดึงข้อมูลจากรหัสอ้างอิงแล้ว', 'ok');
    } else if(act === 'view-company'){
      S.modal = 'companyDetail'; S.detailCompanyId = id; S.companyDetail = null; S.contactForm = null; S.renewForm = null;
      render();
      await loadCompanyDetail(id);
    } else if(act === 'edit-company'){
      const c = S.companyDetail.company;
      S.companyForm = { mode:'edit', id:c.id, values:{ code:c.code || '', name:c.name, taxId:c.tax_id, phone:c.phone, email:c.email, address:c.address, packageId:c.package_id || '', fax:c.fax || '' }, saving:false, error:'' };
      S.modal = 'newCompany';
      render();
    } else if(act === 'suspend-company'){
      const updated = await api('POST', `/api/admin/companies/${id}/suspend`);
      if(S.companyDetail && S.companyDetail.company.id === id) S.companyDetail.company = updated.company;
      await loadCompanies();
      showToast('อัปเดตสถานะบริษัทแล้ว', 'ok');
    } else if(act === 'delete-company'){
      if(!confirm('ยืนยันการลบบริษัทนี้? ผู้ติดต่อทั้งหมดของบริษัทจะถูกลบไปด้วย')) return;
      await api('DELETE', `/api/admin/companies/${id}`);
      S.modal = null; S.companyDetail = null;
      await loadCompanies();
      showToast('ลบบริษัทแล้ว', 'ok');
    } else if(act === 'new-lead'){
      S.modal = 'lead';
      S.leadForm = { mode:'new', values:{ refCode:generateLeadRefCode(), companyName:'', taxId:'', address:'', companyPhone:'', companyEmail:'', website:'', contactName:'', contactPosition:'', contactEmail:'', contactPhone:'', username:'', status:'new', note:'' }, saving:false, error:'' };
      render();
    } else if(act === 'view-lead'){
      S.modal = 'leadView';
      S.leadViewId = id;
      render();
      await markLeadSeenIfNeeded(id);
    } else if(act === 'edit-lead'){
      const l = S.leads.find(x => x.id === id);
      S.leadForm = { mode:'edit', id, values:{ refCode:l.ref_code || '', companyName:l.company_name, taxId:l.tax_id, address:l.address, companyPhone:l.company_phone, companyEmail:l.company_email, website:l.website, contactName:l.contact_name, contactPosition:l.contact_position, contactEmail:l.contact_email, contactPhone:l.contact_phone, username:l.username || '', status:l.status, note:l.note }, saving:false, error:'' };
      S.modal = 'lead';
      render();
      await markLeadSeenIfNeeded(id);
    } else if(act === 'delete-lead'){
      if(!confirm('ยืนยันการลบรายชื่อนี้?')) return;
      await api('DELETE', `/api/admin/leads/${id}`);
      S.modal = null; S.leadViewId = null; S.leadForm = null;
      await loadLeads();
      showToast('ลบรายชื่อแล้ว', 'ok');
    } else if(act === 'new-contact'){
      S.contactForm = { mode:'new', values:{ name:'', email:'', phone:'', position:'', username:'', password:generateRandomPassword(), role:'super_user' }, saving:false, error:'' };
      render();
    } else if(act === 'generate-contact-password'){
      S.contactForm.values.password = generateRandomPassword();
      render();
    } else if(act === 'lookup-lead-for-contact'){
      const input = document.querySelector('[data-lead-ref-input-contact]');
      const code = input ? input.value.trim() : '';
      if(!code){ showToast('กรุณากรอกรหัสอ้างอิง', 'err'); return; }
      const data = await api('GET', `/api/admin/leads/by-code/${encodeURIComponent(code)}`);
      const l = data.lead;
      Object.assign(S.contactForm.values, { name: l.contact_name, position: l.contact_position, email: l.contact_email, phone: l.contact_phone, username: l.username || '' });
      render();
      showToast('ดึงข้อมูลผู้ติดต่อจากรหัสอ้างอิงแล้ว', 'ok');
    } else if(act === 'edit-contact'){
      const cu = S.companyDetail.customers.find(x => x.id === id);
      S.contactForm = { mode:'edit', id, values:{ name:cu.name, email:cu.email, phone:cu.phone, position:cu.position, username:cu.username || '', password:'', role:cu.role || 'super_user' }, saving:false, error:'' };
      render();
    } else if(act === 'cancel-contact-form'){
      S.contactForm = null;
      render();
    } else if(act === 'new-renew'){
      if(!S.packagesLoaded) await loadPackages();
      const sub = S.companyDetail.subscription;
      const pkg = S.packages.find(p => String(p.id) === String(S.companyDetail.company.package_id));
      S.renewForm = {
        values: {
          customPrice: pkg ? pkg.price : 0,
          customSeatPrice: sub && sub.custom_seat_price != null ? sub.custom_seat_price : 0,
          baseUsers: pkg ? pkg.max_users : 1,
          additionalUsers: 0,
          months: 1,
        },
        saving: false, error: '',
      };
      render();
    } else if(act === 'cancel-renew-form'){
      S.renewForm = null;
      render();
    } else if(act === 'renew-duration'){
      S.renewForm.values.months = parseInt(el.dataset.months, 10);
      render();

      const field = el.dataset.field;
      const dir = parseInt(el.dataset.dir, 10);

      v[field] = Math.max(0, (Number(v[field]) || 0) + dir);

    } else if(act === 'edit-package'){

function renderRenewSummaryRows(t){
  const addUsers = Number(S.renewForm.values.additionalUsers) || 0;
  const rows = [
    `<div class="row"><span>แพ็กเกจ (${t.days} วัน)</span><span>฿${t.packageCost.toLocaleString('th-TH')}</span></div>`,
    `<div class="row"><span>เพิ่มคนใช้งาน (${addUsers}คน)</span><span>฿${t.addUsersCost.toLocaleString('th-TH')}</span></div>`,
  ];
  if(t.discountAmount > 0){
    rows.push(`<div class="row discount"><span>ส่วนลด (${Math.round(t.discount * 100)}%)</span><span>-฿${t.discountAmount.toLocaleString('th-TH')}</span></div>`);
  }
  rows.push(`<div class="row total"><span>ยอดรวม</span><span>฿${t.total.toLocaleString('th-TH')}</span></div>`);
  return rows.join('');
}

function onQuotationItemInput(e){
  const f = S.quotationForm;
  if(!f || !f.values) return;
  const idx = parseInt(e.target.dataset.idx, 10);
  const field = e.target.dataset.field;
  f.values.items[idx][field] = e.target.value;
  const lineTotal = it => (Number(it.qty) || 0) * (Number(it.unitPrice) || 0) - (Number(it.discount) || 0);
  const fmt = n => n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const lineOut = document.querySelector(`[data-line-total="${idx}"]`);
  if(lineOut) lineOut.textContent = '฿' + fmt(lineTotal(f.values.items[idx]));
  const totalOut = document.querySelector('[data-calc-out="quotation-total"]');
  if(totalOut) totalOut.textContent = 'รวมทั้งสิ้น: ฿' + fmt(f.values.items.reduce((sum, it) => sum + lineTotal(it), 0));
}

function onQuotationItemProductChange(e){
  const f = S.quotationForm;
  if(!f || !f.values) return;
  const idx = parseInt(e.target.dataset.idx, 10);
  const productId = e.target.value;
  const product = S.products.find(p => String(p.id) === String(productId));
  f.values.items[idx].productId = productId;
  if(product){
    f.values.items[idx].description = product.name;
    f.values.items[idx].unitPrice = product.price;
    f.values.items[idx].unit = product.unit || '';
  }
  render();
}

    if(f.mode === 'edit') await api('PUT', `/api/admin/quotations/${f.id}`, body);
    else await api('POST', '/api/admin/quotations', body);
    S.modal = null; S.quotationForm = null;
    await loadQuotations();
    showToast(f.mode === 'edit' ? 'แก้ไขใบเสนอราคาแล้ว' : 'สร้างใบเสนอราคาแล้ว', 'ok');
  } catch(err){
    f.saving = false; f.error = err.message;
    render();
  }
}

async function onInvoiceFormSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const f = S.invoiceForm;
  const body = { companyId: fd.get('companyId'), packageId: fd.get('packageId') || null, amount: fd.get('amount'), dueDate: fd.get('dueDate'), note: fd.get('note') };
  Object.assign(f.values, body);
  f.saving = true; f.error = '';
  render();
  try {
    await api('POST', '/api/admin/invoices', body);
    S.modal = null; S.invoiceForm = null;
    S.invoicesLoaded = false;
    await loadInvoices();
    await loadStats();
    showToast('บันทึกใบแจ้งหนี้แล้ว', 'ok');
  } catch(err){
    f.saving = false; f.error = err.message;
    render();
  }
}

async function onSelectPaymentInvoiceChange(e){
  const invoiceId = e.target.value;
  S.receivePaymentForm.invoiceId = invoiceId;
  S.receivePaymentForm.amount = '';
  S.receivePaymentForm.error = '';
  S.receivePaymentHistory = null;
  render();
  if(invoiceId) await loadInvoicePayments(invoiceId);
}

async function onReceivePaymentFormSubmit(e){
  e.preventDefault();
  const f = S.receivePaymentForm;
  const fd = new FormData(e.target);
  const invoiceId = fd.get('invoiceId');
  const body = { amount: fd.get('amount'), paymentDate: fd.get('paymentDate'), note: fd.get('note') };
  f.amount = body.amount; f.paymentDate = body.paymentDate; f.note = body.note;
  f.saving = true; f.error = '';
  render();
  try {
    await api('POST', `/api/admin/invoices/${invoiceId}/payments`, body);
    await loadInvoices();
    await loadInvoicePayments(invoiceId);
    await loadStats();
    S.receivePaymentForm = { invoiceId, amount:'', paymentDate:new Date().toISOString().slice(0,10), note:'', saving:false, error:'' };
    render();
    showToast('บันทึกรับชำระเงินแล้ว', 'ok');
  } catch(err){
    f.saving = false; f.error = err.message;
    render();
  }
}

async function onSettingsFormSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const f = S.settingsForm;
  const body = { companyName: fd.get('companyName'), logoUrl: fd.get('logoUrl'), address: fd.get('address'), contactEmail: fd.get('contactEmail'), contactPhone: fd.get('contactPhone'), taxId: fd.get('taxId'), contactFax: fd.get('contactFax') };
  Object.assign(f.values, body);
  f.saving = true; f.error = '';
  render();
  try {
    await api('PUT', '/api/admin/settings', body);
    f.saving = false;
    showToast('บันทึกข้อมูลบริษัทแล้ว', 'ok');
    render();
  } catch(err){
    f.saving = false; f.error = err.message;
    render();
  }
}

async function onMyAccountFormSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const f = S.myAccountForm;
  f.values.name = fd.get('name');
  f.saving = true; f.error = '';
  render();
  try {
    const data = await api('PUT', '/api/admin/account', { name: f.values.name });
    S.currentAdmin = data.admin;
    f.saving = false;
    showToast('บันทึกชื่อแล้ว', 'ok');
    render();
  } catch(err){
    f.saving = false; f.error = err.message;
    render();
  }
}

async function onPasswordFormSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const f = S.passwordForm;
  const currentPassword = fd.get('currentPassword');
  const newPassword = fd.get('newPassword');
  const confirmNewPassword = fd.get('confirmNewPassword');
  f.values = { currentPassword, newPassword, confirmNewPassword };
  if(newPassword !== confirmNewPassword){
    f.error = 'รหัสผ่านใหม่ไม่ตรงกัน';
    render();
    return;
  }
  f.saving = true; f.error = '';
  render();
  try {
    await api('POST', '/api/admin/account/password', { currentPassword, newPassword });
    f.saving = false;
    f.values = { currentPassword:'', newPassword:'', confirmNewPassword:'' };
    showToast('เปลี่ยนรหัสผ่านแล้ว', 'ok');
    render();
  } catch(err){
    f.saving = false; f.error = err.message;
    render();
  }
}

function onPackageCycleChange(e){
  S.packageForm.values.billingCycle = e.target.value;
  render();
}

function onCoaCategoryChange(e){
  S.coaForm.values.category = e.target.value;
  S.coaForm.values.parentCode = '';
  render();
}

async function onInvoiceFilterChange(){
  const companySel = document.querySelector('[data-filter="invoice-company"]');
  const statusSel = document.querySelector('[data-filter="invoice-status"]');
  S.invoiceFilters = { companyId: companySel.value, status: statusSel.value };
  try { await loadInvoices(); } catch(err){ showToast(err.message, 'err'); }
}

function onInvoicePackageChange(e){
  const pkg = S.packages.find(p => String(p.id) === String(e.target.value));
  const amountInput = document.querySelector('[data-form="invoice"] [name="amount"]');
  if(pkg && amountInput) amountInput.value = pkg.price;
}

async function onInvoiceCompanyChange(e){
  const companyId = e.target.value;
  if(!companyId) return;
  const packageSelect = document.querySelector('[data-form="invoice"] [name="packageId"]');
  const amountInput = document.querySelector('[data-form="invoice"] [name="amount"]');
  const dueDateInput = document.querySelector('[data-form="invoice"] [name="dueDate"]');
  try {
    const data = await api('GET', `/api/admin/companies/${companyId}`);
    const pkg = S.packages.find(p => String(p.id) === String(data.company.package_id));
    if(packageSelect) packageSelect.value = data.company.package_id ? String(data.company.package_id) : '';
    if(amountInput){
      const sub = data.subscription;
      const price = sub && sub.total_amount != null ? sub.total_amount : (sub && sub.custom_price != null ? sub.custom_price : (pkg ? pkg.price : ''));
      amountInput.value = price;
    }
    if(dueDateInput){
      dueDateInput.value = data.subscription && data.subscription.expires_at ? data.subscription.expires_at.slice(0, 10) : '';
    }
  } catch(err){
    showToast(err.message, 'err');
  }
}

/* ---------- boot ---------- */
I18N.onChange(render);
(async function boot(){
  await I18N.init();
  try {
    const data = await api('GET', '/api/admin/me');
    S.currentAdmin = data.admin;
    S.view = 'dashboard';
    render();
    await loadStats();
    await loadPackages();
  } catch(err){
    render();
  }
})();
</script>
