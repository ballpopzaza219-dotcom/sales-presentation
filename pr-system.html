// ---------------- แผนงาน Phase 3: project-wide cumulative S-curve (แผนงาน orange / ผลงาน sky) --------
// The phase-3 request says "ใช้ recharts (มีอยู่แล้วในระบบ)" — but recharts is a React charting
// library, and this whole app (pr-system.html) has no React/JSX/bundler anywhere; it's plain <script>
// tags against a global `S` object (see i18n.js's own header comment on exactly this point). recharts
// was never actually "already in the system" to reuse. What IS already in this system, for this exact
// feature, is a hand-rolled inline-SVG line chart — that was how the earlier (now superseded)
// renderSCurveChart() worked before the whole page got rebuilt — so that's what this reimplements,
// rather than pulling in React+recharts for one chart in an otherwise dependency-free page.
// A task's cumulative % (planned or actual) AS OF a given date = sum of every period value for that
// task on or before that date.
function scheduleTaskCumulativeAt(taskId, field, uptoDate){
  let sum = 0;
  for(const p of S.taskPeriods){
    if(p.taskId===taskId && p.periodDate<=uptoDate) sum += Number(p[field])||0;
  }
  return Math.round(sum*10)/10;
}
// One point per grid column (SAME columns the table above is currently showing, so switching zoom
// re-buckets both together) — project-wide cumulative % at that column = SUM over every task of
// (task's งบประมาณ(%) ÷ 100, from Phase 1) × (that task's own cumulative % as of this column's END
// date) — the exact weighting formula from the phase-3 request.
function computeProjectSCurve(tasks, columns, totalBudget){
  return columns.map(col=>{
    let planned=0, actual=0;
    for(const t of tasks){
      const weight = totalBudget>0 ? (Number(t.budgetAmount)||0)/totalBudget : 0;
      if(weight===0) continue;
      planned += weight * scheduleTaskCumulativeAt(t.id, 'plannedPercent', col.dayEnd);
      actual += weight * scheduleTaskCumulativeAt(t.id, 'actualPercent', col.dayEnd);
    }
    return {planned: Math.round(planned*1000)/1000, actual: Math.round(actual*1000)/1000};
  });
}
// The column index (into `columns`) that contains today's real date, or -1 if the whole displayed
// range is entirely in the past or future. Shared by the "วันนี้" highlight on the task table + summary
// rows below AND the S-curve chart's own today marker, so all three always agree on which column is
// "today" — same `columns` array in, same index out, by construction.
function scheduleTodayColumnIndex(columns){
  const today = new Date().toISOString().slice(0,10);
  return columns.findIndex(c=>today>=c.dayStart && today<=c.dayEnd);
}
function scheduleTodayCellStyle(colIdx, todayColIdx){
  return colIdx===todayColIdx ? 'box-shadow: inset 0 0 0 1000px rgba(216,27,96,0.16);' : '';
}

// ---------------- แผนงาน project summary rows (below the individual task grid) — 4 แผนงาน + 4 ผลงาน
// rows aggregating every task into one project-wide view. Rows 1/5 (ความคืบหน้า, period-only) and 2/6
// (ความคืบหน้าสะสม) use the SAME per-column granularity as the grid above (reusing
// computeProjectSCurve's cumulative values directly for 2/6 — literally the same numbers the S-curve
// chart plots). Rows 3/4/7/8 (ค่าใช้จ่าย/เดือน) are computed at CALENDAR-MONTH granularity always,
// independent of the currently displayed zoom, then merged across however many day/week/ว1-4 display
// columns fall in each month — see scheduleMonthSpans().
function computeProjectPeriodPct(cumulative, field){
  return cumulative.map((pt,i)=> Math.round((pt[field] - (i>0?cumulative[i-1][field]:0))*10)/10 );
}
// Contiguous calendar-month groupings of the CURRENT display columns — {monthKey:'YYYY-MM', startIdx,
// span}. Works the same way at every zoom: 'day'/'week' zoom's 1-day columns each belong to exactly
// one month (spans can be long); 'month' zoom's ว1-4 buckets all share their own month's prefix too
// (spans are always exactly 4), so no special-casing per zoom level is needed.
function scheduleMonthSpans(columns){
  const spans = [];
  let i=0;
  while(i<columns.length){
    const monthKey = columns[i].dayStart.slice(0,7);
    let span=0;
    while(i+span<columns.length && columns[i+span].dayStart.slice(0,7)===monthKey) span++;
    spans.push({monthKey, startIdx:i, span});
    i+=span;
  }
  return spans;
}
// A task's own % earned specifically within calendar month `monthKey` — sum of that task's daily
// period values whose date falls in that month, regardless of which columns are currently displayed.
function taskPercentInMonth(taskId, field, monthKey){
  let sum = 0;
  for(const p of S.taskPeriods){
    if(p.taskId===taskId && p.periodDate.slice(0,7)===monthKey) sum += Number(p[field])||0;
  }
  return Math.round(sum*100)/100;
}
// ค่าใช้จ่าย/เดือน (บาท) per month span = SUM over every task of budget_amount × (that task's % earned
// in that month ÷ 100).
function computeMonthlyExpenditure(tasks, monthSpans, field){
  return monthSpans.map(span=>{
    let baht = 0;
    for(const t of tasks) baht += (Number(t.budgetAmount)||0) * (taskPercentInMonth(t.id, field, span.monthKey)/100);
    return Math.round(baht*100)/100;
  });
}
function computeProjectSummaryRows(tasks, columns, totalBudget){
  const cumulative = computeProjectSCurve(tasks, columns, totalBudget);
  const periodPlanned = computeProjectPeriodPct(cumulative, 'planned');
  const periodActual = computeProjectPeriodPct(cumulative, 'actual');
  const monthSpans = scheduleMonthSpans(columns);
  const monthlyPlanned = computeMonthlyExpenditure(tasks, monthSpans, 'plannedPercent');
  const monthlyActual = computeMonthlyExpenditure(tasks, monthSpans, 'actualPercent');
  const cumMonthlyPlanned = []; let runP=0; for(const v of monthlyPlanned){ runP=Math.round((runP+v)*100)/100; cumMonthlyPlanned.push(runP); }
  const cumMonthlyActual = []; let runA=0; for(const v of monthlyActual){ runA=Math.round((runA+v)*100)/100; cumMonthlyActual.push(runA); }
  return {cumulative, periodPlanned, periodActual, monthSpans, monthlyPlanned, monthlyActual, cumMonthlyPlanned, cumMonthlyActual};
}

// ---------------- แผนงาน S-curve overlay (2026-07-27 rewrite — supersedes the earlier standalone-card
// chart above) — draws the same 2 cumulative lines (แผนงาน orange / ผลงาน sky) directly ON TOP of the
// task table's own day/week/month grid, instead of in a separate section below it, per the user's own
// reference image: the lines should visually pass over the grid, aligned column-for-column with the
// same time axis the per-task %/values already use, not live in a disconnected box.
//
// Unlike the old standalone chart (a fixed CH=160px-tall SVG, independent of the table), this overlay's
// vertical extent must exactly match however tall the task-rows band ACTUALLY renders — which varies with
// task count, on-screen vs. print font-size (8px under @media print), and window width (text wrapping) —
// none of which can be predicted from ctx alone. So building this is split in two:
//  1. buildScheduleChartOverlaySvgContent(ctx, width, height) — pure function, given the REAL pixel
//     width/height the SVG will render at, returns its inner markup in a plain 1:1 pixel coordinate
//     system (no viewBox stretching/preserveAspectRatio tricks — those would squash circles into
//     ellipses under the very non-square aspect ratios a many-task/many-column grid can have).
//  2. updateScheduleChartOverlay() — measures the ACTUAL rendered task-rows band via
//     getBoundingClientRect()-adjacent offsetTop/offsetLeft (see the sched-task-row/sched-grid-td
//     markers renderProjectScheduleTable() now emits), sets the #schedule-chart-overlay <svg>'s
//     position/size to match, and injects (1)'s output. Called after every render() (attachHandlers(),
//     same convention as wireScheduleScrollSync()).
function buildScheduleChartOverlaySvgContent(ctx, width, height){
  const {tasks, totalBudget, columns, todayColIdx} = ctx;
  const curve = computeProjectSCurve(tasks, columns, totalBudget);
  // 2026-07-28 spec rewrite (exact reference-area/coordinate-mapping spec provided): y(0%) must land
  // EXACTLY at the overlay's own bottom edge (height) and y(100%) EXACTLY at its top edge (0) — no inset.
  // (The previous padY inset existed only to keep the now-REMOVED per-point <circle> markers from
  // getting half-clipped at the edges; with no markers left to clip, the inset no longer serves a
  // purpose and was actively fighting the spec's "y(0)=referenceBottom exactly" requirement.)
  const toY = (pct)=> height * (1 - Math.min(100,Math.max(0,pct))/100);
  // Point i sits at the RIGHT EDGE of column i — kept deliberately (a 2026-07-28 spec draft asked for
  // center-of-column instead; confirmed with the user this would reintroduce a specific, 3-times-reported
  // bug this exact formula was built to fix: the line "stopping short of the true grid edge." Edge-
  // anchoring guarantees the LAST point always lands exactly on the true last column's right edge,
  // matching "the line must end at the last time column" regardless of column count/width drift from
  // table-layout:auto (see width's own long comment above this function for that history).
  const toX = (i)=> (i+1)/columns.length*width;
  const toPoints = (field)=> curve.map((pt,i)=>`${toX(i).toFixed(1)},${toY(pt[field]).toFixed(1)}`).join(' ');
  // "วันนี้" line — same interpolation/todayColIdx as the table's own pink cell highlight
  // (scheduleTodayCellStyle) so both always land on the exact same column, just drawn as a line spanning
  // the whole task-rows band here instead of a per-cell tint.
  const today = new Date().toISOString().slice(0,10);
  let todayLine = '';
  if(todayColIdx>=0){
    const col = columns[todayColIdx];
    const span = scheduleDayDiff(col.dayStart, col.dayEnd)+1;
    const frac = span>1 ? scheduleDayDiff(col.dayStart, today)/span : 0.5;
    const tx = (todayColIdx + (span>1?frac:0.5)) / columns.length * width;
    todayLine = `<line x1="${tx.toFixed(1)}" y1="0" x2="${tx.toFixed(1)}" y2="${height}" stroke="var(--red)" stroke-width="2" stroke-dasharray="4,3" opacity="0.85"/>`;
  }
  // No axis gridlines/%-labels, no per-point %-labels, and (2026-07-28 spec) no per-point circle markers
  // either — just the 2 plain lines, straight segments only (no smoothing), fixed stroke-width — this
  // sits directly over cells that already show their own %/values, so a solid, otherwise-undecorated line
  // reads clearly without duplicating/crowding out what's already printed in each cell.
  //
  // stroke-width:1.5, identical constant for BOTH screen and print (no per-context compensation/override
  // anywhere else in the codebase anymore — the 2026-07-28 spec explicitly asked for one fixed, simple
  // value here, not a value computed differently per zoom/paper-size/task-count). Disclosed: print's own
  // `zoom` (used to fit a wide/tall table onto one physical page) is a real CSS rendering-level scale, so
  // the FINAL on-page rendered width still ends up `1.5 * zoom` in absolute terms — same as how this
  // print pipeline already lets table font-size/border-width ride the same zoom without a compensating
  // override (this fix removes the S-curve's own EARLIER special-cased exception to that, matching the
  // spec's own "not scaled differently from anything else" framing) — not a claim that the physical pixel
  // count is literally identical across every paper size/zoom in this print pipeline.
  return `${todayLine}
    <polyline data-scurve="planned" points="${toPoints('planned')}" fill="none" stroke="var(--orange)" stroke-width="1.5"/>
    <polyline data-scurve="actual" points="${toPoints('actual')}" fill="none" stroke="var(--sky)" stroke-width="1.5"/>`;
}
function updateScheduleChartOverlay(){
  const main = document.getElementById('schedule-scroll-main');
  const svg = document.getElementById('schedule-chart-overlay');
  if(!main || !svg) return;
  const rows = main.querySelectorAll('.sched-task-row');
  const gridTds = main.querySelectorAll('.sched-grid-td');
  const firstGridTd = gridTds[0];
  const ctx = computeScheduleRenderContext();
  if(rows.length===0 || !firstGridTd || ctx.columns.length===0 || ctx.totalBudget<=0){
    svg.style.display = 'none';
    return;
  }
  // offsetTop/offsetLeft (not getBoundingClientRect) are relative to #schedule-scroll-main itself (its
  // nearest positioned ancestor, now position:relative — see the .table-wrap CSS comment) and, crucially,
  // scroll-position-independent — the SAME real px values whether the user has scrolled the wide grid
  // left/right or not, which is exactly what an absolutely-positioned overlay inside a scrolling
  // container needs to line up correctly at any scroll offset.
  const top = rows[0].offsetTop;
  // The BOTTOM anchor must reach the true last row of the WHOLE task list, including any NOT-YET-SAVED
  // rows (pulled-but-unsaved BOQ items, or manual rows — newRowHtml()'s <tr class="sched-newrow">, always
  // rendered AFTER every .sched-task-row, see the `rows` concatenation above savedRowHtml()/newRowHtml()
  // are joined from). Querying ONLY `.sched-task-row` here stops the height short whenever such rows
  // exist, making the line visually "start too high" — 2026-07-28 report: a real 32-task project with
  // some pending (pulled-but-unsaved) rows showed the line beginning around row 28-29 instead of the true
  // last row 32. `top` itself is unaffected — unsaved rows are always appended AFTER saved ones, so the
  // FIRST row is always a real .sched-task-row regardless.
  const lastRowCandidates = main.querySelectorAll('.sched-task-row, .sched-newrow');
  const last = lastRowCandidates[lastRowCandidates.length-1];
  const height = Math.max(1, (last.offsetTop+last.offsetHeight) - top);
  const left = firstGridTd.offsetLeft;
  // Measured from the REAL rightmost grid cell, NOT columns.length*ctx.colWidth — that JS constant is
  // only what each grid input's OWN inline style asks for; table-layout:auto can (and, confirmed via
  // real getBoundingClientRect() measurements on a live project, DOES) render every column meaningfully
  // wider than that (other cells sharing the same column with no explicit width, e.g. the project summary
  // rows' %-cells, plus this table's own global `table{width:100%}` rule, both inflate the true rendered
  // column width). Using the LAST actual .sched-grid-td's right edge instead means the overlay's width
  // always matches the table's true geometry regardless of why/how much CSS inflates it.
  const lastGridTd = gridTds[gridTds.length-1];
  const width = Math.max(1, (lastGridTd.offsetLeft + lastGridTd.offsetWidth) - left);
  svg.style.cssText = `position:absolute; pointer-events:none; left:${left}px; top:${top}px; width:${width}px; height:${height}px; display:block;`;
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.innerHTML = buildScheduleChartOverlaySvgContent(ctx, width, height);
}

// ---------------- แผนงาน print engine (2026-07-27 rebuild — an ENTIRELY custom in-app print-settings
// modal replaces the old direct-window.print()/A4-A3-button feature removed earlier today; see this
// page's own memory file for the 4-round print-fit debugging history this rebuild is designed to avoid
// repeating). The core idea, per the request: compute EVERY layout number (paper px, margin px, scale)
// in JS from known constants, rather than trusting the browser's own print engine to interpret an
// author-supplied @page margin/scale consistently — @page's `margin` is ALWAYS 0 here (see the
// @media print CSS's own #schedule-print-frame usage below); the visual margin is instead real CSS
// `padding` on #schedule-print-frame, sized in px from the SAME mm constant the @page `size` itself
// uses, so the two can never silently disagree the way "trust the browser's own interpretation of an
// author margin" could.
//
// 96 CSS px per inch ÷ 25.4mm per inch — a fixed CSS-spec constant (not a browser default setting),
// the same ratio Chrome's print pipeline itself uses to rasterize CSS lengths onto a physical page size
// declared in mm via @page{size}. Safe to hardcode for exactly that reason.
const SCHEDULE_PRINT_MM_TO_PX = 96/25.4;
// Paper sizes, already LANDSCAPE (width > height) — orientation is not user-selectable per the request
// ("บังคับเป็นแนวนอนเสมอ ไม่ต้องให้เลือก"), this table is always wide, never tall.
const SCHEDULE_PRINT_PAPER_MM = { A4:{w:297,h:210}, A3:{w:420,h:297} };
// Margin presets in mm, all 4 sides equal — tuned starting points per the request, not yet re-tuned
// against a real print run (see the verification writeup for how these actually measured out).
const SCHEDULE_PRINT_MARGIN_MM = { normal:15, narrow:6, wide:25 };

// Measures #schedule-print-frame's REAL rendered pixel size in whatever inline-style state it's
// currently in (including whatever `zoom` is applied). Confirmed via direct testing against this page's
// own real 77-task project (the exact project this feature's whole print-fit history was debugged
// against): `scrollWidth`/`scrollHeight`/`offsetWidth`/`offsetHeight` read ON an element that itself has
// `zoom` applied report sizes in that element's own LOCAL (pre-zoom) coordinate system — they get
// LARGER, not smaller, as zoom shrinks, the opposite of what a fit loop needs.
// `getBoundingClientRect()` is the one measurement that reliably reports the REAL, external, post-zoom
// visual size — this matches what this page's own prior (now-removed) print-fit implementation already
// established ("after applying zoom, getBoundingClientRect() the ACTUAL result..."), so this rebuild
// reuses the same validated technique rather than the naive scrollWidth/scrollHeight this function
// started with (which measured as "stuck"/inflating instead of shrinking when first tested live).
//
// Height: frame's OWN getBoundingClientRect().height is trustworthy even when the table inside overflows
// horizontally — vertical extent is normal auto-height block flow (never clipped, overflow:visible),
// so it already sums every in-flow descendant's real height correctly.
// Width: frame's OWN getBoundingClientRect().width is NOT usable — a block box with an explicit width
// doesn't grow to contain a wider overflowing child (the whole point of CSS overflow), so it always just
// reports frame's own fixed paper width regardless of the table's true size. The <table> itself is what
// actually overflows (this table's global `table{width:100%}` rule can't compress it below its natural
// per-column content width under table-layout:auto — confirmed live: table width stayed ~14000px real
// content vs. frame's own fixed ~1122px box), so the table's OWN gBCR is what carries the real width.
function scheduleMeasurePrintFrame(frame){
  const table = frame.querySelector('table');
  const w = table ? table.getBoundingClientRect().width : frame.getBoundingClientRect().width;
  const h = frame.getBoundingClientRect().height;
  return { w, h };
}

// Applies the user's modal choices (or sensible defaults, if the page's own print button was never used
// and this fired from a plain native Ctrl+P) as real inline style on #schedule-print-frame — ONLY ever
// called from the 'beforeprint' listener below, so on-screen rendering is untouched outside the brief
// print transition itself (same convention this page's print feature always used before its removal).
function scheduleApplyPrintLayout(){
  const frame = document.getElementById('schedule-print-frame');
  if(!frame) return; // not currently on the แผนงาน page — nothing to do
  const settings = S.schedulePrintSettings || {paperSize:'A4', scaleMode:'fit-page', margin:'normal'};
  const paper = SCHEDULE_PRINT_PAPER_MM[settings.paperSize] || SCHEDULE_PRINT_PAPER_MM.A4;
  const marginMm = SCHEDULE_PRINT_MARGIN_MM[settings.margin] ?? SCHEDULE_PRINT_MARGIN_MM.normal;
  const paperWpx = paper.w*SCHEDULE_PRINT_MM_TO_PX, paperHpx = paper.h*SCHEDULE_PRINT_MM_TO_PX;
  const marginPx = marginMm*SCHEDULE_PRINT_MM_TO_PX;
  const targetW = paperWpx - 2*marginPx, targetH = paperHpx - 2*marginPx;

  let pageStyle = document.getElementById('schedule-print-page-style');
  if(!pageStyle){ pageStyle = document.createElement('style'); pageStyle.id = 'schedule-print-page-style'; document.head.appendChild(pageStyle); }
  // margin:0 ALWAYS — see this function's own header comment; the real visual margin is the frame's
  // padding below, sized from the exact same mm→px constant.
  pageStyle.textContent = `@page{ size:${paper.w}mm ${paper.h}mm; margin:0; }`;

  // Reset any stale zoom from a previous print pass before measuring, then lock the frame to its real
  // print-box shape (fixed full-paper width, padding-as-margin) — every measurement from here on happens
  // in this exact final context, not some other stand-in context (see scheduleMeasurePrintFrame()).
  frame.style.zoom = '';
  frame.style.boxSizing = 'border-box';
  frame.style.width = `${paperWpx}px`;
  frame.style.padding = `${marginPx}px`;

  let zoom = 1, worst = 1;
  if(settings.scaleMode!=='normal'){
    void frame.offsetHeight;
    const natural = scheduleMeasurePrintFrame(frame);
    if(natural.w>0 && natural.h>0){
      const zx = targetW/natural.w, zy = targetH/natural.h;
      zoom = settings.scaleMode==='fit-width' ? zx : settings.scaleMode==='fit-height' ? zy : Math.min(zx, zy);
      // Self-correcting: CSS zoom on a large real table doesn't always scale its real (gBCR) size by the
      // EXACT predicted factor (confirmed on this exact page, a real 77-task/539-row project, before
      // print was removed) — rather than trust the theoretical zoom*naturalSize prediction, re-measure
      // the REAL result at each candidate zoom and correct toward it. Bounded to 4 passes (matches this
      // page's own prior convergence behavior).
      for(let i=0;i<4;i++){
        zoom = Math.max(0.05, Math.min(zoom, 3));
        frame.style.zoom = String(zoom);
        void frame.offsetHeight;
        const sized = scheduleMeasurePrintFrame(frame);
        if(settings.scaleMode==='fit-width') worst = sized.w/targetW;
        else if(settings.scaleMode==='fit-height') worst = sized.h/targetH;
        else worst = Math.max(sized.w/targetW, sized.h/targetH);
        if(worst<=1.005) break;
        zoom = zoom/worst*0.995;
      }
    }
  }
  frame.style.zoom = String(Math.max(0.05, Math.min(zoom, 3)));
  // A genuine physical floor exists (font/border rendering has a real minimum size — confirmed on this
  // exact page's own 77-task test project: a project with enough task ROWS can need more real vertical
  // space than ANY zoom reduction can shrink it below, because rows stop shrinking once fonts/borders hit
  // that floor). Rather than silently override the user's own explicit paper-size choice (the old, now-
  // removed print feature's auto-A3-upgrade did exactly that, which this modal's whole point is to avoid
  // repeating), a real residual miss (>10%) is surfaced as a toast AFTER the print interaction finishes
  // (see scheduleResetPrintLayout() below) — never mid-print, since calling render() here would blow away
  // the very frame this function is still styling.
  S.schedulePrintLastOvershoot = (settings.scaleMode!=='normal' && worst>1.1) ? worst : null;

  // FILL UNUSED WIDTH (2026-07-27, reported: "fit page" left a large blank strip on the right of the
  // printed page). "fit page" only guarantees content FITS (zoom = the SMALLER of the width- and
  // height-bound factors) — it never promised to FILL both dimensions. For a project with many task rows
  // but a short date range, HEIGHT is usually the binding constraint, leaving real width slack that
  // showed up as wasted blank page space. Fix: grow the day-grid's own column cells (a real layout
  // change — width on `.sched-period-cell`/`.sched-grid-td`, injected via a dynamic stylesheet, same
  // technique already used for @page) to consume that slack, rather than a paint-only
  // `transform:scaleX()` fake-stretch. This is safe for pagination specifically BECAUSE this whole
  // document is a single vertically-flowing column — every page break here is decided purely by vertical
  // extent, so a width-only change can't disturb the already-correct (height-driven) page-break math.
  // Only the grid's per-day cells get wider (more breathing room around each number), not the left label
  // columns or any font-size — reads as "roomier", not stretched/distorted.
  let gridWidthStyle = document.getElementById('schedule-print-gridwidth-style');
  if(gridWidthStyle) gridWidthStyle.textContent = '';
  if(settings.scaleMode==='fit-page'){
    const filled = scheduleMeasurePrintFrame(frame);
    const widthSlack = filled.w>0 ? targetW/filled.w : 1;
    if(widthSlack>1.08){
      const gridTds = frame.querySelectorAll('.sched-grid-td');
      const taskRows = frame.querySelectorAll('.sched-task-row');
      const numGridCols = taskRows.length>0 ? gridTds.length/taskRows.length : 0;
      const currentZoom = parseFloat(frame.style.zoom) || 1;
      if(gridTds.length>0 && numGridCols>0){
        if(!gridWidthStyle){ gridWidthStyle = document.createElement('style'); gridWidthStyle.id = 'schedule-print-gridwidth-style'; document.head.appendChild(gridWidthStyle); }
        // Self-correcting, re-measured FRESH each pass (not compounding a single computed factor) —
        // table-layout:auto's own 100%-stretch may have ALREADY inflated each grid column past its
        // declared px width before this ever runs (confirmed live: a 14-column grid measured ~77px/col
        // real vs. the 28px colWidth constant, this table's own long-documented quirk), so scaling from
        // the STALE declared width undercounts badly — always re-derive "current per-column width" from
        // live geometry instead.
        for(let i=0;i<3;i++){
          const firstGridTd = gridTds[0], lastGridTd = gridTds[gridTds.length-1];
          const gridSpanPx = lastGridTd.getBoundingClientRect().right - firstGridTd.getBoundingClientRect().left;
          const sizedNow = scheduleMeasurePrintFrame(frame);
          const nonGridWidth = sizedNow.w - gridSpanPx; // left label columns + cumulative column — unaffected
          const targetGridSpan = Math.max(gridSpanPx, targetW - nonGridWidth);
          const widenFactor = Math.max(1, Math.min(targetGridSpan/gridSpanPx, 8));
          const currentColWidthUnzoomed = (gridSpanPx/currentZoom)/numGridCols;
          const newColWidth = currentColWidthUnzoomed*widenFactor;
          gridWidthStyle.textContent = `#schedule-print-frame .sched-period-cell, #schedule-print-frame .sched-period-cell-spacer{width:${newColWidth}px !important;} #schedule-print-frame .sched-grid-td{width:${newColWidth}px !important;}`;
          void frame.offsetHeight;
          const resized = scheduleMeasurePrintFrame(frame);
          // Widening cells can occasionally push height over budget too (rare for short numeric content,
          // but checked defensively) — drop the whole attempt rather than risk a spurious extra page.
          if(resized.h > targetH*1.01){ gridWidthStyle.textContent = ''; break; }
          const widthRatio = resized.w/targetW;
          if(widthRatio>=0.95 && widthRatio<=1.02) break;
        }
        // Final safety check: if the loop ended up making things worse (overflowed height), drop it.
        if(scheduleMeasurePrintFrame(frame).h > targetH*1.01) gridWidthStyle.textContent = '';
      }
    }
  }

  // LEGIBILITY COMPENSATION (2026-07-28 follow-up: real print screenshots showed table text/numbers
  // illegibly tiny — apparently overlapped/obscured by cell borders — and the S-curve line rendering
  // visibly thicker than its on-screen counterpart). Root cause for the text: @media print's own GLOBAL
  // `table{font-size:12px !important}` rule (app-wide, not specific to this page) is a FIXED pre-zoom
  // value — once `zoom` shrinks a wide day-grid down far enough to fit the page (confirmed live: even
  // this file's own typical 8-task fixture already lands around zoom 0.18-0.4 at default settings), the
  // FINAL rendered text becomes 12*zoom ≈ 2-4px, well under anything legible, while borders (a hardcoded
  // 1px each) hit their own real anti-aliasing rendering floor and don't shrink nearly as much
  // proportionally — so they end up visually dominating/obscuring the now-tiny text. Fix: compensate the
  // SOURCE font-size (before zoom) so the FINAL rendered size lands at a fixed legible target, regardless
  // of how aggressively zoom needed to shrink.
  //
  // Deliberately a SEPARATE, ADDITIVE step AFTER the zoom-fit loop and width-fill above have BOTH already
  // finished (not folded into either one). An earlier version of this fix folded font compensation INTO
  // the self-correction loop, which created a genuine feedback spiral for wide (many-column) grids:
  // bumping the font up to stay legible also makes each grid cell's own content wider/taller, which the
  // loop reads as "still doesn't fit," so it shrinks zoom further, which the compensation formula
  // (target/zoom) then reads as "needs an even BIGGER source font" — confirmed live: on this file's own
  // test fixture, day/week zoom got pushed all the way down to the hard 0.05 floor and broke the
  // (already-tuned, already-tested) width-fill feature above. This version instead treats "fits the page"
  // (the zoom loop + width-fill, both left COMPLETELY UNTOUCHED by this step) as the already-solved,
  // higher-priority problem, and only opportunistically grows the font AFTERWARD — backing off (all the
  // way down to no compensation at all) rather than ever pushing a project that already fit back into
  // overflowing.
  const SCHEDULE_PRINT_TARGET_FONT_PX = 8;
  let fontStyle = document.getElementById('schedule-print-font-style');
  if(!fontStyle){ fontStyle = document.createElement('style'); fontStyle.id = 'schedule-print-font-style'; document.head.appendChild(fontStyle); }
  fontStyle.textContent = '';
  const finalZoom = parseFloat(frame.style.zoom) || 1;
  const defaultEffectiveFontPx = 12*finalZoom;
  if(defaultEffectiveFontPx < SCHEDULE_PRINT_TARGET_FONT_PX){
    // Bisect the SOURCE (pre-zoom) font-size between the full legible target and the safe, already-fitting
    // 12px default, backing off toward 12px whenever the bigger font would overflow the page this pass
    // already achieved (checked against the SAME tolerances the zoom-fit loop/width-fill above use).
    // MUST end in a VERIFIED-fitting state, never an unverified intermediate one — a plain "try N times,
    // keep whatever the last iteration happened to leave applied" (an earlier version of this loop) can
    // exit after the iteration budget with a candidate that was NEVER actually confirmed to fit, silently
    // reintroducing the exact overflow/overlap this fix exists to prevent. `fits` makes that impossible:
    // the loop only ever stops once `sized` genuinely satisfies the tolerance, or falls through to the
    // explicit clean fallback below.
    let candidatePx = SCHEDULE_PRINT_TARGET_FONT_PX/finalZoom;
    let fits = false;
    for(let i=0;i<8;i++){
      fontStyle.textContent = `#schedule-print-frame table{font-size:${candidatePx}px !important;}`;
      void frame.offsetHeight;
      const sized = scheduleMeasurePrintFrame(frame);
      if(sized.h<=targetH*1.01 && sized.w<=targetW*1.05){ fits = true; break; }
      candidatePx = (candidatePx+12)/2;
    }
    if(!fits){
      // Exhausted the iteration budget without ever proving a fit (only possible for content already at/
      // near the page's own real physical rendering floor — e.g. day/week zoom with hundreds of narrow
      // columns, where NO legible font size can fit every column on one page) — fall back cleanly to the
      // safe, already-verified-fitting 12px default rather than leave any unverified size applied.
      fontStyle.textContent = '';
      void frame.offsetHeight;
    }
  }

  // 2026-07-28 spec rewrite: the S-curve overlay's stroke-width is no longer print-compensated at all —
  // buildScheduleChartOverlaySvgContent() now sets one fixed stroke-width:1.5 shared identically by
  // screen AND print (explicit spec requirement: one plain constant, not a value computed differently per
  // zoom/paper-size). The `schedule-print-stroke-style` override this block used to inject has been
  // removed entirely — if it's still referenced anywhere else, that's stale and should be deleted too.

  // REGRESSION FIX (2026-07-27, reported right after this print feature shipped): the S-curve overlay
  // (#schedule-chart-overlay) is positioned/sized via plain inline px style + an SVG viewBox, computed
  // ONCE by updateScheduleChartOverlay() every normal on-screen render() (see attachHandlers()) — but
  // print never re-ran it. @media print's own `table{font-size:12px !important}` rule PLUS this
  // function's own `zoom` both reflow the table to a genuinely different real geometry than whatever was
  // on screen when the overlay was last computed, so the overlay kept showing STALE screen-time
  // left/top/width/height: the line visually "stopped mid-grid" (misaligned against the real, now-
  // reflowed grid) and the stale, absolutely-positioned SVG box could paint well past the table's real
  // print-time extent, forcing a spurious near-blank extra page. Fix: reuse the EXACT SAME function the
  // screen already uses to recompute the overlay, called AFTER zoom is finalized so it measures the real
  // final print-time layout — deliberately not a separate/duplicated print-only measurement path, so this
  // can't drift out of sync with the screen version again.
  updateScheduleChartOverlay();
}
function scheduleResetPrintLayout(){
  const frame = document.getElementById('schedule-print-frame');
  if(frame){ frame.style.zoom = ''; frame.style.width = ''; frame.style.padding = ''; frame.style.boxSizing = ''; }
  const pageStyle = document.getElementById('schedule-print-page-style');
  if(pageStyle) pageStyle.textContent = '';
  const gridWidthStyle = document.getElementById('schedule-print-gridwidth-style');
  if(gridWidthStyle) gridWidthStyle.textContent = '';
  const fontStyle = document.getElementById('schedule-print-font-style');
  if(fontStyle) fontStyle.textContent = '';
  // Restore the ON-SCREEN overlay back to the normal (unzoomed, screen-font) geometry immediately —
  // otherwise it would keep showing the print-time geometry until the next unrelated render() happened to
  // run (e.g. the 45s poll), same reasoning as the fix above.
  updateScheduleChartOverlay();
  if(S.schedulePrintLastOvershoot){
    S.schedulePrintLastOvershoot = null;
    toast(tr('fin_project_schedule.print_overshoot_warning'), 'warn');
  }
}
window.addEventListener('beforeprint', scheduleApplyPrintLayout);
window.addEventListener('afterprint', scheduleResetPrintLayout);

// Entry point for the modal's own "พิมพ์เอกสาร" button (handleAction()'s 'execute-schedule-print').
// Closes the modal FIRST (so it's never part of the printed output, and so #schedule-print-frame reflects
// the normal page again before we measure anything) and waits for both a real render pass and webfonts —
// this page's fonts load via an external Google Fonts @import, and measuring print geometry against
// still-loading fallback-font metrics was a real, independently-confirmed bug the last time this print
// feature existed (see the memory file's font-race writeup) — before calling window.print(), which is
// what actually fires 'beforeprint' → scheduleApplyPrintLayout() above.
async function scheduleExecutePrint(paperSize, scaleMode, margin){
  S.schedulePrintSettings = {paperSize, scaleMode, margin};
  S.modal = null;
  render();
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  if(document.fonts && document.fonts.status!=='loaded'){
    try{ await document.fonts.ready; } catch(e){}
  }
  window.print();
}

function pageFinProjectSchedule(){
  const p = DB.projects.find(x=>x.id===S.selectedProjectId);
  if(!p){
    return `<div class="page-head"><div><h2>${tr('fin_project_schedule.title')}</h2></div></div>
    <div class="card" style="padding:20px 22px;"><div class="empty">${tr('fin_project_detail.not_found')}</div></div>`;
  }
  const pageHead = `
  <div class="page-head">
    <div>
      <button class="btn btn-ghost btn-sm no-print" data-act="nav" data-page="fin_project_detail" data-module="bidding" data-id="${p.id}" data-id-field="selectedProjectId" style="margin-bottom:8px;">${ICN.chevronLeft} ${tr('common.back')}</button>
      <h2>${tr('fin_project_schedule.title')}</h2><div class="sub">${esc(p.name)}${p.code?' · '+esc(p.code):''}</div>
    </div>
    <div class="no-print">
      <button class="btn btn-ghost btn-sm" data-act="open-schedule-print-modal">${ICN.printer} ${tr('fin_project_schedule.print_button')}</button>
    </div>
  </div>`;

  if(!S.projectTasksLoaded){
    return pageHead + `<div class="card" style="padding:20px 22px;"><div class="table-wrap"><table><thead><tr>
      <th class="num-cell">${tr('fin_project_schedule.col_no')}</th><th>${tr('fin_project_schedule.col_task_name')}</th><th class="num-cell">${tr('fin_project_schedule.col_duration')}</th>
      <th>${tr('fin_project_schedule.col_start')}</th><th>${tr('fin_project_schedule.col_end')}</th><th class="num-cell">${tr('fin_project_schedule.col_budget_baht')}</th>
      <th class="num-cell">${tr('fin_project_schedule.col_budget_percent')}</th><th></th>
    </tr></thead><tbody>${skeletonTableRows(4,8)}</tbody></table></div></div>`;
  }

  // Defensive: this page's grid/chart math is the most complex render path in the app (date-range
  // arithmetic driven directly by free-form user input in the วันเริ่ม field). scheduleBuildColumns()
  // already caps the range so a bad date can't blow up the column count (see
  // MAX_SCHEDULE_GRID_DAYS/scheduleRangeTooWide()) — this try/catch is the last-resort backstop for
  // anything else unexpected in this path, so a genuine bug here degrades to a visible, recoverable
  // error card instead of an uncaught exception aborting render() (which — confirmed via an actual
  // repro — otherwise leaves the WHOLE APP, not just this page, stuck blank until a hard refresh, since
  // render() throwing here means app.innerHTML never gets reassigned and every subsequent render()
  // attempt, e.g. the 45s notification poll, just fails the exact same way again).
  try{
    const ctx = computeScheduleRenderContext();
    // #schedule-print-frame: plain, unstyled on screen — scheduleApplyPrintLayout()/scheduleResetPrintLayout()
    // (see the print-fit engine below) only ever touch its inline style between the native 'beforeprint'
    // and 'afterprint' events, so this wrapper is invisible to normal on-screen rendering.
    return `<div id="schedule-print-frame">${pageHead}${renderProjectScheduleTable(ctx)}</div>`;
  } catch(err){
    console.error('pageFinProjectSchedule render error:', err);
    return pageHead + `<div class="card" style="padding:20px 22px;">
      <div class="empty" style="color:var(--red);">${tr('fin_project_schedule.render_error')}</div>
    </div>`;
  }
}

function pageFinRetention(){
  const items = DB.revenue.filter(r=>r.retentionAmount>0);
  const byProject = {};
  items.forEach(r=>{
    const pid = r.projectId || 0;
    if(!byProject[pid]) byProject[pid] = [];
    byProject[pid].push(r);
  });
  const groups = Object.entries(byProject).map(([pid, list])=>{
    const sorted = list.slice().sort((a,b)=>(a.retentionReleaseDate||'9999-99-99').localeCompare(b.retentionReleaseDate||'9999-99-99'));
    const heldSorted = sorted.filter(r=>r.retentionStatus==='held');
    const earliestDue = heldSorted[0] ? heldSorted[0].retentionReleaseDate : (sorted[0] ? sorted[0].retentionReleaseDate : null);
    return { pid:Number(pid), list:sorted, earliestDue };
  }).sort((a,b)=>(a.earliestDue||'9999-99-99').localeCompare(b.earliestDue||'9999-99-99'));

  const totalHeld = sumBy(items.filter(r=>r.retentionStatus==='held'), r=>r.retentionAmount);
  const totalReleased = sumBy(items.filter(r=>r.retentionStatus==='released'), r=>r.retentionAmount);
  const dueSoonCount = items.filter(r=>{
    if(r.retentionStatus!=='held') return false;
    const d = daysUntil(r.retentionReleaseDate);
    return d!==null && d<=RETENTION_DUE_SOON_DAYS;
  }).length;

  return `
  <div class="page-head"><div><h2>${tr('nav.fin_retention')}</h2><div class="sub">${tr('fin_retention.subtitle')}</div></div></div>

const FOREIGN_WORKER_DOC_TYPES = ['passport','work_permit','visa','border_pass','health_insurance','health_checkup'];
// "ปกติ/ใกล้หมดอายุ" are computed from expiry_date at render time (never stored) — only
// "หมดอายุแล้ว" is backed by the server's status column (set once the expiry date has actually
// passed — see computeForeignWorkerDocStatus in server.js). Both sides need to agree, so this
// checks expiryDate directly rather than trusting doc.status alone, in case today has already
// passed expiryDate client-side but the daily cron hasn't run yet to flip status server-side.
function foreignWorkerDocStatusInfo(doc){
  // Local calendar date, not toISOString()'s UTC date — using UTC here would misjudge "today"
  // for part of the day in any timezone ahead of UTC (this app's users are in Thailand, UTC+7).
  const now = new Date();
  const todayIso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const daysUntil = Math.round((new Date(doc.expiryDate+'T00:00:00Z') - new Date(todayIso+'T00:00:00Z')) / 86400000);
  if(doc.status==='expired' || doc.expiryDate < todayIso){
    return {key:'expired', label:tr('foreign_worker.status_expired'), badgeClass:'badge-rejected', daysUntil};
  }
  if(daysUntil<=30){
    return {key:'soon', label:tr('foreign_worker.status_near_expiry'), badgeClass:'badge-pending', daysUntil};
  }
  return {key:'normal', label:tr('foreign_worker.status_normal'), badgeClass:'badge-approved', daysUntil};
}

const TH_MONTH_NAMES = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const EN_MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function pageLeaveCalendar(){
  const year = S.leaveCalendarYear, month = S.leaveCalendarMonth; // month is 1-12
  const empFilter = S.leaveCalendarEmployeeFilter || '';
  let approved = DB.leaveRequests.filter(r=>r.status==='approved');
  if(empFilter) approved = approved.filter(r=>String(r.employeeId)===empFilter);
  const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
  const firstDow = new Date(Date.UTC(year, month-1, 1)).getUTCDay(); // 0=Sun
  const isoFor = (d)=> `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const leavesOnDay = (d)=>{ const iso = isoFor(d); return approved.filter(r=> r.startDate<=iso && r.endDate>=iso); };
  // "Today" is always derived from the real current date (never hardcoded), so past/upcoming/
  // far-future coloring below stays correct no matter when this renders. Comparisons are done as
  // padded YYYY-MM-DD strings (like isoFor/leavesOnDay already do) so lexicographic <= works.
  const now = new Date();
  const todayIso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const soon = new Date(now.getFullYear(), now.getMonth(), now.getDate()+7);
  const soonIso = `${soon.getFullYear()}-${String(soon.getMonth()+1).padStart(2,'0')}-${String(soon.getDate()).padStart(2,'0')}`;
  const dayCategory = (iso)=> iso<todayIso ? 'past' : iso<=soonIso ? 'soon' : 'future';
  const CATEGORY_BG = {past:'var(--amber-bg)', soon:'var(--sky-bg)', future:'var(--green-bg)'};
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const isEn = I18N.getLocale()==='en';
  const monthNames = isEn ? EN_MONTH_NAMES : TH_MONTH_NAMES;
  const weekdayLabels = isEn ? ['Su','Mo','Tu','We','Th','Fr','Sa'] : ['อา','จ','อ','พ','พฤ','ศ','ส'];
  const employees = DB.employees.slice().sort((a,b)=>a.fullName.localeCompare(b.fullName,'th'));
  return `
  <div class="page-head">
    <div><h2>${tr('nav.emp_leave_calendar')}</h2><div class="sub">${tr('leave_calendar.subtitle')}</div></div>
  </div>
  <div class="card" style="padding:16px 20px; margin-bottom:16px;">
    <div class="small-btn-row" style="align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <div class="small-btn-row" style="align-items:center;">
        <button class="btn btn-ghost btn-sm" data-act="leave-cal-prev">← ${tr('leave_calendar.prev_month')}</button>
        <div style="font-weight:700; min-width:170px; text-align:center;">${monthNames[month-1]} ${isEn?year:year+543}</div>
        <button class="btn btn-ghost btn-sm" data-act="leave-cal-next">${tr('leave_calendar.next_month')} →</button>
      </div>
      <div class="field" style="margin-bottom:0; min-width:220px;">
        <select data-act="filter-leave-cal-employee">
          <option value="">${tr('leave_calendar.all_employees')}</option>
          ${employees.map(e=>`<option value="${e.id}" ${empFilter===String(e.id)?'selected':''}>${esc(e.fullName)}</option>`).join('')}
        </select>
      </div>
    </div>
  </div>
  <div class="card" style="padding:16px 20px;">
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:6px; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:6px; text-align:center;">
      ${weekdayLabels.map(d=>`<div>${d}</div>`).join('')}
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:6px;">
      ${cells.map(d=>{
        if(d===null) return `<div style="min-height:92px;"></div>`;
        const iso = isoFor(d);
        const isToday = iso===todayIso;
        const leaves = leavesOnDay(d);
        const bg = leaves.length ? CATEGORY_BG[dayCategory(iso)] : 'var(--surface)';
        const border = isToday ? '2px solid var(--navy)' : '1px solid var(--border)';
        const tooltip = leaves.map(l=>`${l.employeeName} — ${l.leaveTypeName}`).join('\n');
        return `<div style="min-height:92px; border:${border}; border-radius:6px; padding:6px; background:${bg}; ${leaves.length?'cursor:help;':''}" ${tooltip?`title="${esc(tooltip)}"`:''}>
          <div style="display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; font-size:12px; font-weight:700; margin-bottom:4px; ${isToday?'background:var(--navy); color:#fff;':'color:var(--text-muted);'}">${d}</div>
          ${leaves.map(l=>`<div class="badge badge-draft" style="display:block; margin-bottom:3px; font-size:10.5px; white-space:normal; text-align:left; line-height:1.4;" title="${esc(l.leaveTypeName)}">${esc(l.employeeName)}</div>`).join('')}
        </div>`;
      }).join('')}
    </div>
    <div class="small-btn-row" style="margin-top:16px; flex-wrap:wrap; gap:16px; font-size:12px; color:var(--text-muted);">

function esc(v){ return (v==null?'':String(v)).replace(/"/g,'&quot;'); }
function radioGroup(name, options, current){

// Renders a position <select> grouped by category (<optgroup>) plus a hidden "อื่นๆ (ระบุเอง)"
// text fallback for positions not in DB.jobPositions. job_positions has no relationship to
// employment_type — that's chosen independently by HR in "การพิจารณาว่าจ้าง" or on the จัดการพนักงาน
// form, never auto-suggested from the position/category.
// statePath (optional): a JS lvalue expression string (e.g. 'S.modal.position') to keep live-synced
// as the user picks/types a position — used by modals that need to survive a background render()
// mid-fill (see feedback_full_page_form_state memory); omitted by callers (like the appForm wizard)
// that instead rely on a step-level sync function, so it must stay optional/backward compatible.
function positionSelectHtml(id, currentValue, statePath){
  const isKnown = DB.jobPositions.some(p=>p.isActive && p.name===currentValue);
  const isOther = !!currentValue && !isKnown;
  const selectWrite = statePath ? ` ${statePath}=this.value==='__other__'?(document.getElementById('${id}-other')||{}).value||'':this.value;` : '';
  const otherWrite = statePath ? ` ${statePath}=this.value;` : '';
  return `
    <select id="${id}" onchange="onPositionSelectChange(this);${selectWrite}">
      <option value="">— เลือกตำแหน่ง —</option>
      ${[...JOB_POSITION_CATEGORIES, ...new Set(DB.jobPositions.map(p=>p.category).filter(c=>!JOB_POSITION_CATEGORIES.includes(c)))].map(cat=>{
        const list = DB.jobPositions.filter(p=>p.isActive && p.category===cat);
        if(list.length===0) return '';
        return `<optgroup label="${cat}">${list.map(p=>`<option value="${esc(p.name)}" ${!isOther && currentValue===p.name?'selected':''}>${p.name}</option>`).join('')}</optgroup>`;
      }).join('')}
      <option value="__other__" ${isOther?'selected':''}>อื่นๆ (ระบุเอง)</option>
    </select>
    <input id="${id}-other" value="${isOther?esc(currentValue):''}" placeholder="ระบุตำแหน่งงาน" style="margin-top:8px; display:${isOther?'block':'none'};" oninput="${otherWrite}">`;
}
function onPositionSelectChange(selectEl){
  const otherInput = document.getElementById(selectEl.id + '-other');
  if(otherInput) otherInput.style.display = selectEl.value === '__other__' ? 'block' : 'none';
}
function readPositionValue(id){
  const sel = document.getElementById(id);
  if(!sel) return '';
  if(sel.value === '__other__'){
    const other = document.getElementById(id+'-other');
    return other ? other.value.trim() : '';
  }
  return sel.value;
}
function fv(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function fchecked(id){ const el = document.getElementById(id); return el ? el.checked : false; }
function fradio(name){ const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ''; }

// Applicant photos come straight from a phone camera in practice — often several MB, easily
// enough to blow past the server's JSON body-size limit (the whole application, including this
// photo, is submitted as one JSON payload). Downscaling + re-encoding here keeps the submitted
// size small and predictable regardless of the source file, instead of failing silently/late.
function handleAppPhotoChange(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 20*1024*1024){
    toast(tr('job_app.photo_too_large_err'),'err');
    input.value=''; return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 800;
      let w = img.width, h = img.height;
      if(w>maxDim || h>maxDim){ const scale = maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      // Decoding+resizing is async and can take a moment — if the applicant kept typing into
      // other step-0 fields (name, position, salary) while it ran, render() below would blow
      // those away (it rebuilds the DOM from S.appForm.draft, which never saw those keystrokes).
      // Sync the current DOM into the draft first so nothing typed in the meantime is lost.
      readAppFormStep(S.appForm.step, S.appForm.draft);
      S.appForm.draft.photoDataUrl = canvas.toDataURL('image/jpeg', 0.82);
      render();
    };
    img.onerror = ()=>{ toast(tr('job_app.photo_read_err'),'err'); };
    img.src = reader.result;
  };
  reader.onerror = ()=>{ toast(tr('job_app.file_read_err'),'err'); };
  reader.readAsDataURL(file);
}

// Reads the fields belonging to one wizard step out of the DOM into the draft — called on every
// step change / save so typed data survives navigating between steps (this app re-renders the
// whole #app on every action, so nothing persists unless it's read back into state first).
function readAppFormStep(step, d){
  if(step===0){
    // employeeCode is auto-assigned at draft creation (disabled input) — not read here.
    d.titlePrefix = fv('af-title'); d.fullName = fv('af-fullname');
    d.positionWanted1 = readPositionValue('af-pos1'); d.positionWanted2 = readPositionValue('af-pos2'); d.expectedSalary = fv('af-salary');
    // Same field as af-email in step 1 (Personal Information) — both read back into d.email, so
    // whichever one the applicant filled last is what the other shows next time either step
    // renders. No separate sync plumbing needed since the two inputs are never on screen together.
    d.email = fv('af-email-top');
  } else if(step===1){
    d.addrNo=fv('af-addr-no'); d.addrMoo=fv('af-addr-moo'); d.addrRoad=fv('af-addr-road'); d.addrTambon=fv('af-addr-tambon'); d.addrAmphoe=fv('af-addr-amphoe'); d.addrProvince=fv('af-addr-province'); d.addrZipcode=fv('af-addr-zipcode');
    d.phone=fv('af-phone'); d.mobile=fv('af-mobile'); d.email=fv('af-email');
    d.livingType=fradio('af-living');
    d.birthDate=fv('af-birthdate'); d.age=fv('af-age'); d.ethnicity=fv('af-ethnicity'); d.nationality=fv('af-nationality'); d.religion=fv('af-religion');
    d.idCardNumber=fv('af-idcard'); d.idCardExpiry=fv('af-idcard-expiry');
    d.heightCm=fv('af-height'); d.weightKg=fv('af-weight');
    d.militaryStatus=fradio('af-military'); d.maritalStatus=fradio('af-marital'); d.gender=fradio('af-gender');
  } else if(step===2){
    d.fatherName=fv('af-father-name'); d.fatherAge=fv('af-father-age'); d.fatherOccupation=fv('af-father-occ');
    d.motherName=fv('af-mother-name'); d.motherAge=fv('af-mother-age'); d.motherOccupation=fv('af-mother-occ');
    d.spouseName=fv('af-spouse-name'); d.spouseWorkplace=fv('af-spouse-workplace'); d.spousePosition=fv('af-spouse-position');
    d.childrenCount=fv('af-children-count');
    d.siblingsTotal=fv('af-siblings-total'); d.siblingsMale=fv('af-siblings-male'); d.siblingsFemale=fv('af-siblings-female'); d.birthOrder=fv('af-birth-order');
  } else if(step===3){
    EDUCATION_LEVELS.forEach(lvl=>{
      d.education[lvl.key] = {
        institution: fv(`af-edu-${lvl.key}-institution`), major: fv(`af-edu-${lvl.key}-major`),
        fromYear: fv(`af-edu-${lvl.key}-from`), toYear: fv(`af-edu-${lvl.key}-to`),
      };
    });
  } else if(step===5){
    LANGUAGES.forEach(l=>{
      d.languages[l.key] = {
        speak: (document.getElementById(`af-lang-${l.key}-speak`)||{}).value || '',
        write: (document.getElementById(`af-lang-${l.key}-write`)||{}).value || '',
        read: (document.getElementById(`af-lang-${l.key}-read`)||{}).value || '',
      };
    });
    d.otherLanguageName = fv('af-lang-other-name');
  } else if(step===6){
    d.typingAble=fradio('af-typing-able'); d.typingSpeedThai=fv('af-typing-speed-th'); d.typingSpeedEnglish=fv('af-typing-speed-en');
    d.computerAble=fradio('af-computer-able'); d.computerPrograms=fv('af-computer-programs');
    d.drivingAble=fradio('af-driving-able'); d.drivingLicenseNumber=fv('af-driving-license');
    d.officeEquipmentAbility=fv('af-office-equipment');
    d.hobby=fv('af-hobby'); d.sports=fv('af-sports'); d.specialKnowledge=fv('af-special-knowledge'); d.otherAbility=fv('af-other-ability');
  } else if(step===7){
    d.upcountryAble=fradio('af-upcountry-able'); d.upcountryNote=fv('af-upcountry-note');
    d.emergencyName=fv('af-emergency-name'); d.emergencyRelation=fv('af-emergency-relation'); d.emergencyAddress=fv('af-emergency-address'); d.emergencyPhone=fv('af-emergency-phone');
    d.referralSource=fv('af-referral-source');
    d.hadIllness=fradio('af-had-illness'); d.illnessDetail=fv('af-illness-detail');
    d.appliedBefore=fradio('af-applied-before'); d.appliedBeforeWhen=fv('af-applied-before-when');
    d.relativesInCompany=fv('af-relatives-in-company');
    d.ref1Name=fv('af-ref1-name'); d.ref1Address=fv('af-ref1-address'); d.ref1Phone=fv('af-ref1-phone'); d.ref1Occupation=fv('af-ref1-occupation');
    d.ref2Name=fv('af-ref2-name'); d.ref2Address=fv('af-ref2-address'); d.ref2Phone=fv('af-ref2-phone'); d.ref2Occupation=fv('af-ref2-occupation');
    d.selfIntroduction=fv('af-self-intro');
  } else if(step===8){
    d.certifyChecked=fchecked('af-certify'); d.signatureName=fv('af-signature-name'); d.signatureDate=fv('af-signature-date');
  } else if(step===9){
    // Section is gated to can_approve_applications — for anyone without that permission,
    // renderAppFormStep() below renders a read-only summary with none of these input ids, so
    // there's nothing to read back (and nothing must be, or an unauthorized viewer just passing
    // through this step would silently blank out the HR fields on their next save).
    const canApprove = S.dataMode==='demo' || !!(S.currentUser && S.currentUser.canApproveApplications);
    if(canApprove){
      // allowances/deductions aren't read back here — their inputs write straight into
      // S.appForm.draft.allowances/deductions on every keystroke (see renderAppFormPayItemRows),
      // same live-binding trick as the experience[] rows in step 4.
      d.hrPosition=readPositionValue('af-hr-position'); d.hrDepartment=fv('af-hr-department'); d.employmentType=fv('af-hr-employment-type'); d.hrSalary=fv('af-hr-salary'); d.hrStartDate=fv('af-hr-startdate');
      d.hrSignedBy=fv('af-hr-signedby'); d.hrSignedDate=fv('af-hr-signeddate');
      d.approverSignedBy=fv('af-approver-signedby'); d.approverSignedDate=fv('af-approver-signeddate');
      // status itself only ever changes through the decision endpoint/buttons once hired/rejected
      // — the select here (see render) never even offers those two options as a choice.
      if(d.status!=='hired' && d.status!=='rejected'){
        const statusEl = document.getElementById('af-status');
        if(statusEl) d.status = statusEl.value;
      }
    }
  }
  // step 4 (experience) and the siblings sub-table in step 2 are bound directly to draft via
  // inline oninput handlers (see renderAppFormStep) since they're dynamic-row tables — nothing to read here.
}

function pageEmpAppForm(){
  const af = S.appForm;
  const d = af.draft;
  const step = af.step;
  // A brand-new application only ever collects steps 1-9 (the applicant-facing sections) — step 10
  // "การพิจารณาว่าจ้าง (HR)" is deliberately not offered at creation time; it's filled in later by
  // HR when they open an already-submitted application via "ดูรายละเอียด"/"พิจารณาใบสมัคร" (editId set).
  const steps = appFormSteps();
  const visibleSteps = af.editId ? steps : steps.slice(0,9);
  // Once an application has been submitted, its applicant-facing steps (1-9) are view-only from
  // this list-driven flow — protects data the applicant themselves entered from accidental HR
  // edits. Only step 10 "การพิจารณาว่าจ้าง (HR)" stays editable (already separately gated by
  // can_approve_applications inside renderAppFormStep). A brand-new application (editId null,
  // still being filled in) is unaffected — that flow needs steps 1-9 fully editable to exist at all.
  const readOnlyStep = !!af.editId && step < 9;
  return `
  <div class="page-head">
    <div><h2>${!af.editId ? tr('emp_applicants.add_application') : step===9 ? tr('job_app.review_title') : tr('job_app.view_detail_title')}</h2><div class="sub">${tr('job_app.form_title')} — ${(steps[step]||{}).label} (${tr('job_app.step_of', {current: step+1, total: visibleSteps.length})})</div></div>
    <button class="btn btn-ghost" data-act="appform-cancel">${tr('common.cancel')}</button>
  </div>
  ${!af.editId ? permNote(tr('job_app.hr_step_later_note')) : ''}
  ${readOnlyStep ? permNote(tr('job_app.readonly_step_note')) : ''}
  <div class="tabs" style="flex-wrap:wrap; row-gap:6px;">
    ${visibleSteps.map((s,i)=>`<button class="tab ${step===i?'active':''}" data-act="appform-goto-step" data-step="${i}">${i+1}. ${s.label}</button>`).join('')}
  </div>
  <div class="card" style="padding:24px 26px;">
    ${readOnlyStep ? `<fieldset disabled style="border:none; padding:0; margin:0;">${renderAppFormStep(step, d)}</fieldset>` : renderAppFormStep(step, d)}
  </div>
  <div class="small-btn-row" style="margin-top:16px; justify-content:space-between;">
    <div>${step>0 ? `<button class="btn btn-ghost" data-act="appform-goto-step" data-step="${step-1}">← ${tr('job_app.back')}</button>` : ''}</div>
    <div class="small-btn-row">
      ${step<visibleSteps.length-1 ? `<button class="btn btn-navy" data-act="appform-goto-step" data-step="${step+1}">${tr('job_app.next')} →</button>` : ''}
      ${readOnlyStep ? '' : `<button class="btn btn-primary" data-act="appform-save">${tr('job_app.save_application')}</button>`}
    </div>
  </div>`;
}

function numFrom(v){ return Number(String(v||'0').replace(/,/g,'')) || 0; }
function payItemsTotal(items){ return (items||[]).reduce((s,r)=>s+numFrom(r.amount),0); }
// Recomputes the three derived totals directly in the DOM (no render()) so the running totals
// stay live while typing without losing input focus — same trick as onPositionSelectChange, just
// for numbers instead of a toggle.
function updateAppFormPayTotals(){
  // d.hrSalary is kept live-bound by af-hr-salary's oninput (same as allowance/deduction rows),
  // so it's always current here even though this only runs on oninput, not through render().
  const d = S.appForm.draft;
  const allowTotal = payItemsTotal(d.allowances);
  const dedTotal = payItemsTotal(d.deductions);
  const salary = numFrom(d.hrSalary);
  const at = document.getElementById('af-allowances-total'); if(at) at.textContent = fmtMoney(allowTotal);
  const dt = document.getElementById('af-deductions-total'); if(dt) dt.textContent = fmtMoney(dedTotal);
  const nt = document.getElementById('af-net-salary'); if(nt) nt.textContent = fmtMoney(salary + allowTotal - dedTotal);
}
function renderAppFormPayItemRows(items, kind){
  return (items||[]).map((r,i)=>`
    <div style="display:flex; align-items:flex-end; gap:8px; margin-bottom:8px;">
      <div class="field" style="margin-bottom:0; flex:1; min-width:0;"><label>${tr('job_app.item_name')}</label><input value="${esc(r.name)}" placeholder="${kind==='allowances'?tr('job_app.allowance_ph'):tr('job_app.deduction_ph')}" oninput="S.appForm.draft.${kind}[${i}].name=this.value;"></div>
      <div class="field" style="margin-bottom:0; width:120px; flex:none;"><label>${tr('job_app.amount')}</label><input type="number" step="0.01" value="${esc(r.amount)}" oninput="S.appForm.draft.${kind}[${i}].amount=this.value; updateAppFormPayTotals();"></div>
      <button class="btn btn-ghost btn-sm" data-act="appform-remove-payitem" data-kind="${kind}" data-idx="${i}" style="flex:none; white-space:nowrap;">${tr('common.action_delete')}</button>
    </div>`).join('');
}

// Surfaces approved leave overlapping a labor-cost row's work date, at the point of entry —
// this labor batch is a flexible scratchpad of manually-entered rows with no formalized "pay
// period" concept to hook an automatic recalculation into, so integration here means informing
// the person entering data rather than silently rewriting their amount. Paid leave: normal wage
// still applies, no action needed. Unpaid leave: flagged so they know to zero out that row.
function leaveNoteForRow(employeeId, workDate){
  if(!employeeId || !workDate) return null;
  const match = (DB.leaveRequests||[]).find(r=> r.status==='approved' && String(r.employeeId)===String(employeeId) && r.startDate<=workDate && r.endDate>=workDate);
  if(!match) return null;
  return match.isPaid
    ? {paid:true, text:tr('fin_labor.leave_note_paid', {type: match.leaveTypeName})}
    : {paid:false, text:tr('fin_labor.leave_note_unpaid', {type: match.leaveTypeName})};
}
function pageFinLabor(){
  if(!S.laborBatch){
    S.laborBatch = { rows: [ { id:uid(), employeeId:'', workDate:new Date().toISOString().slice(0,10), days:1, amount:0, amountEdited:false, workCode:'' } ] };
  }
  const activeEmployees = DB.employees.filter(e=>e.status==='active');
  const recent = DB.laborCosts.slice().sort((a,b)=> b.id-a.id).slice(0,15);

  const rowHtml = (r,i)=>{
    const emp = DB.employees.find(x=>x.id===Number(r.employeeId));
    const unitLabel = emp && emp.employmentType==='daily' ? tr('fin_labor.unit_day') : emp && emp.employmentType==='monthly' ? tr('fin_labor.unit_monthly') : tr('fin_labor.unit_lump');
    return `
    <tr>
      <td>
        <select style="min-width:180px;" onchange="laborRowSetEmployee(${i}, this.value)">
          <option value="">${tr('leave_request.select_employee')}</option>
          ${activeEmployees.map(e=>`<option value="${e.id}" ${Number(r.employeeId)===e.id?'selected':''}>${e.employeeCode} · ${e.fullName}</option>`).join('')}
        </select>
      </td>
      <td><select style="min-width:150px;" onchange="S.laborBatch.rows[${i}].projectId=this.value;">
        <option value="">${tr('fin_labor.select_project')}</option>
        ${DB.projects.map(p=>`<option value="${p.id}" ${Number(r.projectId)===p.id?'selected':''}>${p.name}</option>`).join('')}
      </select></td>
      <td><input type="date" value="${r.workDate||''}" style="min-width:140px;" onchange="S.laborBatch.rows[${i}].workDate=this.value; render();"></td>
      <td><input type="number" min="0" step="0.5" value="${r.days}" style="width:80px;" ${emp&&emp.employmentType==='lump'?'disabled':''} oninput="laborRowSetDays(${i}, this.value)"> <span class="hint" style="display:inline;">${unitLabel}</span></td>
      <td><input type="number" min="0" step="0.01" value="${r.amount}" id="lb-amount-${i}" style="width:110px;" oninput="S.laborBatch.rows[${i}].amount=this.value; S.laborBatch.rows[${i}].amountEdited=true;"></td>
      <td><input placeholder="${tr('fin_budget.col_work_code')}" value="${esc(r.workCode||'')}" style="width:110px;" oninput="S.laborBatch.rows[${i}].workCode=this.value;"></td>
      <td><button class="btn btn-ghost btn-sm" data-act="remove-labor-row" data-idx="${i}" ${S.laborBatch.rows.length<=1?'disabled':''}>${tr('common.action_delete')}</button></td>
    </tr>
    ${(()=>{ const note = leaveNoteForRow(r.employeeId, r.workDate); if(!note) return ''; return `
    <tr><td colspan="7" style="padding:2px 8px 10px;">
      <div class="perm-note" style="margin:0; border-color:${note.paid?'var(--navy)':'var(--red)'}; background:${note.paid?'var(--surface-alt)':'var(--red-bg)'};">${ICN.info}<div style="font-size:12px;">${note.text}</div></div>

      <div class="perm-note" style="margin:0; border-color:var(--red); background:var(--red-bg);">${ICN.info}<div style="font-size:12px; color:var(--red);">${esc(r.error)}</div></div>
    </td></tr>` : ''}`;
  };

  return `
  <div class="page-head"><div><h2>${tr('nav.fin_labor')}</h2><div class="sub">${tr('fin_labor.subtitle')}</div></div></div>
  ${budgetWarningBannerHtml()}
  ${activeEmployees.length===0 ? `<div class="perm-note">${tr('fin_labor.no_active_employees')}</div>` : ''}
  <div class="card" style="padding:20px 22px; margin-bottom:20px;">
    <div class="section-title" style="margin-top:0;">${tr('fin_labor.section_to_save')}</div>
    <div class="table-wrap"><table>
      <thead><tr><th>${tr('leave_request.col_employee')}</th><th>${tr('ledger.col_project')}</th><th>${tr('fin_labor.col_work_date')}</th><th>${tr('fin_labor.col_days_units')}</th><th>${tr('fin_labor.col_amount')}</th><th>${tr('fin_budget.col_work_code')}</th><th></th></tr></thead>
      <tbody id="labor-batch-body">${S.laborBatch.rows.map(rowHtml).join('')}</tbody>

    <div class="small-btn-row" style="margin-top:14px;">
      <button class="btn btn-ghost btn-sm" data-act="add-labor-row">+ ${tr('fin_labor.add_row')}</button>

  </div>
  <div class="card" style="padding:20px 22px;">

    <div class="table-wrap"><table>
      <thead><tr><th>${tr('leave_request.col_employee')}</th><th>${tr('ledger.col_project')}</th><th>${tr('fin_labor.col_work_date')}</th><th>${tr('leave_request.col_days')}</th><th>${tr('ledger.amount_label')}</th><th>${tr('fin_labor.col_recorded_at')}</th><th></th></tr></thead>
      <tbody>
        ${recent.length===0 ? `<tr><td colspan="7"><div class="empty" style="padding:20px 0;">${tr('fin_labor.no_records_yet')}</div></td></tr>` : recent.map(l=>`
          <tr>
            <td>${employeeName(l.employeeId)}</td>
            <td>${projectName(l.projectId)}</td>
            <td>${l.workDate}</td>
            <td class="mono">${l.daysWorked}</td>
            <td class="mono" style="font-weight:700;">${fmtMoney(l.amount)}</td>
            <td class="hint">${l.createdAt}</td>
            <td><button class="btn btn-ghost btn-sm" data-act="delete-labor-cost" data-id="${l.id}">${tr('common.action_delete')}</button></td>
          </tr>`).join('')}
      </tbody>
    </table></div>
  </div>`;

// Reused on the "ต้นทุนโครงการ" ledger page (below) so budget-vs-actual is visible right next
// to where costs actually get entered, not just buried in the โครงการ page / รายงาน tab.
function renderBudgetVsActualSection(){
  if(DB.projects.length===0) return '';
  return `
  <div class="card" style="padding:20px 22px; margin-bottom:20px;">
    <div class="section-title" style="margin-top:0;">${tr('fin_labor.budget_vs_actual')}</div>
    <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(230px,270px));">
      ${DB.projects.map(p=>{
        const breakdown = projectCostBreakdown(p.id);
        const cost = breakdown.total;
        const diff = (p.budget||0) - cost;
        const pct = p.budget ? Math.round(cost/p.budget*1000)/10 : 0;
        const used = p.budget ? Math.min(100, Math.round(cost/p.budget*100)) : 0;
        const barColor = used>90?'var(--red)':used>70?'var(--amber)':'var(--green)';
        const warnBadge = used>90 ? `<span class="badge badge-suspended" style="margin-left:6px;">${tr('fin_projects.over_budget')}</span>`
          : used>70 ? `<span class="badge badge-pending" style="margin-left:6px;">${tr('fin_projects.near_over_budget')}</span>` : '';
        const materialPct = cost ? Math.round(breakdown.materialAndOther/cost*100) : 0;
        return `<div class="card" style="padding:16px 18px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
            <b style="font-size:13px;">${p.name}</b>${warnBadge}
          </div>
          <div style="margin-top:10px; font-size:12px; display:flex; justify-content:space-between;">
            <span style="color:var(--text-muted);">${tr('fin_labor.budget_set')}</span><span class="mono">${fmtMoney(p.budget)}</span>
          </div>
          <div style="margin-top:4px; font-size:12px; display:flex; justify-content:space-between;">
            <span style="color:var(--text-muted);">${tr('fin_labor.actual_cost_total')}</span><span class="mono">${fmtMoney(cost)}</span>
          </div>
          <div style="margin-top:4px; font-size:12px; display:flex; justify-content:space-between; padding-left:10px;">
            <span style="color:var(--text-muted);">— ${tr('fin_labor.material_other')}</span><span class="mono">${fmtMoney(breakdown.materialAndOther)}</span>
          </div>
          <div style="margin-top:2px; font-size:12px; display:flex; justify-content:space-between; padding-left:10px;">
            <span style="color:var(--text-muted);">— ${tr('fin_labor.labor_label')}</span><span class="mono">${fmtMoney(breakdown.labor)}</span>
          </div>
          <div style="height:7px; border-radius:4px; margin-top:6px; overflow:hidden; display:flex;">
            <div style="height:100%; width:${materialPct}%; background:var(--steel);"></div>
            <div style="height:100%; width:${100-materialPct}%; background:var(--orange);"></div>

const JOURNAL_SOURCE_LABELS = {
  revenue: 'รายรับ', project_expense: 'ต้นทุนโครงการ', office_expense: 'ค่าใช้จ่ายสำนักงาน',
  retention: 'เงินประกันผลงาน', labor: 'ค่าแรง', manual: 'บันทึกเอง',
};
function journalDateQuery(){
  const params = new URLSearchParams();
  if(S.journalFilters.from) params.set('from', S.journalFilters.from);
  if(S.journalFilters.to) params.set('to', S.journalFilters.to);
  if(S.journalFilters.sourceType) params.set('sourceType', S.journalFilters.sourceType);
  if(S.journalFilters.projectId) params.set('projectId', S.journalFilters.projectId);
  const qs = params.toString();
  return qs ? '?'+qs : '';
}
// Every client-ledger create/delete/settle action must call this — otherwise สมุดรายวัน and the
// phase-3 statements (งบทดลอง/งบกำไรขาดทุน/งบดุล) show stale cached data after the underlying
// journal changes (a real bug that was actually caught by the item-6 Playwright test, not just a
// theoretical concern — see project_client_ledger memory).
function invalidateReportCaches(){
  S.journalEntriesLoaded = false;

}
