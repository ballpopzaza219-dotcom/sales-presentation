      <tbody>
        ${DB.projects.map(p=>{
          const cost=projectCostTotal(p.id), diff=p.budget-cost, pct= p.budget? Math.round(cost/p.budget*1000)/10 : 0;
          return `<tr><td>${p.name}</td><td class="mono">${fmtMoney(p.budget)}</td><td class="mono">${fmtMoney(cost)}</td>
            <td class="mono" style="font-weight:700; color:${diff>=0?'var(--green)':'var(--red)'};">${diff>=0?'+':''}${fmtMoney(diff)}</td>
            <td class="mono">${pct}%</td></tr>`;
        }).join('')}
      </tbody>
    </table></div>`;
  } else if(S.reportTab==='cash'){
    body = `<div class="table-wrap"><table>
      <thead><tr><th>${tr('ledger.col_project')}</th><th>${tr('fin_reports.cash_in')}</th><th>${tr('fin_reports.cash_out')}</th><th>${tr('fin_reports.net')}</th></tr></thead>
      <tbody>
        ${DB.projects.map(p=>{
          const cin=sumBy(DB.cashBank.filter(c=>c.projectId===p.id && c.type==='in'), c=>c.amount);
          const cout=sumBy(DB.cashBank.filter(c=>c.projectId===p.id && c.type==='out'), c=>c.amount);
          return `<tr><td>${p.name}</td><td class="mono" style="color:var(--green);">+${fmtMoney(cin)}</td><td class="mono" style="color:var(--red);">-${fmtMoney(cout)}</td>
            <td class="mono" style="font-weight:700;">${fmtMoney(cin-cout)}</td></tr>`;
        }).join('')}
        <tr><td><b>${tr('ledger.central')} (${tr('ledger.no_project')})</b></td>
          <td class="mono" style="color:var(--green);">+${fmtMoney(sumBy(DB.cashBank.filter(c=>!c.projectId && c.type==='in'), c=>c.amount))}</td>
          <td class="mono" style="color:var(--red);">-${fmtMoney(sumBy(DB.cashBank.filter(c=>!c.projectId && c.type==='out'), c=>c.amount))}</td>
          <td class="mono" style="font-weight:700;">${fmtMoney(sumBy(DB.cashBank.filter(c=>!c.projectId && c.type==='in'), c=>c.amount)-sumBy(DB.cashBank.filter(c=>!c.projectId && c.type==='out'), c=>c.amount))}</td>
        </tr>
      </tbody>
    </table></div>`;
  } else if(S.reportTab==='flow'){
    const rows = DB.cashBank.slice().sort((a,b)=>a.date.localeCompare(b.date));
    let running=0;
    body = `<div class="table-wrap"><table>
      <thead><tr><th>${tr('ledger.col_date')}</th><th>${tr('common.col_type')}</th><th>${tr('ledger.cashbank.account_label')}</th><th>${tr('fin_stock.move_in')}</th><th>${tr('fin_stock.move_out')}</th><th>${tr('fin_reports.running_balance')}</th></tr></thead>
      <tbody>
        ${rows.map(r=>{
          running += r.type==='in'? r.amount : -r.amount;
          return `<tr><td>${r.date}</td><td>${r.desc}</td><td>${r.account==='cash'?tr('ledger.cashbank.cash'):tr('ledger.cashbank.bank')}</td>
            <td class="mono" style="color:var(--green);">${r.type==='in'?'+'+fmtMoney(r.amount):'-'}</td>
            <td class="mono" style="color:var(--red);">${r.type==='out'?'-'+fmtMoney(r.amount):'-'}</td>
            <td class="mono" style="font-weight:700;">${fmtMoney(running)}</td></tr>`;
        }).join('')}
      </tbody>
    </table></div>`;
  } else if(S.reportTab==='labor'){
    const month = S.laborReportMonth || new Date().toISOString().slice(0,7);
    const inMonth = DB.laborCosts.filter(l=>(l.workDate||'').slice(0,7)===month);
    const byEmp = {};
    inMonth.forEach(l=>{
      if(!byEmp[l.employeeId]) byEmp[l.employeeId] = {days:0, amount:0, entries:0};
      byEmp[l.employeeId].days += Number(l.daysWorked)||0;
      byEmp[l.employeeId].amount += Number(l.amount)||0;
      byEmp[l.employeeId].entries += 1;
    });
    const empRows = Object.entries(byEmp).map(([eid, v])=>({emp:DB.employees.find(x=>x.id===Number(eid)), ...v}))
      .filter(r=>r.emp)
      .sort((a,b)=>a.emp.fullName.localeCompare(b.emp.fullName,'th'));
    const grandTotal = sumBy(empRows, r=>r.amount);
    body = `
    <div class="small-btn-row" style="margin-bottom:14px;">
      <label style="font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:8px;">${tr('fin_reports.month_label')}:
        <input type="month" value="${month}" onchange="S.laborReportMonth=this.value; render();">
      </label>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>${tr('fin_employees.col_employee_code')}</th><th>${tr('fin_employees.col_full_name')}</th><th>${tr('common.col_position')}</th><th>${tr('fin_employees.col_employment_type')}</th><th>${tr('fin_reports.days_entries')}</th><th>${tr('fin_reports.total_labor')}</th></tr></thead>
      <tbody>
        ${empRows.length===0 ? `<tr><td colspan="6"><div class="empty" style="padding:20px 0;">${tr('fin_reports.no_labor_this_month')}</div></td></tr>` : empRows.map(r=>`
          <tr>
            <td class="mono">${r.emp.employeeCode}</td>
            <td>${r.emp.fullName}</td>
            <td>${r.emp.position}</td>
            <td>${EMPLOYMENT_TYPES[r.emp.employmentType]||r.emp.employmentType}</td>
            <td class="mono">${tr('fin_reports.days_entries_value', {days: r.days, entries: r.entries})}</td>
            <td class="mono" style="font-weight:700;">${fmtMoney(r.amount)}</td>
          </tr>`).join('')}
        ${empRows.length>0?`<tr><td colspan="5" style="text-align:right; font-weight:700;">${tr('fin_reports.grand_total')}</td><td class="mono" style="font-weight:700;">${fmtMoney(grandTotal)}</td></tr>`:''}
      </tbody>
    </table></div>`;
  }
  return `
  <div class="page-head"><div><h2>${tr('nav.fin_reports')}</h2><div class="sub">${tr('fin_reports.subtitle')}</div></div></div>
  <div class="tabs">
    ${tabs.map(t=>`<button class="tab ${S.reportTab===t.key?'active':''}" data-act="report-tab" data-key="${t.key}">${t.label}</button>`).join('')}
  </div>
  <div class="card" style="padding:20px 22px;">${body}</div>`;
}

// ---------- Year-end closing simulation ----------
function pageFinYearEnd(){
  const years = availableYears();
  const y = years.includes(S.yearEndYear) ? S.yearEndYear : years[years.length-1];
  S.yearEndYear = y;
  const closed = DB.closedYears.find(c=>c.year===y);

  const revenue = yearRevenue(y);
  const cost = yearCost(y);
  const grossProfit = revenue - cost;
  const office = yearOffice(y);
  const netProfitBeforeTax = grossProfit - office;
  const taxEstimate = netProfitBeforeTax>0 ? netProfitBeforeTax*0.20 : 0;
  const netProfit = netProfitBeforeTax - taxEstimate;

  const cash = cashBankBalance();
  const receivable = receivablesOutstanding();
  const payable = payablesOutstanding();
  const inventory = inventoryValue();
  const totalAssets = cash + receivable + inventory;
  const retainedBefore = retainedEarningsBefore(y);
  const retainedAfter = retainedBefore + (closed ? closed.snapshot.netProfit : netProfit);
  const equity = retainedAfter;

  return `
  <div class="page-head">
    <div><h2>ปิดงบประจำปี</h2><div class="sub">แบบจำลองการปิดงบการเงินประจำปี สรุปกำไร-ขาดทุนและฐานะการเงิน ณ สิ้นปี</div></div>
    <div style="display:flex; gap:8px; align-items:center;">
      <select id="ye-year" style="padding:9px 14px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); font-size:13.5px; font-weight:600; color:var(--navy);" data-act="yearend-select">
        ${years.map(yy=>`<option value="${yy}" ${yy===y?'selected':''}>ปีบัญชี ${yy}</option>`).join('')}
      </select>
      <button class="btn btn-ghost" data-act="print-doc">${ICN.printer} พิมพ์เอกสาร</button>
    </div>
  </div>

  ${closed ? `
  <div class="perm-note" style="border-color:var(--green); background:var(--green-bg); color:var(--green);">
    ${ICN.lock}
    <div><b>ปิดงบปี ${y} เรียบร้อยแล้ว</b> — ปิดโดย ${closed.closedBy} เมื่อ ${closed.closedDate} · ตัวเลขด้านล่างเป็นสถานะ ณ วันที่ปิดงบ</div>
  </div>` : `
  <div class="perm-note">${ICN.info}<div>ปีบัญชี ${y} ยังไม่ได้ปิดงบ — ตัวเลขด้านล่างคำนวณจากข้อมูลปัจจุบันแบบเรียลไทม์ สามารถกด "ปิดงบปี ${y}" เพื่อบันทึกเป็นทางการได้เมื่อพร้อม</div></div>
  `}

  <div class="section-title">งบกำไรขาดทุน (Income Statement) · ปี ${y}</div>
  <div class="card" style="padding:22px 24px; margin-bottom:24px; max-width:640px;">
    ${ieRow('รายรับรวม (Total Revenue)', revenue, false)}
    ${ieRow('หัก ต้นทุนโครงการ (Project Cost)', -cost, false)}
    ${ieRow('กำไรขั้นต้น (Gross Profit)', grossProfit, true)}
    ${ieRow('หัก ค่าใช้จ่ายสำนักงาน (Operating Expense)', -office, false)}
    ${ieRow('กำไรก่อนภาษี (Net Profit Before Tax)', netProfitBeforeTax, true)}
    ${ieRow('ประมาณการภาษีนิติบุคคล (20%)', -taxEstimate, false)}
    <div style="display:flex; justify-content:space-between; padding-top:14px; margin-top:8px; border-top:2px solid var(--navy);">
      <span style="font-weight:800; color:var(--navy); font-family:'Manrope';">กำไรสุทธิ (Net Profit)</span>
      <span class="mono" style="font-weight:800; font-size:17px; color:${netProfit>=0?'var(--green)':'var(--red)'};">${netProfit>=0?'+':''}${fmtMoney(netProfit)}</span>
    </div>
  </div>

  <div class="section-title">ฐานะการเงินโดยสรุป (Financial Position Snapshot) · ณ สิ้นปี ${y}</div>
  <div class="split" style="margin-bottom:24px;">
    <div class="card" style="padding:20px 22px;">
      <div style="font-weight:700; color:var(--navy); font-size:13px; margin-bottom:12px;">สินทรัพย์ (Assets)</div>
      ${bsRow('เงินสดและธนาคาร', cash)}
      ${bsRow('ลูกหนี้คงค้าง', receivable)}
      ${bsRow('มูลค่าสต๊อกวัสดุคงเหลือ', inventory)}
      <div style="display:flex; justify-content:space-between; padding-top:10px; margin-top:6px; border-top:1px solid var(--border);">
        <span style="font-weight:700; font-size:13px;">รวมสินทรัพย์</span><span class="mono" style="font-weight:700;">${fmtMoney(totalAssets)}</span>
      </div>
    </div>
    <div class="card" style="padding:20px 22px;">
      <div style="font-weight:700; color:var(--navy); font-size:13px; margin-bottom:12px;">หนี้สินและส่วนของเจ้าของ (Liabilities &amp; Equity)</div>
      ${bsRow('เจ้าหนี้คงค้าง', payable)}
      ${bsRow('กำไรสะสมยกมา', retainedBefore)}
      ${bsRow(closed?'กำไรสุทธิปีนี้ (ปิดงบแล้ว)':'กำไรสุทธิปีนี้ (ยังไม่ปิดงบ)', closed?closed.snapshot.netProfit:netProfit)}
      <div style="display:flex; justify-content:space-between; padding-top:10px; margin-top:6px; border-top:1px solid var(--border);">
        <span style="font-weight:700; font-size:13px;">รวมหนี้สิน+ส่วนของเจ้าของ</span><span class="mono" style="font-weight:700;">${fmtMoney(payable+retainedAfter)}</span>
      </div>
    </div>
  </div>

  <div class="card" style="padding:20px 22px; margin-bottom:24px;">
    <div class="small-btn-row" style="margin-top:0;">
      ${closed
        ? `<button class="btn btn-danger" data-act="reopen-year" data-year="${y}">${ICN.unlock} เปิดงบปี ${y} อีกครั้ง (แก้ไขข้อมูล)</button>`
        : `<button class="btn btn-primary" data-act="close-year" data-year="${y}">${ICN.lock} ปิดงบปี ${y}</button>`}
    </div>
    <div class="hint" style="margin-top:10px;">การปิดงบเป็นการบันทึกภาพรวมตัวเลข ณ ขณะนั้นไว้เป็นประวัติ ไม่ได้ล็อกการแก้ไขข้อมูลจริงในระบบสาธิตนี้</div>
  </div>

  <div class="section-title">ประวัติการปิดงบ</div>
  <div class="card" style="padding:20px 22px;">
    ${DB.closedYears.length===0 ? `<div class="empty"><div class="em-icon">${ICN.archive}</div>ยังไม่มีประวัติการปิดงบ</div>` : `
    <div class="table-wrap"><table>
      <thead><tr><th>ปีบัญชี</th><th>รายรับ</th><th>ต้นทุน+ค่าใช้จ่าย</th><th>กำไรสุทธิ</th><th>ปิดงบเมื่อ</th><th>ปิดโดย</th></tr></thead>
      <tbody>
        ${DB.closedYears.slice().sort((a,b)=>b.year.localeCompare(a.year)).map(c=>`
          <tr>
            <td><b>${c.year}</b></td>
            <td class="mono">${fmtMoney(c.snapshot.revenue)}</td>
            <td class="mono">${fmtMoney(c.snapshot.cost+c.snapshot.office)}</td>
            <td class="mono" style="font-weight:700; color:${c.snapshot.netProfit>=0?'var(--green)':'var(--red)'};">${c.snapshot.netProfit>=0?'+':''}${fmtMoney(c.snapshot.netProfit)}</td>
            <td>${c.closedDate}</td>
            <td>${c.closedBy}</td>
          </tr>`).join('')}
      </tbody>
    </table></div>`}
  </div>`;
}
function ieRow(label, val, bold){
  return `<div style="display:flex; justify-content:space-between; padding:${bold?'10px 0':'7px 0'}; ${bold?'border-top:1px solid var(--border); margin-top:4px;':''}">
    <span style="font-size:13px; ${bold?'font-weight:700; color:var(--navy);':'color:var(--text-muted);'}">${label}</span>
    <span class="mono" style="font-size:13px; ${bold?'font-weight:700;':''} color:${val<0?'var(--red)':bold?'var(--navy)':'var(--text)'};">${val<0?'-':''}${fmtMoney(Math.abs(val))}</span>
  </div>`;
}
function bsRow(label, val){
  return `<div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;">
    <span style="color:var(--text-muted);">${label}</span><span class="mono">${fmtMoney(val)}</span>
  </div>`;
}

function buildChain(pr){
  const stepsMap = {
    single_auto: [{k:'requester',l:'ผู้ขอ (Auto)'}],
    single_dual: [{k:'requester',l:'ผู้ขอ'},{k:'partner',l:'ผู้อนุมัติคู่'}],
    maker: [{k:'maker',l:'Maker'},{k:'checker',l:'Checker'},{k:'approver',l:'Approver'}],
    super_user: [{k:'requester',l:'Super User (Auto)'}],
  };
  let steps = stepsMap[pr.requesterRole] || stepsMap.maker;
  if(pr.requesterRole==='maker' && !pr.items) steps = stepsMap.maker;
  let doneCount;
  if(pr.status==='approved') doneCount = steps.length;
  else if(pr.status==='rejected') doneCount = -1;
  else if(pr.status==='pending_check') doneCount = 1;
  else doneCount = steps.length - 1;

  return steps.map((s,i)=>{
    let cls='';
    if(pr.status==='rejected' && i===doneCount+1) cls='rejected';
    else if(i < doneCount || pr.status==='approved') cls='done';
    else if(i === doneCount && pr.status!=='approved') cls='current';
    const line = i < steps.length-1 ? `<div class="chain-line ${i<doneCount?'done':''}"></div>` : '';
    return `<div class="chain-node ${cls}"><div class="chain-circle">${cls==='done'?'✓':i+1}</div><div class="chain-lbl">${s.l}</div></div>${line}`;
  }).join('');
}

function prActionButtons(pr){
  const u = S.currentUser;
  let can = false, actionLabel='';
  if(pr.status==='pending_check' && u.role==='checker') { can=true; }
  if(pr.status==='pending_approval' && u.role==='approver') { can=true; }
  if(pr.status==='pending_approval' && u.role==='single_dual' && pr.requester!==u.name && pr.requesterRole==='single_dual') { can=true; }
  if(!can) return '';
  return `<div class="small-btn-row" style="margin-top:16px;">
    <button class="btn btn-navy btn-sm" data-act="pr-approve" data-id="${pr.id}">✓ อนุมัติ / ส่งต่อ</button>
    <button class="btn btn-danger btn-sm" data-act="pr-reject" data-id="${pr.id}">ปฏิเสธ</button>
  </div>`;
}

// ================= EVENT HANDLING =================
function attachHandlers(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    if(el.tagName==='SELECT'){
      el.onchange = ()=>{ handleAction(el.dataset.act, el); };
      return;
    }
    el.onclick = (e)=>{
      if(el.dataset.stop) return;
      const act = el.dataset.act;
      handleAction(act, el, e);
    };
  });
  document.querySelectorAll('.modal').forEach(m=>{ m.onclick = (e)=>e.stopPropagation(); });
  wireScheduleScrollSync();
  updateScheduleChartOverlay();
}

async function handleAction(act, el){
  const d = S.setupData;
  if(act==='go-setup'){
    S.view='setup'; render();
    return;
  }
  if(act==='go-login'){ seedIfEmpty('template'); S.view='login'; render(); return; }
  if(act==='go-landing'){ S.view='landing'; render(); return; }
  if(act==='go-job-search'){ S.jobSearch={query:'', results:[], busy:false}; S.view='job-search'; render(); return; }
  if(act==='select-job-company'){
    const id = parseInt(el.dataset.id);
    const company = (S.jobSearch.results||[]).find(c=>c.id===id);
    if(!company) return;
    S.publicCompany = company;
    S.appForm = {step:0, editId:null, draft:blankJobApplication(), public:true};
    S.view = 'job-apply';
    render();
    ensureGeoForAddress(S.appForm.draft);
    loadPublicJobPositions(company.id);
    return;
  }
  if(act==='job-apply-exit'){ S.appForm=null; S.publicCompany=null; S.view='job-search'; render(); return; }

  // ---- Public self-service leave request (บันทึกวันลา, no login) ----
  if(act==='go-leave-search'){ S.leaveSearch={query:'', results:[], busy:false}; S.view='leave-search'; render(); return; }
  if(act==='select-leave-company'){
    const id = parseInt(el.dataset.id);
    const company = (S.leaveSearch.results||[]).find(c=>c.id===id);
    if(!company) return;
    S.leavePublicCompany = company;
    S.leaveVerify = {step:'input', employeeCode:'', busy:false, error:''};
    S.view = 'leave-verify';
    render();
    return;
  }
  if(act==='leave-verify-back'){ S.leaveVerify = {step:'input', employeeCode:'', busy:false, error:''}; render(); return; }
  if(act==='leave-verify-submit'){
    const v = S.leaveVerify;
    const code = (v.employeeCode||'').trim();
    if(!code){ v.error = tr('leave_public.enter_employee_id_err'); render(); return; }
    v.busy = true; v.error=''; render();
    try{
      const data = await apiCall('POST', `/api/public/companies/${S.leavePublicCompany.id}/leave-verify`, {employeeCode: code});
      S.leaveSelfEmployee = data.employee;
      S.leaveSelfLeaveTypes = data.leaveTypes || [];
      S.leaveSelfBalances = data.balances || [];
      v.busy = false; v.step = 'confirm'; v.error='';
    } catch(e){
      v.busy = false; v.error = e.message;
    }
    render(); return;
  }
  if(act==='leave-verify-confirm-no'){
    S.leaveVerify = {step:'input', employeeCode:'', busy:false, error:''};
    S.leaveSelfEmployee = null; S.leaveSelfLeaveTypes = []; S.leaveSelfBalances = [];
    render(); return;
  }
  if(act==='leave-verify-confirm-yes'){
    S.leaveSelfForm = {leaveTypeId:'', startDate:'', endDate:'', reason:''};
    S.view = 'leave-self-form';
    render(); return;
  }
  if(act==='leave-self-form-exit'){
    S.leaveSelfEmployee=null; S.leaveSelfLeaveTypes=[]; S.leaveSelfBalances=[]; S.leaveSelfForm={leaveTypeId:'', startDate:'', endDate:'', reason:''};
    S.leavePublicCompany=null; S.view='leave-search'; render(); return;
  }
  if(act==='leave-self-form-submit'){
    const f = S.leaveSelfForm;
    if(!f.leaveTypeId || !f.startDate || !f.endDate){ toast(tr('common.fill_required_fields'),'err'); return; }
    if(f.endDate < f.startDate){ toast(tr('leave_request.end_before_start_err'),'err'); return; }
    S.leaveSelfBusy = true; render();
    try{
      const data = await apiCall('POST', '/api/public/leave-requests', {
        companyId: S.leavePublicCompany.id, employeeCode: S.leaveVerify.employeeCode.trim(),
        leaveTypeId: parseInt(f.leaveTypeId), startDate: f.startDate, endDate: f.endDate, reason: f.reason,
      });
      const lt = S.leaveSelfLeaveTypes.find(t=>String(t.id)===String(f.leaveTypeId));
      S.leaveRequestThanksInfo = {
        companyName: data.company?data.company.name:(S.leavePublicCompany?S.leavePublicCompany.name:''),
        leaveTypeName: lt?lt.name:'', startDate: f.startDate, endDate: f.endDate,
      };
      S.leaveSelfBusy = false;
      S.leavePublicCompany=null; S.leaveSelfEmployee=null; S.leaveSelfLeaveTypes=[]; S.leaveSelfBalances=[]; S.leaveSelfForm={leaveTypeId:'', startDate:'', endDate:'', reason:''};
      S.view = 'leave-request-thanks';
    } catch(e){ S.leaveSelfBusy = false; toast(e.message,'err'); }
    render(); return;
  }
  if(act==='try-demo'){
    seedIfEmpty('demo');
    S.view='login';
    render();
    const demoUser = DB.users.find(u=>u.email.endsWith('@sitereq.demo') && u.role==='super_user') || DB.users[0];
    document.getElementById('f-loginUser').value = demoUser ? demoUser.username : '';
    document.getElementById('f-loginPass').value = 'Passw0rd!';
    return;
  }

  // ---- setup (same fields as SiteReq Admin's "เพิ่มรายชื่อบริษัทที่สนใจ") ----
  if(act==='setup-finish'){
    d.companyName = document.getElementById('f-companyName').value.trim();
    d.taxId = document.getElementById('f-taxId').value.trim();
    d.companyPhone = document.getElementById('f-companyPhone').value.trim();
    d.companyEmail = document.getElementById('f-companyEmail').value.trim();
    d.website = document.getElementById('f-website').value.trim();
    d.address = document.getElementById('f-address').value.trim();
    d.contactName = document.getElementById('f-contactName').value.trim();
    d.contactPosition = document.getElementById('f-contactPosition').value.trim();
    d.contactEmail = document.getElementById('f-contactEmail').value.trim();
    d.contactPhone = document.getElementById('f-contactPhone').value.trim();
    d.username = document.getElementById('f-username').value.trim();
    if(!d.companyName){ toast('กรุณากรอกชื่อบริษัท','err'); return; }

    S.setupBusy = true; render();
    try {
      const res = await fetch('/api/leads/trial-signup', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(d),
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'ลงทะเบียนไม่สำเร็จ');

      S.trialRefCode = data.lead?.refCode || '';
      S.setupBusy = false;
      S.view = 'trial-thanks';
    } catch(e) {
      S.setupBusy = false;
      toast(e.message || 'ลงทะเบียนไม่สำเร็จ ตรวจสอบว่าเซิร์ฟเวอร์กำลังทำงานอยู่', 'err');
    }
    render(); return;
  }

  // ---- login ----
  if(act==='fill-demo'){
    const uname = el.dataset.user;
    document.getElementById('f-loginUser').value = uname;
    document.getElementById('f-loginPass').value = 'Passw0rd!';
    return;
  }
  if(act==='do-login'){
    const uname = document.getElementById('f-loginUser').value.trim();
    const pass = document.getElementById('f-loginPass').value;
    if(S.dataMode==='demo'){
      const user = DB.users.find(u=>u.username===uname && u.password===pass);
      if(!user){ toast('ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง','err'); return; }
      S.currentUser = user; S.view='dashboard'; S.page='overview';
      render(); return;
    }
    const companyCode = document.getElementById('f-loginCompanyCode').value.trim().toUpperCase();
    if(!companyCode || !uname || !pass){ toast('กรุณากรอกรหัสบริษัท ชื่อผู้ใช้งาน และรหัสผ่าน','err'); return; }
    try {
      const res = await fetch('/api/customer-login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ companyCode, username: uname, password: pass }),
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'เข้าสู่ระบบไม่สำเร็จ');
      DB.company = data.company;
      S.currentUser = {
        id: data.customer.id, username: data.customer.username, email: data.customer.email,
        name: data.customer.name, position: data.customer.position, role: data.customer.role || 'super_user', active: true,
        canApproveApplications: !!data.customer.can_approve_applications,
        canApproveBudget: !!data.customer.can_approve_budget,
      };
      S.view='dashboard'; S.page='overview';
      render();
      loadNotifications();
      if(PENDING_JOB_APPLICATION_ID) openJobApplicationById(parseInt(PENDING_JOB_APPLICATION_ID, 10));
    } catch(e){
      toast(e.message || 'เข้าสู่ระบบไม่สำเร็จ ตรวจสอบว่าเซิร์ฟเวอร์กำลังทำงานอยู่', 'err');
    }
    return;
  }
  if(act==='logout'){ S.currentUser=null; S.view='login'; S.customerUsersLoaded=false; S.approvalRulesLoaded=false; S.approvalConditionsLoaded=false; S.jobPositionsLoaded=false; S.employeesLoaded=false; S.jobApplicationsLoaded=false; S.foreignWorkerDocumentsLoaded=false; S.tendersLoaded=false; S.notifications=[]; S.notificationsUnread=0; S.notifDropdownOpen=false; render(); return; }
  if(act==='toggle-notif-dropdown'){ S.notifDropdownOpen = !S.notifDropdownOpen; render(); return; }
  if(act==='set-locale'){ await I18N.setLocale(el.dataset.locale); return; }
  if(act==='open-notification'){
    const nid = parseInt(el.dataset.id, 10);
    const n = S.notifications.find(x=>x.id===nid);
    S.notifDropdownOpen = false;
    if(n && !n.isRead){
      n.isRead = true;
      S.notificationsUnread = Math.max(0, S.notificationsUnread-1);
      apiCall('POST', `/api/customer/notifications/${nid}/mark-read`).catch(()=>{});
    }
    if(n && n.type==='new_leave_request') await openLeaveRequestNotification();
    else if(n && n.relatedId) await openJobApplicationById(n.relatedId);
    else render();
    return;
  }

  if(act==='upload-logo'){
    const fileInput = document.getElementById('cs-logo-file');
    const file = fileInput && fileInput.files[0];
    if(!file){ toast('กรุณาเลือกไฟล์โลโก้','err'); return; }
    S.logoUploading = true; render();
    try {
      const fd = new FormData();
      fd.append('logo', file);
      const res = await fetch('/api/customer/logo', { method:'POST', body: fd });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'อัปโหลดโลโก้ไม่สำเร็จ');
      DB.company = data.company;
      toast('อัปโหลดโลโก้บริษัทเรียบร้อยแล้ว');
    } catch(e){
      toast(e.message || 'อัปโหลดโลโก้ไม่สำเร็จ', 'err');
    }
    S.logoUploading = false;
    render();
    return;
  }

  // ---- nav ----
  if(act==='nav'){
    S.page = el.dataset.page;
    // data-module lets a nav link also switch S.module (e.g. any link into fin_projects/
    // fin_project_add/fin_project_detail sets data-module="bidding", since those pages moved out of
    // the Finance sidebar — without this, arriving at a Bidding-module page while S.module was still
    // 'finance' would make renderDashboard's fallback-redirect check (nav.find against the WRONG
    // module's nav array) think the page doesn't belong anywhere and bounce back to fin_overview).
    // Omitting it (every other existing nav link) leaves S.module untouched, unchanged behavior.
    if(el.dataset.module) S.module = el.dataset.module;
    // data-id-field lets a nav link target a different S property than the original
    // selectedProjectId default (added for Tenders/Budgets, which are separate entities from
    // projects) — omitting it keeps every existing project link's behavior unchanged.
    if(el.dataset.id) S[el.dataset.idField || 'selectedProjectId'] = parseInt(el.dataset.id, 10);
    render();
    // โครงการ (client_projects) backs the project pickers on cost/revenue/labor forms, budget-vs-
    // actual, and the project list/detail pages themselves — load it once, on first visit to any
    // of them, rather than duplicating the load call in every single one of those page branches.
    const PROJECT_DEPENDENT_PAGES = ['fin_projects','fin_project_add','fin_project_detail','fin_costs','fin_revenue','fin_retention','fin_receive_payment','fin_labor','fin_labor_pay','create_pr','fin_po','fin_po_add','fin_quotations','fin_quotation_add','fin_documents','fin_document_add'];
    if(PROJECT_DEPENDENT_PAGES.includes(S.page) && S.dataMode!=='demo' && !S.projectsLoaded) await loadRealProjects();
    if(S.page==='fin_tender_overview' && S.dataMode!=='demo' && !S.tenderOverviewLoaded) await loadTenderOverview();
    if(S.page==='fin_project_schedule' && S.dataMode!=='demo') await loadProjectTasks(S.selectedProjectId);
    if(S.page==='fin_tenders' && S.dataMode!=='demo' && !S.tendersLoaded) await loadRealTenders();
    if(S.page==='fin_tender_detail' && S.dataMode!=='demo'){
      if(!S.tendersLoaded) await loadRealTenders();
      // Always refetch — the tender's status (and therefore its budget's existence/state) can have
      // just changed via set-tender-status, so a stale cached value here would show wrong info.
      await loadTenderBudget(S.selectedTenderId);
      await loadTenderInstallments(S.selectedTenderId);
    }
    if(S.page==='fin_budget_detail' && S.dataMode!=='demo') await loadBudgetDetail(S.selectedBudgetId);
    if(S.page==='fin_project_detail' && S.dataMode!=='demo'){
      await loadProjectBudget(S.selectedProjectId); // same "always refetch" reasoning as fin_tender_detail above
      await loadRealProjectDetail(S.selectedProjectId); // fetches the new detail fields + installments
    }
    if(S.page==='fin_po' && S.dataMode!=='demo' && !S.purchaseOrdersLoaded) await loadRealPurchaseOrders();
    if(S.page==='fin_quotations' && S.dataMode!=='demo' && !S.quotationsLoaded) await loadRealQuotations();
    if(S.page==='fin_documents' && S.dataMode!=='demo' && !S.clientDocumentsLoaded) await loadRealClientDocuments();
    // pageFinProjectAdd()'s PM/foreman dropdowns are sourced from DB.employees, same as pageFinLabor()'s.
    if(S.page==='fin_project_add' && S.dataMode!=='demo' && !S.employeesLoaded) await loadRealEmployees();
    if(S.page==='fin_project_add' && S.dataMode!=='demo' && !S.tendersLoaded) await loadRealTenders();
    if(S.page==='users' && S.dataMode!=='demo' && !S.customerUsersLoaded) await loadCustomerUsers();
    if(S.page==='conditions' && S.dataMode!=='demo' && !S.approvalConditionsLoaded) await loadApprovalConditions();
    if(S.page==='job_positions' && S.dataMode!=='demo' && !S.jobPositionsLoaded) await loadRealJobPositions();
    if(S.page==='leave_types' && S.dataMode!=='demo' && !S.leaveTypesLoaded) await loadRealLeaveTypes();
    if(S.page==='public_holidays' && S.dataMode!=='demo' && !S.publicHolidaysLoaded) await loadRealPublicHolidays(S.publicHolidaysYear);
    if(S.page==='emp_leave_request' && S.dataMode!=='demo'){
      if(!S.employeesLoaded) await loadRealEmployees();
      if(!S.leaveTypesLoaded) await loadRealLeaveTypes();
      if(!S.leaveRequestsLoaded) await loadRealLeaveRequests();
    }
    if(S.page==='emp_leave_calendar' && S.dataMode!=='demo' && !S.leaveRequestsLoaded) await loadRealLeaveRequests();
    if(S.page==='fin_labor' && S.dataMode!=='demo'){
      if(!S.employeesLoaded) await loadRealEmployees();
      if(!S.leaveRequestsLoaded) await loadRealLeaveRequests();
      if(!S.laborCostsLoaded) await loadRealLaborCosts();
    }
    if(S.page==='fin_labor_pay' && S.dataMode!=='demo'){
      if(!S.employeesLoaded) await loadRealEmployees();
      if(!S.laborCostsLoaded) await loadRealLaborCosts();
    }
    if(S.page==='fin_journal' && S.dataMode!=='demo' && !S.journalEntriesLoaded) await loadRealJournalEntries();
    if(S.page==='fin_trial_balance' && S.dataMode!=='demo' && !S.trialBalanceData) await loadTrialBalance();
    if(S.page==='fin_income_statement' && S.dataMode!=='demo' && !S.incomeStatementData){
      if(!S.incomeStatementFrom || !S.incomeStatementTo){
        const now = new Date();
        S.incomeStatementFrom = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
        S.incomeStatementTo = now.toISOString().slice(0,10);
      }
      await loadIncomeStatement();
    }
    if(S.page==='fin_balance_sheet' && S.dataMode!=='demo' && !S.balanceSheetData) await loadBalanceSheet();
    if(S.page==='fin_employees' && S.dataMode!=='demo'){
      if(!S.employeesLoaded) await loadRealEmployees();
      if(!S.customerUsersLoaded) await loadCustomerUsers();
    }
    if(S.page==='emp_applicants' && S.dataMode!=='demo'){
      if(!S.jobApplicationsLoaded) await loadRealJobApplications();
      if(!S.customerUsersLoaded) await loadCustomerUsers();
    }
    if(S.page==='approval_permissions' && S.dataMode!=='demo' && !S.customerUsersLoaded) await loadCustomerUsers();
    if(S.page==='approval_permissions' && S.dataMode!=='demo' && !S.approvalRulesLoaded) await loadApprovalRules();
    if((S.page==='foreign_worker_docs' || S.page==='foreign_worker_expiry') && S.dataMode!=='demo'){
      if(!S.employeesLoaded) await loadRealEmployees();
      if(!S.foreignWorkerDocumentsLoaded) await loadRealForeignWorkerDocuments();
    }
    if(S.page==='fin_costs' && S.dataMode!=='demo' && !S.costsLoaded) await loadRealProjectCosts();
    if(S.page==='fin_office' && S.dataMode!=='demo' && !S.officeExpensesLoaded) await loadRealOfficeExpenses();
    if((S.page==='fin_revenue' || S.page==='fin_retention' || S.page==='fin_receive_payment') && S.dataMode!=='demo' && !S.revenueLoaded) await loadRealRevenue();
    return;
  }
  if(act==='switch-module'){
    S.module = el.dataset.module;
    S.page = S.module==='finance' ? 'fin_overview' : S.module==='employees' ? 'emp_overview' : S.module==='bidding' ? 'fin_tender_overview' : 'overview';
    render();
    // Every OTHER module's default landing page reads straight from already-populated DB.* arrays
    // (no S.xLoaded gate), so switch-module never needed to fetch anything before. fin_tender_overview
    // is the first one that does (it shows a loading skeleton while !S.tenderOverviewLoaded) — without
    // this, landing here via the module-switch button (rather than a sidebar 'nav' click, which DOES
    // trigger loaders — see the big if(S.page===...) chain below) would leave the skeleton showing
    // forever until the user happened to click something else in the sidebar.
    if(S.module==='bidding' && S.dataMode!=='demo' && !S.tenderOverviewLoaded) await loadTenderOverview();
    return;
  }
  if(act==='report-tab'){ S.reportTab = el.dataset.key; render(); return; }
  if(act==='yearend-select'){ S.yearEndYear = el.value; render(); return; }
  if(act==='print-doc'){ window.print(); return; }
  if(act==='open-schedule-print-modal'){ S.modal={type:'schedule-print', paperSize:'A4', scaleMode:'fit-page', margin:'normal'}; render(); return; }
  if(act==='execute-schedule-print'){ scheduleExecutePrint(S.modal.paperSize, S.modal.scaleMode, S.modal.margin); return; }
  if(act==='close-year'){
    const year = el.dataset.year;
    if(DB.closedYears.find(c=>c.year===year)){ toast('ปีนี้ปิดงบไปแล้ว','err'); return; }
    const revenue = yearRevenue(year), cost = yearCost(year), office = yearOffice(year);
    const netProfitBeforeTax = revenue - cost - office;
    const tax = netProfitBeforeTax>0 ? netProfitBeforeTax*0.20 : 0;
    const netProfit = netProfitBeforeTax - tax;
    DB.closedYears.push({id:uid(), year, closedDate:nowStr(), closedBy:S.currentUser.name, snapshot:{revenue, cost, office, tax, netProfit}});
    toast(`ปิดงบปี ${year} เรียบร้อยแล้ว`);
    render(); return;
  }
  if(act==='reopen-year'){
    const year = el.dataset.year;
    DB.closedYears = DB.closedYears.filter(c=>c.year!==year);
    toast(`เปิดงบปี ${year} อีกครั้งแล้ว`,'err');
    render(); return;
  }

  // ---- PR create ----
  if(act==='add-item'){
    S.prForm.items.push({material:'',area:'',brand:'',size:'',qty:'',unit:'',price:''});
    render();
    return;
  }
  if(act==='remove-item'){
    S.prForm.items.splice(parseInt(el.dataset.idx,10), 1);
    render();
    return;
  }
  if(act==='select-pr-project'){
    const id = parseInt(el.dataset.id, 10);
    const p = DB.projects.find(x=>x.id===id);
    if(!p || !S.prForm) return;
    S.prForm.projectId = p.id;
    S.prForm.projectSearchText = `${p.name} · ${p.code}`;
    S.prForm.projectResultsOpen = false;
    render();
    return;
  }
  if(act==='goto-add-project-from-pr'){
    S.module = 'bidding'; // Projects moved under Bidding (see biddingNavFor's comment) — was 'finance'
    S.page = 'fin_project_add';
    render();
    return;
  }
  if(act==='submit-pr'){
    const f = S.prForm;
    if(!f.projectId){ toast(tr('create_pr.project_required_err'),'err'); return; }
    const project = DB.projects.find(p=>p.id===f.projectId);
    if(!project){ toast(tr('create_pr.project_not_found_err'),'err'); return; }
    const subCode = f.subCode.trim();
    const date = f.reqDate || new Date().toISOString().slice(0,10);
    const neededDate = f.neededDate;
    const remark = f.remark.trim();
    const items=[];
    f.items.forEach(r=>{
      const material = (r.material||'').trim();
      const area = (r.area||'').trim();
      const brand = (r.brand||'').trim();
      const size = (r.size||'').trim();
      const qty = parseFloat(r.qty)||0;
      const unit = (r.unit||'').trim()||'-';
      const price = parseFloat(r.price)||0;
      if(material && qty>0) items.push({material,area,brand,size,qty,unit,price});
    });
    if(items.length===0){ toast('กรุณากรอกรายการวัสดุอย่างน้อย 1 รายการ','err'); return; }
    const u = S.currentUser;
    const foremanUserId = f.foreman;
    const managerUserId = f.manager;
    const foremanUser = foremanUserId ? DB.users.find(x=>String(x.id)===foremanUserId) : null;
    const managerUser = managerUserId ? DB.users.find(x=>String(x.id)===managerUserId) : null;
    let status, flow=[], histAction;
    if(u.role==='super_user' || u.role==='single_auto'){
      status='approved'; histAction='สร้างและอนุมัติอัตโนมัติ';
    } else if(u.role==='single_dual'){
      status='pending_approval'; histAction='สร้างรายการ (รออนุมัติคู่)';
    } else {
      status='pending_check'; histAction='สร้างรายการ (รอตรวจสอบ)';
    }
    const no = 'PR-'+String(2600+Math.floor(Math.random()*99))+'-'+String(DB.prs.length+1).padStart(4,'0');
    DB.prs.push({
      // site is kept in sync with the selected project's name purely for backward compatibility

    // save button — the server rejects a blank taskName too (defense in depth), but catching it here
    // avoids partially saving OTHER rows before hitting the one with a blank name.
    const blankManualRow = manualNewRows.find(r=>!r.taskName || !r.taskName.trim());
    if(blankManualRow){ toast(tr('fin_project_schedule.manual_row_name_required'), 'err'); return; }
    try{
      // Sequential, not Promise.all — each PUT/POST runs its own recomputeProjectTaskWbs/
      // applyAutoSchedule pass server-side (see server.js), so firing them one at a time avoids
      // concurrent transactions racing to recompute the same project's tree at once. Task counts here
      // are small WBS trees, not bulk data (same assumption the rest of this feature already makes),
      // so sequential is fast enough.
      for(const t of changedTasks){
        await apiCall('PUT', `/api/customer/projects/${S.selectedProjectId}/tasks/${t.id}`, taskEditableFields(t));
      }
      if(newTasks.length>0) await apiCall('POST', `/api/customer/projects/${S.selectedProjectId}/tasks/batch`, {tasks:newTasks});
      // Manual rows go through the single free-text POST .../tasks (not .../tasks/batch, which is
      // BOQ-only — sourceBoqItemId is required there) one at a time, each carrying its own
      // taskName/durationDays/startDate/budgetAmount.
      for(const r of manualNewRows){
        await apiCall('POST', `/api/customer/projects/${S.selectedProjectId}/tasks`, {
          taskName: r.taskName.trim(), durationDays: parseInt(r.durationDays,10)||1,
          startDate: r.startDate||null, budgetAmount: Number(r.budgetAmount)||0,
        });
      }
      await loadProjectTasks(S.selectedProjectId);
      toast(tr('common.save'));
    } catch(e){
      toast(e.message, 'err');
      // Partial success is possible (some PUTs may have already committed before the failing call) —
      // reload so the table reflects real server state rather than a stale mix of saved/unsaved rows.
      await loadProjectTasks(S.selectedProjectId);
    }
    return;
  }
  if(act==='set-schedule-zoom'){ S.scheduleZoom = el.dataset.zoom; render(); return; }
  // แผนงาน Phase 2: bulk-save every แผนงาน/ผลงาน %-per-day cell in one PUT (see server.js's comment on
  // this endpoint) — full replace, so this always sends the ENTIRE current S.taskPeriods (minus zero-
  // value rows, which are equivalent to absent), not just what changed since load.
  if(act==='save-task-periods'){
    const errors = taskPeriodsValidationErrors();
    if(errors.length>0){ toast(errors[0] + (errors.length>1 ? ` (+${errors.length-1})` : ''), 'err'); return; }
    const periods = S.taskPeriods
      .filter(p=>(Number(p.plannedPercent)||0)>0 || (Number(p.actualPercent)||0)>0)
      .map(p=>({taskId:p.taskId, periodDate:p.periodDate, plannedPercent:p.plannedPercent, actualPercent:p.actualPercent}));
    try{
      await apiCall('PUT', `/api/customer/projects/${S.selectedProjectId}/tasks/periods`, {periods});
      await loadProjectTasks(S.selectedProjectId);
      toast(tr('common.save'));
    } catch(e){ toast(e.message, 'err'); }
    return;
  }
  if(act==='delete-task'){
    const taskId = parseInt(el.dataset.id,10);
    const t = S.projectTasks.find(x=>x.id===taskId);
    if(!t) return;
    let msg = t.isSummary ? tr('fin_project_schedule.delete_summary_confirm') : tr('fin_project_schedule.delete_task_confirm');
    if(taskTableHasUnsavedChanges()) msg += ' ' + tr('fin_project_schedule.unsaved_will_be_lost_note');
    if(!confirm(msg)) return;
    try{
      await apiCall('DELETE', `/api/customer/projects/${S.selectedProjectId}/tasks/${taskId}`);
      await loadProjectTasks(S.selectedProjectId);
    } catch(e){ toast(e.message, 'err'); }
    return;
  }

  if(act==='select-project-tender'){
    S.projectAddForm.tenderResultsOpen = false;
    await onProjectAddTenderChange(el.dataset.id);
    return;
  }
  if(act==='save-project-full'){
    // Every field is already live-bound straight to S.projectAddForm as the user types (see
    // pageFinProjectAdd's own comment on why) — so this reads directly from S rather than
    // re-querying the DOM, same fix save-tender-full already got (a DOM-reconstruction here used to
    // silently drop any field not explicitly listed; now there are too many fields for that to be safe).
    if(S.projectSaving) return;
    const f = S.projectAddForm;
    const name = (f.name||'').trim();
    if(!name){ toast(tr('common.fill_required_fields'),'err'); return; }
    if(!f.sectorType){ toast(tr('fin_project_add.sector_type_required_err'),'err'); return; }
    if(f.startDate && f.endDate && f.endDate < f.startDate){ toast(tr('fin_project_add.date_order_err'),'err'); return; }
    S.projectSaving = true; render();
    try{
      const project = await apiCall('POST', '/api/customer/projects', {
        code: (f.code||'').trim(), name, clientName: (f.client||'').trim(),
        tenderId: f.tenderId ? parseInt(f.tenderId,10) : null, siteAddress: (f.address||'').trim(),
        startDate: f.startDate||null, expectedEndDate: f.endDate||null,
        budgetAmount: parseFloat(f.sectorType==='government' ? f.budgetAmount : f.budget)||0,
        defaultRetentionPercent: (f.retentionPercent!=='' && f.retentionPercent!=null) ? parseFloat(f.retentionPercent) : null,
        projectManagerEmployeeId: f.pmId ? parseInt(f.pmId,10) : null,
        foremanEmployeeId: f.foremanId ? parseInt(f.foremanId,10) : null,
        status: f.status, note: (f.note||'').trim(),
        biddingMethod: (f.biddingMethod||'').trim(), sectorType: f.sectorType, referencePrice: parseFloat(f.referencePrice)||0,
        phoneNumber: (f.phoneNumber||'').trim(), siteCoordinates: (f.siteCoordinates||'').trim(),
        submissionOpenDate: f.submissionOpenDate||null, submissionConditions: (f.submissionConditions||'').trim(),
        installments: (f.installments||[]).map(r=>({description:(r.description||'').trim(), amount:parseFloat(r.amount)||0, daysToComplete:parseInt(r.daysToComplete,10)||0})),
      });
      S.projectSaving = false;
      DB.projects.push(mapRealProject(project.project));
      toast(tr('fin_projects.added_toast'));
      S.projectAddForm = null;
      S.selectedProjectId = project.project.id;
      S.module = 'bidding';
      S.page = 'fin_project_detail';
      render();
      // Same reasoning as save-tender-full: navigating here sets S.page directly rather than going
      // through data-act="nav" (which normally triggers loadProjectBudget/loadRealProjectDetail on
      // arrival), so both fetches have to be kicked off explicitly here too.
      await loadProjectBudget(project.project.id);
      await loadRealProjectDetail(project.project.id);
    } catch(e){ S.projectSaving = false; toast(e.message, 'err'); render(); }
    return;
  }

  // ---- Finance: ใบสั่งซื้อ (Purchase Orders) ----
  if(act==='add-po-item'){
    S.poAddForm.items.push({material:'',qty:'',unit:'',unitPrice:''});
    render();
    return;
  }
  if(act==='remove-po-item'){
    const row = el.closest('[data-po-item-row]');
    if(row){ S.poAddForm.items.splice(parseInt(row.dataset.poItemRow,10), 1); render(); }
    return;
  }
  if(act==='save-po-full'){
    const f = S.poAddForm;
    if(!f.supplierName.trim()){ toast(tr('fin_po.supplier_required_err'),'err'); return; }
    const items = f.items
      .map(it=>({material:(it.material||'').trim(), qty:parseFloat(it.qty)||0, unit:(it.unit||'').trim()||'-', unitPrice:parseFloat(it.unitPrice)||0}))
      .filter(it=>it.material && it.qty>0);
    if(items.length===0){ toast(tr('fin_po.items_required_err'),'err'); return; }
    try{
      const data = await apiCall('POST', '/api/customer/purchase-orders', {
        projectId: f.projectId?parseInt(f.projectId,10):null, prReference:f.prReference, supplierName:f.supplierName,
        supplierContact:f.supplierContact, issueDate:f.issueDate||null, expectedDeliveryDate:f.expectedDeliveryDate||null,
        paymentTerms:f.paymentTerms, status:f.status, items, note:f.note,
      });
      DB.purchaseOrders.push(mapRealPurchaseOrder(data.purchaseOrder));
      toast(tr('fin_po.added_toast'));
      S.poAddForm = null;
      S.page = 'fin_po';
      render();
    } catch(e){ toast(e.message, 'err'); }
    return;
  }
  if(act==='set-po-status'){
    const id = parseInt(el.dataset.id,10);
    try{
      const data = await apiCall('PUT', `/api/customer/purchase-orders/${id}/status`, {status:el.value});
      const idx = DB.purchaseOrders.findIndex(x=>x.id===id);
      if(idx>=0) DB.purchaseOrders[idx] = mapRealPurchaseOrder(data.purchaseOrder);
      toast(tr('fin_po.status_updated_toast'));
      render();
    } catch(e){ toast(e.message, 'err'); }
    return;
  }

  // ---- Finance: ใบเสนอราคา (Quotations) ----
  if(act==='save-quotation-full'){
    const f = S.quotationAddForm;
    if(!f.clientName.trim()){ toast(tr('fin_quotations.client_required_err'),'err'); return; }
    if(!f.amount || parseFloat(f.amount)<=0){ toast(tr('fin_quotations.amount_required_err'),'err'); return; }
    try{
      const data = await apiCall('POST', '/api/customer/quotations', {
        projectId: f.projectId?parseInt(f.projectId,10):null, clientName:f.clientName, issueDate:f.issueDate||null,
        validUntil:f.validUntil||null, amount:parseFloat(f.amount), status:f.status, note:f.note,
      });
      DB.quotations.push(mapRealQuotation(data.quotation));
      toast(tr('fin_quotations.added_toast'));
      S.quotationAddForm = null;
      S.page = 'fin_quotations';
      render();
    } catch(e){ toast(e.message, 'err'); }
    return;
  }
  if(act==='set-quotation-status'){
    const id = parseInt(el.dataset.id,10);
    try{
      const data = await apiCall('PUT', `/api/customer/quotations/${id}/status`, {status:el.value});
      const idx = DB.quotations.findIndex(x=>x.id===id);
      if(idx>=0) DB.quotations[idx] = mapRealQuotation(data.quotation);
      toast(tr('fin_quotations.status_updated_toast'));
      render();
    } catch(e){ toast(e.message, 'err'); }
    return;
  }

  // ---- Finance: เอกสารทั่วไป (สัญญา/ใบส่งของ/ใบรับรองผลงาน) ----
  if(act==='save-document-full'){
    const f = S.documentAddForm;
    if(!f.docName.trim()){ toast(tr('fin_documents.name_required_err'),'err'); return; }
    const fileInput = document.getElementById('doc-file');
    const file = fileInput && fileInput.files[0];
    S.documentSaving = true; render();
    try{
      const fd = new FormData();
      fd.append('docType', f.docType);
      fd.append('docName', f.docName);
      if(f.projectId) fd.append('projectId', f.projectId);
      fd.append('docDate', f.docDate||'');
      fd.append('expiryDate', f.expiryDate||'');
      fd.append('note', f.note||'');
      if(file) fd.append('file', file);
      const res = await fetch('/api/customer/documents', { method:'POST', body: fd });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || tr('users.save_failed_err'));
      DB.clientDocuments.push(mapRealClientDocument(data.document));
      toast(tr('fin_documents.added_toast'));
      S.documentSaving = false;
      S.documentAddForm = null;
      S.page = 'fin_documents';
      render();
    } catch(e){ S.documentSaving = false; toast(e.message,'err'); render(); }
    return;
  }
  if(act==='delete-document'){
    const id = parseInt(el.dataset.id,10);
    if(!confirm(tr('fin_documents.confirm_delete'))) return;
    try{
      await apiCall('DELETE', `/api/customer/documents/${id}`);
      DB.clientDocuments = DB.clientDocuments.filter(d=>d.id!==id);
      toast(tr('common.deleted_toast'));
      render();
    } catch(e){ toast(e.message, 'err'); }
    return;
  }

  // ---- Finance: generic ledger (revenue / costs / office / receivables / payables / cashbank / documents) ----
  if(act==='open-ledger-add'){ S.modal={type:'ledger-add', key:el.dataset.key}; render(); return; }
  if(act==='save-ledger'){
    const key = el.dataset.key;
    const cfg = ledgerConfigs()[key];
    const record = {id:uid()};
    let valid = true;
    cfg.fields.forEach(f=>{
      const raw = document.getElementById(`lf-${f.id}`).value;
      if(!f.optional && !raw && raw!=='0'){ valid = false; }
      if(f.type==='number'){ record[f.id] = parseFloat(raw)||0; }
      else if(f.type==='project'){ record[f.id] = raw ? parseInt(raw) : null; }
      else { record[f.id] = raw.trim ? raw.trim() : raw; }
    });
    if(!valid){ toast(tr('common.fill_required_fields'),'err'); return; }
    if(key==='revenue'){
      record.retentionAmount = record.retentionPercent ? record.amount * record.retentionPercent / 100 : 0;
      record.retentionStatus = record.retentionAmount > 0 ? 'held' : null;
      record.retentionReleasedDate = null;
    }
    // costs/office/revenue are the ledger types backed by the real client ledger so far (see
    // project_client_ledger memory) — everything else (receivables, payables, cashbank, documents)
    // still goes through the plain DB.push below until those get wired the same way.
    if((key==='costs' || key==='office' || key==='revenue') && S.dataMode!=='demo'){
      try{
        let budgetWarnings = [];
        if(key==='costs'){
          const data = await apiCall('POST', '/api/customer/project-costs', {projectId:record.projectId, category:record.category, description:record.desc, costDate:record.date, amount:record.amount, vendor:record.vendor, workCode:record.workCode});
          budgetWarnings = data.budgetWarnings || [];
          S.costsLoaded = false; invalidateReportCaches(); await loadRealProjectCosts();
        } else if(key==='office'){
          await apiCall('POST', '/api/customer/office-expenses', {category:record.category, description:record.desc, expenseDate:record.date, amount:record.amount});
          S.officeExpensesLoaded = false; invalidateReportCaches(); await loadRealOfficeExpenses();
        } else {
          await apiCall('POST', '/api/customer/revenue', {
            projectId:record.projectId, type:record.type, description:record.desc, revenueDate:record.date,
            amount:record.amount, refDoc:record.refDoc, retentionPercent:record.retentionPercent||null,
            retentionReleaseDate:record.retentionReleaseDate||null,
          });
          S.revenueLoaded = false; invalidateReportCaches(); await loadRealRevenue();
        }
        toast(tr('ledger.saved_entry', {title: cfg.title}));
        S.modal=null;
        // Budget control warnings (rule #3, non-blocking — the row above was saved either way) show
        // as a dismissible banner on the costs list page itself, not inside the modal, since the
        // modal is about to close on every successful save.
        if(budgetWarnings.length) S.budgetWarningBanner = budgetWarnings.join(' · ');
        render();
      } catch(e){
        // A 409 here means the strict-control block (rule #3) rejected the save entirely — keep the
        // modal open with a clear inline error instead of just a toast, so the user can see exactly
        // which BOQ item they're over and adjust the amount/work code without re-opening the form.
        if(key==='costs' && e.status===409){ S.modal.blockError = e.message; render(); return; }
        toast(e.message, 'err');
      }
      return;
    }
    DB[cfg.collection].push(record);
    toast(tr('ledger.saved_entry', {title: cfg.title}));
    S.modal=null; render(); return;
  }
  if(act==='release-retention'){
    const id = parseInt(el.dataset.id);
    const r = DB.revenue.find(x=>x.id===id);
    if(!r) return;
    if(!confirm(tr('ledger.confirm_release_retention', {amount: fmtMoney(r.retentionAmount)}))) return;
    if(S.dataMode!=='demo'){
      try{
        await apiCall('POST', `/api/customer/revenue/${id}/release-retention`);
        S.revenueLoaded = false; invalidateReportCaches(); await loadRealRevenue();
        toast(tr('ledger.retention_released_toast'));
      } catch(e){ toast(e.message, 'err'); }
      return;
    }
    r.retentionStatus = 'released';
    r.retentionReleasedDate = new Date().toISOString().slice(0,10);
    toast(tr('ledger.retention_released_toast'));
    render(); return;
  }
  if(act==='open-receive-payment'){
    const id = parseInt(el.dataset.id,10);
    S.modal = {type:'receive-payment', revenueId:id, amount:'', whtAmount:'', paymentDate:new Date().toISOString().slice(0,10), note:''};
    render(); return;
  }
  if(act==='save-receive-payment'){
    const m = S.modal;
    const amount = parseFloat(m.amount)||0;
    const whtAmount = parseFloat(m.whtAmount)||0;
    if(amount<=0){ toast(tr('fin_receive_payment.amount_required_err'),'err'); return; }
    try{
      await apiCall('POST', `/api/customer/revenue/${m.revenueId}/payments`, {
        amount, whtAmount, paymentDate:m.paymentDate, note:m.note,
      });
      S.revenueLoaded = false; invalidateReportCaches(); await loadRealRevenue();
      toast(tr('fin_receive_payment.added_toast'));
      S.modal = null;
      render();
    } catch(e){ toast(e.message, 'err'); }
    return;
  }
  if(act==='open-revenue-documents'){
    const id = parseInt(el.dataset.id,10);
    S.modal = {type:'revenue-documents', revenueId:id, docs:[], docsLoading:true, docType:'billing', docNo:'', docDate:new Date().toISOString().slice(0,10), note:'', docSaving:false};
    render();
    try{
      const data = await apiCall('GET', `/api/customer/revenue/${id}/documents`);
      if(S.modal && S.modal.type==='revenue-documents' && S.modal.revenueId===id){
        S.modal.docs = data.documents; S.modal.docsLoading = false; render();
      }
    } catch(e){
      if(S.modal && S.modal.type==='revenue-documents'){ S.modal.docsLoading = false; render(); }
      toast(e.message, 'err');
    }
    return;
  }
  if(act==='save-revenue-document'){
    const m = S.modal;
    const fileInput = document.getElementById('rd-file');
    const file = fileInput && fileInput.files[0];
    S.modal.docSaving = true; render();
    try{
      const fd = new FormData();
      fd.append('docType', m.docType);
      fd.append('docNo', m.docNo||'');
      fd.append('docDate', m.docDate||'');
      fd.append('note', m.note||'');
      if(file) fd.append('file', file);
      const res = await fetch(`/api/customer/revenue/${m.revenueId}/documents`, { method:'POST', body: fd });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || tr('users.save_failed_err'));
      if(S.modal && S.modal.type==='revenue-documents' && S.modal.revenueId===m.revenueId){
        S.modal.docs.unshift(data.document);
        S.modal.docNo=''; S.modal.note=''; S.modal.docSaving=false;
      }
      toast(tr('ledger.revenue.document_added_toast'));
      render();
    } catch(e){
      if(S.modal) S.modal.docSaving = false;
      toast(e.message,'err'); render();
    }
    return;
  }
  if(act==='delete-revenue-document'){
    const id = parseInt(el.dataset.id,10);
    if(!confirm(tr('fin_documents.confirm_delete'))) return;
    try{
      await apiCall('DELETE', `/api/customer/revenue-documents/${id}`);
      if(S.modal && S.modal.type==='revenue-documents'){
        S.modal.docs = S.modal.docs.filter(d=>d.id!==id);
      }
      toast(tr('common.deleted_toast'));
      render();
    } catch(e){ toast(e.message, 'err'); }
    return;
  }
  if(act==='delete-ledger'){
    const key = el.dataset.key;
    const cfg = ledgerConfigs()[key];
    const id = parseInt(el.dataset.id);
    if((key==='costs' || key==='office' || key==='revenue') && S.dataMode!=='demo'){
      try{
        if(key==='costs'){ await apiCall('DELETE', `/api/customer/project-costs/${id}`); S.costsLoaded=false; invalidateReportCaches(); await loadRealProjectCosts(); }
        else if(key==='office'){ await apiCall('DELETE', `/api/customer/office-expenses/${id}`); S.officeExpensesLoaded=false; invalidateReportCaches(); await loadRealOfficeExpenses(); }
        else { await apiCall('DELETE', `/api/customer/revenue/${id}`); S.revenueLoaded=false; invalidateReportCaches(); await loadRealRevenue(); }
        toast(tr('common.deleted_toast'));
        render();
      } catch(e){ toast(e.message, 'err'); }
      return;
    }
    DB[cfg.collection] = DB[cfg.collection].filter(r=>r.id!==id);
    toast(tr('common.deleted_toast'));
    render(); return;
  }
  if(act==='dismiss-budget-warning'){ S.budgetWarningBanner = null; render(); return; }

  // ---- Finance: stock ----
  if(act==='open-add-stock'){ S.modal={type:'add-stock', stockType:'in', material:'', qty:'', unit:'', projectId:'', date:'', note:''}; render(); return; }
  if(act==='save-stock'){
    const type = document.getElementById('sm-type').value;
    const material = document.getElementById('sm-material').value.trim();
    const qty = parseFloat(document.getElementById('sm-qty').value)||0;
    const unit = document.getElementById('sm-unit').value.trim();
    const projectId = document.getElementById('sm-project').value ? parseInt(document.getElementById('sm-project').value) : null;
    const date = document.getElementById('sm-date').value || new Date().toISOString().slice(0,10);
    const note = document.getElementById('sm-note').value.trim();
    if(!material || qty<=0 || !unit){ toast(tr('fin_stock.fill_required_err'),'err'); return; }
    DB.stockMoves.push({id:uid(), material, unit, type, qty, unitPrice:0, date, projectId, note});
    toast(tr('fin_stock.saved_toast'));
    S.modal=null; render(); return;
  }
}

function nowStr(){
  const now = new Date();
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${String(now.getDate()).padStart(2,'0')} ${months[now.getMonth()]} ${now.getFullYear()+543} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}

// Classic (non-module) <script>, so no top-level await — wrap the locale fetch in an async IIFE
// and hold off the very first render() until it resolves, so nothing paints in the wrong
// language for a flash. Every later language switch re-renders via this same onChange listener.
I18N.onChange(render);
(async () => { await I18N.init(); render(); })();
// Keep the bell reasonably fresh while a tab is left open without needing sockets — only polls
// once logged in for real (session-backed), never in demo mode where there's no server to ask.
setInterval(()=>{ if(S.currentUser && S.dataMode!=='demo') loadNotifications(); }, 45000);
</script>
</body>
