<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Build-Con — ระบบสั่งวัสดุก่อสร้างเข้าหน้างาน</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-alt:#F7F8FA;
  --surface-sunken:#EFF1F4;
  --navy:#16233F;
  --navy-2:#223458;
  --steel:#4A6E93;
  --orange:#C25A28;
  --orange-dark:#A34A1F;
  --orange-tint:#FBEEE5;
  --green:#1E7A54;
  --green-bg:#E7F5EE;
  --red:#B23B2E;
  --red-bg:#FBEAE7;
  --amber:#A8730E;
  --amber-bg:#FBF1DC;
  --sky:#2E6FA3;
  --sky-bg:#E7F0FA;
  --slate:#4B5468;
  --slate-bg:#DEE1E7;
  --text:#161D2E;
  --text-muted:#68738C;
  --text-faint:#9AA3B5;
  --border:#E4E7ED;
  --border-strong:#D4D9E2;
  --radius:9px;
  --radius-sm:6px;
  --shadow-xs:0 1px 2px rgba(15,23,41,.05);
  --shadow-sm:0 1px 3px rgba(15,23,41,.06), 0 1px 2px rgba(15,23,41,.04);
  --shadow-md:0 4px 14px rgba(15,23,41,.08), 0 1px 3px rgba(15,23,41,.05);
  --shadow-lg:0 16px 40px rgba(15,23,41,.14), 0 4px 12px rgba(15,23,41,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100vh;}
h1,h2,h3,h4{font-family:'Manrope',sans-serif; letter-spacing:-.01em; margin:0; color:var(--navy); font-weight:800;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
svg{display:block;}
::selection{background:var(--orange-tint); color:var(--orange-dark);}

/* ---------- Utility ---------- */
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--text-muted);
  font-weight:600;
}
.btn{
  border:none; border-radius:var(--radius-sm);
  padding:10px 18px; font-size:13.5px; font-weight:600;
  display:inline-flex; align-items:center; gap:7px;
  transition:background .12s ease, border-color .12s ease, box-shadow .12s ease, transform .06s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy); color:#fff; box-shadow:var(--shadow-xs);}
.btn-primary:hover{background:var(--navy-2); box-shadow:var(--shadow-sm);}
.btn-primary:disabled{background:var(--border-strong); color:var(--text-faint); cursor:not-allowed; box-shadow:none;}
.btn-navy{background:var(--green); color:#fff; box-shadow:var(--shadow-xs);}
.btn-navy:hover{background:#175E41; box-shadow:var(--shadow-sm);}
.btn-ghost{background:var(--surface); color:var(--navy); border:1px solid var(--border-strong);}
.btn-ghost:hover{border-color:var(--steel); color:var(--steel); background:var(--surface-alt);}
.btn-sm{padding:7px 12px; font-size:12px;}
.btn-danger{background:transparent; color:var(--red); border:1px solid var(--red-bg);}
.btn-danger:hover{background:var(--red-bg);}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-xs);
}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--navy); margin-bottom:6px; letter-spacing:.01em;}
.field .hint{font-size:11.5px; color:var(--text-muted); margin-top:5px; line-height:1.5;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--border-strong);
  border-radius:var(--radius-sm); font-size:14px; background:#fff; color:var(--text);
  transition:border-color .12s ease, box-shadow .12s ease; font-family:inherit;
}
.field textarea{min-height:70px; resize:vertical;}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(22,35,63,.09);}
.field input:disabled{background:var(--surface-alt); color:var(--text-muted); cursor:not-allowed;}

.badge{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:600; padding:4px 10px 4px 8px; border-radius:20px;
  letter-spacing:.01em;
}
.badge::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0;}
.badge-approved{background:var(--green-bg); color:var(--green);}
.badge-pending{background:var(--amber-bg); color:var(--amber);}
.badge-rejected{background:var(--red-bg); color:var(--red);}
.badge-draft{background:var(--surface-sunken); color:var(--text-muted);}
/* Stopped/blocked states (cancelled, declined, over-limit, strict-control) — was referenced across
   7 call sites (tender/PO/quotation status, budget warnings) with no definition at all, so those
   badges rendered with no background/color. Distinct dark-neutral, separate from badge-draft's
   lighter "inert" gray, so "cancelled" reads as a stopped state rather than just unstarted. */
.badge-suspended{background:var(--slate-bg); color:var(--slate);}
/* Active/in-progress informational state (e.g. tender "เตรียมยื่นซอง") — reuses the --sky tokens
   already defined above but previously unused by any badge. */
.badge-info{background:var(--sky-bg); color:var(--sky);}

/* ---------- Auth shell ---------- */
.auth-shell{
  min-height:100vh; display:grid; grid-template-columns:minmax(0,460px) 1fr;
}
.auth-brand-side{
  background:var(--navy); position:relative; overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:44px 44px 40px; color:#fff;
}
.auth-brand-side::before{
  content:''; position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px);
  background-size:22px 22px; opacity:.5;
}
.auth-brand-side::after{
  content:''; position:absolute; right:-120px; bottom:-120px; width:340px; height:340px; border-radius:50%;
  background:radial-gradient(circle, rgba(194,90,40,.25), transparent 70%);
}
.abs-top, .abs-bottom{position:relative; z-index:1;}
.abs-tagline{font-family:'Manrope'; font-size:27px; font-weight:800; line-height:1.32; letter-spacing:-.01em; margin-top:40px; max-width:360px;}
.abs-desc{font-size:13.5px; color:rgba(255,255,255,.6); margin-top:14px; max-width:320px; line-height:1.7;}
.abs-stats{display:flex; gap:28px; margin-top:38px;}
.abs-stat b{display:block; font-family:'Manrope'; font-size:22px; font-weight:800;}
.abs-stat span{font-size:11px; color:rgba(255,255,255,.5); letter-spacing:.04em;}
.abs-foot{font-size:11.5px; color:rgba(255,255,255,.4); letter-spacing:.02em;}

.auth-form-side{position:relative; display:flex; align-items:center; justify-content:center; padding:40px 32px;}
.landing-quick-links{position:absolute; top:62px; right:24px; display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
.landing-quick-link{background:none; border:none; padding:4px 2px; font-size:13.5px; font-weight:600; color:var(--steel); cursor:pointer; transition:color .12s ease; text-align:right;}
.landing-quick-link:hover{color:var(--orange-dark);}
.auth-box{width:100%; max-width:420px;}
.auth-box.wide{max-width:680px;}
.job-search-list{display:flex; flex-direction:column; gap:8px; margin-top:6px; max-height:340px; overflow-y:auto;}
.job-search-result{display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff; cursor:pointer; text-align:left; width:100%; font:inherit; transition:border-color .12s ease, background .12s ease;}
.job-search-result:hover{border-color:var(--steel); background:var(--surface-alt);}
.job-search-result-logo{width:36px; height:36px; border-radius:6px; object-fit:cover; flex-shrink:0; background:var(--surface-alt);}
.job-search-result-logo-placeholder{display:flex; align-items:center; justify-content:center; color:var(--text-faint);}
.job-search-result-name{font-weight:600; font-size:14px; color:var(--navy);}
.brand{display:flex; align-items:center; gap:11px; margin-bottom:8px;}
a.brand{text-decoration:none; color:inherit; width:fit-content; cursor:pointer; transition:opacity .15s ease;}
a.brand:hover{opacity:.8;}
.brand-logo-img{height:40px; width:auto; display:block;}
.auth-form-side .brand-logo-img, .auth-brand-side .brand-logo-img{height:110px;}
.brand-sub{font-size:10.5px; color:var(--text-muted); letter-spacing:.09em; text-transform:uppercase; margin-top:-1px; font-weight:600;}
.auth-brand-side .brand-sub{color:rgba(255,255,255,.5);}

.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:32px 30px; box-shadow:var(--shadow-md); margin-top:26px;
}
.auth-back{
  margin-bottom:14px;
}
.step-track{display:flex; gap:5px; margin-bottom:22px;}
.step-dot{flex:1; height:4px; background:var(--border); border-radius:3px;}
.step-dot.done{background:var(--orange);}
.step-dot.active{background:var(--navy);}
.step-label{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--orange-dark); margin-bottom:8px; letter-spacing:.09em; text-transform:uppercase; font-weight:600;}

.otp-row{display:flex; gap:8px; margin:18px 0 6px;}
.otp-row input{
  width:44px; height:52px; text-align:center; font-size:19px; font-weight:700;
  border:1.5px solid var(--border-strong); border-radius:var(--radius-sm); font-family:'IBM Plex Mono';
}
.otp-row input:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(22,35,63,.1);}

.choice-card{
  border:1.5px solid var(--border-strong); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
  cursor:pointer; transition:border-color .1s, background .1s;
}
.choice-card:hover{border-color:var(--steel);}
.choice-card.selected{border-color:var(--navy); background:var(--surface-alt);}
.choice-card .ctitle{font-weight:700; font-size:13.5px; color:var(--navy); display:flex; align-items:center; gap:8px;}
.choice-card .cdesc{font-size:12px; color:var(--text-muted); margin-top:3px;}
.radio-dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--border-strong); flex-shrink:0; position:relative;}
.choice-card.selected .radio-dot{border-color:var(--navy);}
.choice-card.selected .radio-dot::after{content:''; position:absolute; inset:3px; background:var(--navy); border-radius:50%;}

.foot-row{display:flex; justify-content:space-between; align-items:center; margin-top:22px;}
.stamp-line{display:flex; align-items:center; gap:8px; color:var(--text-faint); font-size:11px; margin-top:18px; justify-content:center; letter-spacing:.03em;}
.stamp-line::before,.stamp-line::after{content:''; flex:1; height:1px; background:var(--border);}

/* demo accounts */
.demo-list{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;}
.demo-chip{
  border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 10px; text-align:left; background:var(--surface-alt);
  font-size:11.5px; color:var(--navy); transition:border-color .1s, background .1s;
}
.demo-chip b{display:block; font-size:12.5px; margin-bottom:1px; font-weight:700;}
.demo-chip-pos{display:block; font-size:10.5px; color:var(--text-muted); margin-top:2px;}
.demo-chip:hover{border-color:var(--steel); background:#fff;}
@media (max-width:860px){
  .auth-shell{grid-template-columns:1fr;}
  .auth-brand-side{display:none;}
}

/* ---------- App shell ---------- */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:256px; background:var(--navy); color:#fff; flex-shrink:0; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.sidebar .brand{justify-content:flex-start; padding:22px 22px 20px; margin:0;}
.sidebar .brand-sub{color:rgba(255,255,255,.42);}

.role-tag{margin:0 16px 14px; padding:12px 13px; background:rgba(255,255,255,.05); border-radius:var(--radius-sm); display:flex; align-items:center; gap:10px;}
.rt-avatar{
  width:32px; height:32px; border-radius:50%; background:var(--orange); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-family:'Manrope'; font-weight:800; font-size:12.5px; color:#fff;
}
.rt-name{font-size:12.5px; font-weight:700; line-height:1.3;}
.rt-group{font-size:10.5px; color:rgba(255,255,255,.48); letter-spacing:.03em; margin-top:1px;}

.module-switch{display:flex; gap:3px; margin:0 16px 14px; background:rgba(255,255,255,.05); border-radius:var(--radius-sm); padding:3px;}
.module-switch button{flex:1; padding:8px 4px; border:none; background:none; color:rgba(255,255,255,.55); font-size:11.5px; font-weight:600; border-radius:5px; transition:background .12s, color .12s;}
.module-switch button.active{background:rgba(255,255,255,.14); color:#fff;}
.module-switch button:not(.active):hover{color:#fff;}

.nav{flex:1; padding:4px 12px; overflow-y:auto;}
.nav-section-label{
  font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(255,255,255,.32); padding:18px 12px 7px; font-weight:600;
}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--radius-sm);
  color:rgba(255,255,255,.62); font-size:13.5px; font-weight:500; margin-bottom:1px; border:none; background:none; width:100%; text-align:left;
  position:relative; transition:background .12s, color .12s;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(255,255,255,.09); color:#fff; font-weight:600;}
.nav-item.active::before{content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--orange);}
.nav-icon{width:16px; height:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center; opacity:.9;}
.nav-item.active .nav-icon{opacity:1;}
.nav-foot{padding:14px 22px 18px; border-top:1px solid rgba(255,255,255,.08); margin-top:6px;}
.logout-btn{color:rgba(255,255,255,.5); font-size:12.5px; background:none; border:none; padding:0; display:flex; align-items:center; gap:7px;}
.logout-btn:hover{color:#fff;}

.main{flex:1; padding:32px 42px 60px; max-width:calc(100vw - 256px);}
.page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
.page-head h2{font-size:23px;}
.page-head .sub{color:var(--text-muted); font-size:13px; margin-top:5px;}

.grid-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:26px;}
.stat-card{padding:19px 20px; position:relative; overflow:hidden; display:flex; flex-direction:column; gap:12px;}
.stat-card .stico{width:32px; height:32px; border-radius:8px; background:var(--orange-tint); color:var(--orange-dark); display:flex; align-items:center; justify-content:center;}
.stat-card .num{font-family:'Manrope'; font-size:28px; font-weight:800; color:var(--navy); line-height:1;}
.stat-card .lbl{font-size:12.5px; color:var(--text-muted); margin-top:3px;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{
  text-align:left; padding:11px 16px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--text-muted); border-bottom:1px solid var(--border); font-weight:700; background:var(--surface-alt);
}
th:first-child{border-top-left-radius:var(--radius);}
th:last-child{border-top-right-radius:var(--radius);}
td{padding:13px 16px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-alt);}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
.table-wrap table{border:none;}
/* #schedule-chart-overlay (the S-curve overlay SVG, 2026-07-27 rewrite — see updateScheduleChartOverlay()
   in pr-system.html) is position:absolute against THIS element (#schedule-scroll-main), not the page —
   position:relative here makes it the offsetParent/containing block, so the SVG's own left/top/width/
   height (all computed in real px against the task rows it sits over) scroll together with the table's
   horizontal overflow-x:auto content instead of staying pinned to the viewport. */
#schedule-scroll-main{position:relative;}
/* แผนงาน's synced top+bottom scrollbars for #schedule-scroll-main's wide time grid — custom-drawn
   (not the browser's native scrollbar) specifically so a visible thumb is guaranteed on every
   platform/browser, including ones that use fade-out "overlay" scrollbars that only appear during an
   active scroll gesture (which would otherwise leave the top bar looking like an empty, purposeless
   track). See wireScheduleScrollSync() in pr-system.html for the drag/sync logic. */
.schedule-scrollbar-track{position:relative; height:14px; background:var(--surface-alt); border:1px solid var(--border); border-radius:4px; cursor:pointer;}
.schedule-scrollbar-thumb{position:absolute; top:1px; left:0; height:10px; min-width:20px; background:var(--border-strong); border-radius:3px; cursor:grab;}
.schedule-scrollbar-thumb:hover{background:var(--text-muted);}
.schedule-scrollbar-thumb:active{cursor:grabbing; background:var(--text-muted);}
/* Borderless-until-interacted table inputs — ระยะเวลา(วัน)/วันเริ่ม in renderProjectScheduleTable()'s
   Task table should read as plain text at rest (no input-box chrome), per the reference image, but
   still need to look/behave editable on hover/focus. A transparent border (not border:none) at rest
   keeps the box-sizing:border-box element's outer size identical when the border becomes visible on
   hover/focus, so there's no 1px layout shift. */
.sched-plain-input{border:1px solid transparent; background:transparent; border-radius:4px;}
.sched-plain-input:hover{border-color:var(--border);}
.sched-plain-input:focus{outline:none; border-color:var(--navy); background:var(--surface);}
/* Right-align numeric/money columns (convention: numbers align on their least-significant digit so
   magnitudes are easy to compare down a column). Named .num-cell rather than .num to avoid colliding
   with the pre-existing .stat-card .num (a big KPI figure, unrelated purpose). */
th.num-cell,td.num-cell{text-align:right;}

/* ---------- Table loading skeleton ---------- */
/* Shown in place of a table's <tbody> while its first fetch is in flight, so a page never flashes
   its empty-state before real data arrives (see fin_tenders' initial DB.tenders===[] flash). Width
   %s are just varied per column so rows don't look like a repeated identical bar. */
@keyframes skel-pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
.skel-row td{padding:13px 16px; border-bottom:1px solid var(--border);}
.skel-row:last-child td{border-bottom:none;}
.skel-bar{height:13px; border-radius:4px; background:var(--surface-sunken); animation:skel-pulse 1.3s ease-in-out infinite;}

/* ---------- Empty state with call-to-action ---------- */
.empty-cta{padding:52px 24px; text-align:center;}
.empty-cta .em-icon{margin-bottom:14px; opacity:.35; display:flex; justify-content:center;}
.empty-cta .em-title{font-family:'Manrope'; font-weight:800; font-size:15.5px; color:var(--navy); margin-bottom:6px;}
.empty-cta .em-desc{font-size:12.5px; color:var(--text-muted); max-width:340px; margin:0 auto 20px; line-height:1.6;}

/* ---------- Inline callouts (error/warning banners) ---------- */
/* Replaces the same "background:var(--red-bg); color:var(--red); padding:10px 12px; border-radius:8px"
   (or amber equivalent) inline style string that used to be copy-pasted independently at every one of:
   the BOQ import modal's per-step error box, the installment-amount mismatch hint, the BOQ summary-row
   mismatch warnings, and the budget rejected-reason banner — one class family instead of N duplicates. */
.callout{padding:10px 12px; border-radius:8px; font-size:12.5px; line-height:1.6;}
.callout-warn{background:var(--amber-bg); color:var(--amber);}
.callout-error{background:var(--red-bg); color:var(--red); white-space:pre-line;}

/* ---------- BOQ item row states ---------- */
/* Shared by the BOQ items table (readonly + import-preview) and the draft-items editable table —
   both build rows for the same 3 mutually-exclusive kinds: normal / group-header / summary-row. */
.boq-row-group{background:var(--surface-alt);}
.boq-row-summary{background:var(--surface-alt); opacity:.75;}
/* A qty/unit-price cell the server had to default to 0 (blank/unparseable in the source file) — the
   highlight+tooltip is what keeps "0" from silently reading as "the file really said zero" when it
   actually just meant "this field was empty". Scoped to qty/materialUnitPrice/laborUnitPrice only. */
.cell-defaulted{background:var(--amber-bg,#fff7e6);}

/* fin_budget_detail's "รายการ BOQ" table only (scoped via this wrapper class, not the base table/th/td
   rules above, so the BOQ import-preview modal — which reuses the same renderBoqItemsTable markup —
   is unaffected). Two previous passes here (16px, then an explicitly-requested 8px) both drifted away
   from the app's own established table convention — the reference point per the fin_tenders (Tender
   List) page, which uses nothing but the plain base table/th/td rules: table text at 13.5px, header
   labels at 10.5px uppercase. Rather than re-guess another number, th/td are left to inherit those
   base rules untouched (removing the earlier size/padding overrides entirely), so this table now
   matches every other data table in the app exactly. The one real, original defect this table had —
   its draft-editable <input>/<select> elements carrying NO explicit font-size at all, so they fell
   back to the browser's native form-control default instead of matching the 13.5px text around them —
   is the only thing still overridden below. */
.boq-items-table input,.boq-items-table select{font-size:13.5px; font-family:inherit;}

.afc-grid{display:flex; flex-direction:column; gap:12px;}
.afc-card{border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px 2px; background:var(--surface-alt); transition:border-color .12s ease; margin-bottom:14px;}
.afc-card:focus-within{border-color:var(--steel);}
.afc-card:last-child{margin-bottom:0;}
.afc-card .field:last-child{margin-bottom:16px;}
.afc-card-label{font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:14px; display:flex; align-items:center; gap:8px; letter-spacing:.01em;}
.afc-card-label::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--steel); flex-shrink:0;}
.edu-card-grid{display:grid; grid-template-columns:2fr 2fr 1fr 1fr; gap:14px;}
.edu-card-grid .field{margin-bottom:16px;}
@media (max-width:760px){ .edu-card-grid{grid-template-columns:1fr 1fr;} }
.lang-card-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.lang-card-grid .field{margin-bottom:16px;}
@media (max-width:520px){ .lang-card-grid{grid-template-columns:1fr;} }

.empty{padding:56px 20px; text-align:center; color:var(--text-muted);}
.empty .em-icon{margin-bottom:12px; opacity:.4; display:flex; justify-content:center;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(15,23,41,.55); display:flex; align-items:center; justify-content:center;
  z-index:50; padding:20px; backdrop-filter:blur(2px);
}
.modal{background:#fff; border-radius:var(--radius); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; padding:28px 30px; box-shadow:var(--shadow-lg);}
.modal.pr-doc-modal{max-width:1020px;}
.modal h3{margin-bottom:20px; font-size:18px;}

.pr-item-row{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr) minmax(0,0.8fr) minmax(0,0.7fr) minmax(0,0.8fr) minmax(0,0.9fr) 26px; gap:8px; margin-bottom:8px; align-items:start;}
.pr-item-row input{width:100%; min-width:0; box-sizing:border-box; padding:9px 10px; font-size:13px;}
.remove-item{background:none; border:none; color:var(--red); font-size:15px; padding:9px 0; opacity:.6;}
.remove-item:hover{opacity:1;}
@media (max-width:900px){
  .pr-item-row{grid-template-columns:1fr; gap:6px;}
}

.pr-doc-wrap{max-width:980px;}
.pr-doc{
  background:#fff; border:1.5px solid #222; color:#111; font-family:Arial, sans-serif; font-size:12px;
  box-shadow:var(--shadow-xs);
}
.pr-doc-table{width:100%; border-collapse:collapse; table-layout:fixed; font-size:12px;}
.pr-doc-table th,.pr-doc-table td{
  border:1px solid #222; padding:0; color:#111; background:#fff; vertical-align:top; height:24px;
  text-transform:none; letter-spacing:0; font-weight:700;
}
.pr-doc-table th{font-size:11px; text-align:center;}
.pr-doc-head{display:grid; grid-template-columns:90px 1fr 90px; min-height:92px; border-bottom:1px solid #222;}
.pr-doc-logo{margin:10px 0 8px 8px; width:74px; height:70px; border:1px solid #88A4D6; padding:8px; font-weight:700; color:#111;}
.pr-doc-title{text-align:center; padding-top:10px; font-weight:700;}
.pr-doc-title h3{font-size:16px; margin:0 0 18px;}
.pr-doc-title div{font-size:12px;}
.pr-doc-section{background:#BDD7EE !important; text-align:center;}
.pr-doc-approve{background:#C6E0B4 !important; text-align:center;}
.pr-doc-muted{font-size:10px;}
.pr-doc-line{min-height:23px; display:flex; align-items:center; padding:3px 5px; font-weight:600;}
.pr-doc-items td{height:27px; font-weight:400;}
.pr-doc-note textarea{min-height:54px;}
.pr-doc-sign td{height:80px; font-weight:400;}
.pr-doc-sign-line{height:22px; border-top:1px solid #222; display:flex; align-items:center; padding:0 5px; font-weight:700;}
.pr-doc-page{height:64px; display:flex; justify-content:flex-end; align-items:flex-end; padding:0 5px 6px; font-size:10px; font-weight:700;}

.chain{display:flex; align-items:flex-start; gap:0; margin:18px 0 22px; flex-wrap:wrap;}
.chain-node{
  display:flex; flex-direction:column; align-items:center; gap:7px; min-width:88px; position:relative;
}
.chain-circle{
  width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono'; font-size:11px; font-weight:700; border:2px solid var(--border-strong); background:#fff; color:var(--text-faint);
}
.chain-node.done .chain-circle{border-color:var(--green); color:var(--green); background:var(--green-bg);}
.chain-node.current .chain-circle{border-color:var(--orange); color:var(--orange-dark); background:var(--orange-tint);}
.chain-node.rejected .chain-circle{border-color:var(--red); color:var(--red); background:var(--red-bg);}
.chain-lbl{font-size:11px; color:var(--text-muted); text-align:center; max-width:92px; font-weight:500;}
.chain-line{flex:1; height:2px; background:var(--border-strong); min-width:20px; margin-top:18px;}
.chain-line.done{background:var(--green);}

.stamp{
  display:inline-block; border:2px solid; border-radius:var(--radius-sm); padding:3px 10px; font-family:'IBM Plex Mono';
  font-weight:700; font-size:12px; letter-spacing:.05em; transform:rotate(-3deg);
}
.stamp-approved{color:var(--green); border-color:var(--green);}
.stamp-rejected{color:var(--red); border-color:var(--red);}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px;}
.tab{padding:10px 4px; margin-right:22px; font-size:13.5px; font-weight:600; color:var(--text-muted); border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none;}
.tab.active{color:var(--navy); border-color:var(--orange);}

.perm-note{
  display:flex; gap:11px; align-items:flex-start; padding:13px 15px; background:var(--surface-alt); border:1px solid var(--border);
  border-radius:var(--radius); font-size:12.5px; color:var(--text-muted); margin-bottom:22px; line-height:1.6;
}
.perm-note svg{flex-shrink:0; margin-top:1px; color:var(--steel);}
.toast{
  position:fixed; bottom:26px; right:26px; background:var(--navy); color:#fff; padding:13px 18px;
  border-radius:var(--radius-sm); font-size:13px; z-index:100; box-shadow:var(--shadow-lg);
  display:flex; align-items:center; gap:10px; font-weight:500;
}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}
.toast.warn{background:var(--amber);}

.split{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:900px){
  .sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .main{max-width:100vw; padding:22px;}
  .split{grid-template-columns:1fr;}
}
.small-btn-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
.section-title{font-size:14.5px; font-weight:700; color:var(--navy); margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border); font-family:'Manrope';}

.path-box{background:var(--surface-alt); border-radius:var(--radius); padding:16px; width:100%; margin-bottom:14px;}
.path-box-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.path-box-title{font-weight:600; color:var(--text-muted); font-size:13px;}
.path-levels{display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:10px;}
.path-level-item{display:flex; align-items:center; gap:8px; min-width:0;}
.path-level-item select{min-width:0; flex:1;}
.path-plus{font-weight:700; color:var(--orange); font-size:15px;}
.path-add-level-btn{justify-self:start; width:auto;}
.path-or-divider{text-align:center; font-weight:700; color:var(--orange); margin:6px 0 14px; font-size:13px; letter-spacing:.03em;}
.path-result{background:var(--surface-alt); border-radius:var(--radius); padding:12px 16px; text-align:center; font-size:13.5px; color:var(--text-muted); margin-top:16px;}
.path-result b{color:var(--navy);}

/* ---------- Print ---------- */
.btn-print{background:var(--surface); color:var(--navy); border:1px solid var(--border-strong);}
.btn-print:hover{border-color:var(--steel); color:var(--steel); background:var(--surface-alt);}
.print-only{display:none;}
@media print{
  body{background:#fff !important;}
  /* body/#app's min-height:100vh (screen-layout affordance, e.g. sticky footers) is meaningless in
     print and actively harmful there — `vh` in print media resolves inconsistently (often against the
     LAST screen viewport height rather than the physical page), which can force a tall "phantom" box
     well past one printed page's worth of content, causing a near-blank extra page even when the actual
     visible content already fits on page 1. Confirmed as a real contributor to the แผนงาน print's
     spurious page 2 via an actual generated PDF (both body AND #app needed overriding — body's own
     min-height:100vh alone was still enough to keep .main's rendered height pinned to the on-screen
     viewport height even after #app's min-height was removed). Not guessed. */
  /* .shell (the sidebar+main flex ROW container) is the actual source of the forced full-viewport
     height — `.main{flex:1}` stretches to fill `.shell`'s cross-axis size (default align-items:stretch),
     and `.shell{min-height:100vh}` was still pinning that to the on-screen viewport height even after
     body/#app were overridden above; confirmed via .main/.shell's own getBoundingClientRect() staying at
     exactly the test viewport height until THIS rule was added. */
  html, body, #app, .shell{min-height:0 !important;}
  .sidebar, .nav-foot, .module-switch, .toast, .btn, .tabs, .step-track, .demo-list, .stamp-line, .perm-note, .remove-item, .page-head select, .no-print{display:none !important;}
  .print-only{display:block !important;}
  .main{max-width:100% !important; padding:0 !important; margin:0 !important;}
  .modal-overlay{position:static !important; background:none !important; padding:0 !important; display:block !important; backdrop-filter:none !important;}
  .modal{box-shadow:none !important; max-height:none !important; max-width:100% !important; padding:0 !important; overflow:visible !important; border-radius:0 !important;}
  .card{box-shadow:none !important; border:1px solid #ccc !important; break-inside:avoid;}
  .page-head{margin-bottom:16px !important;}
  table{font-size:12px !important;}
  a[href]::after{content:'';}
  .app-print-page{page-break-after:always; margin-bottom:0 !important;}
  .app-print-page:last-child{page-break-after:auto;}
  /* แผนงาน print — the custom-drawn scroll thumbs are a screen-only affordance, and the on-screen
     overflow-x:auto on #schedule-scroll-main must not clip the table to whatever pixel width the
     viewport happened to be — the print-fit engine (scheduleApplyPrintLayout()) needs the table's full
     natural extent to measure/zoom correctly, and #schedule-print-frame's own inline width+padding
     (applied only between beforeprint/afterprint) is what actually constrains the printed page. */
  #schedule-scroll-top-track, #schedule-scroll-bottom-track{display:none !important;}
  #schedule-scroll-main{overflow:visible !important;}
  /* Left label columns (No./รายละเอียดงาน/ระยะเวลา/วันเริ่ม-เสร็จ/งบประมาณ) carry NO explicit width on
     their own <td>/<th> (only the day-grid's per-cell <input>s do, via ctx.colWidth) — table-layout:auto
     therefore computes their preferred width from content alone, and for a long project with hundreds of
     time-grid columns, that preferred width can collapse to just a few px (2026-07-27 report: real
     project's own "รายละเอียดงาน" column measured ~45px at print-time, illegibly cramped, while the grid
     side ate the rest of the page as wasted per-cell padding). These min-widths force table-layout:auto
     to award each column at least enough room to be legible — this MAY make the table's total natural
     width larger (more overflow before zoom), which is fine: scheduleApplyPrintLayout()'s zoom always
     scales the WHOLE resulting layout uniformly to fit the page regardless of its natural total size, so
     fixing the internal proportion here doesn't fight the fit-to-page math, it just changes what
     proportion of the (still correctly zoom-fitted) page each side gets. Values tuned against this page's
     own real 77-task project, not guessed. */
  .sched-col-no{min-width:32px;}
  .sched-col-name{min-width:170px;}
  .sched-col-duration{min-width:50px;}
  .sched-col-date{min-width:78px;}
  .sched-col-budget{min-width:70px;}
  .sched-col-budget-pct{min-width:45px;}
  .sched-col-rowlabel{min-width:60px;}
  /* All table lines (cell borders/dividers, the dashed task-separator, the outer table-wrap border)
     print in solid black — requested because this table's normal --border/--border-strong colors (a
     light gray, tuned for on-screen contrast against tinted row backgrounds) print too faintly to read
     clearly. Every such line in this table is drawn via `border-left/border-bottom:... var(--border...)`
     inline styles baked into the HTML at render time — rather than editing every one of those individually,
     redefining the CSS CUSTOM PROPERTY itself on this one ancestor cascades to every var(--border)/
     var(--border-strong) reference inside it, screen-only rules and other pages/tables untouched. The
     S-curve overlay's own line colors (var(--orange)/var(--sky)) are separate variables, not affected.  */
  #schedule-print-frame{ --border:#000; --border-strong:#000; }
  /* 2026-07-28 follow-up: drop the "รายการ Task" heading/zoom-buttons row and the แผนงาน/ผลงาน swatch +
     cumulative-line legend from print — both already hidden via `.no-print` on their own wrapping divs
     (renderProjectScheduleTable()) — plus the surrounding card's own decorative border (the generic
     `.card{border:1px solid #ccc}` print rule a few lines up applies to every printed card app-wide, this
     override scopes removal to ONLY this section, print-only, everything else that uses `.card` in print
     elsewhere is untouched). The task data grid + S-curve overlay themselves are NOT touched by any of
     this — only the header chrome around them.  */
  #task-table-section{border:none !important;}
}
</style>

function conditionLevelLabel(v){
  const idx = v.indexOf(':');
  const type = v.slice(0,idx), val = v.slice(idx+1);
  return type==='role' ? ((ROLES[val]&&ROLES[val].label)||val) : val;
}

async function loadCustomerUsers(){
  try {
    const res = await fetch('/api/customer/users');
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'โหลดข้อมูลผู้ใช้งานไม่สำเร็จ');
    S.customerUsers = data.users;
    S.customerUsersMax = data.maxUsers;
    S.customerUsersLoaded = true;
  } catch(e){
    toast(e.message || 'โหลดข้อมูลผู้ใช้งานไม่สำเร็จ', 'err');
  }
  render();
}

// ---- Employees module (job positions / employees / job applications) — real (non-demo) mode only.
// Demo mode keeps using DB.jobPositions/DB.employees/DB.jobApplications as pure client-side seed
// data (no server session exists in demo mode at all); real mode populates those SAME arrays from
// the server instead, so the existing render functions below work unchanged either way.
// signal (optional 5th positional arg via callers passing 4 — see loadRealTenders) lets a caller
// tie the request to an AbortController so a stalled fetch can be given up on client-side instead
// of leaving the caller (and any skeleton/loading UI built on it) waiting forever — see the "Tender
// List never loads" investigation. Every existing call site omits it and is unaffected.
async function apiCall(method, path, body, signal){
  let res;
  try{
    res = await fetch(path, {
      method,
      headers: {'Content-Type':'application/json'},
      body: body!==undefined ? JSON.stringify(body) : undefined,
      signal,
    });
  } catch(e){
    if(e.name==='AbortError') throw new Error(tr('common.request_timeout_err'));
    throw new Error('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
  }
  // 413 (body-parser's payload-too-large) responds with an HTML error page, not JSON — call this
  // out specifically instead of falling through to the generic "เกิดข้อผิดพลาด" from res.json()
  // failing to parse it, since it's usually a large attached photo and the fix is obvious.
  if(res.status===413) throw new Error('ข้อมูลที่ส่งมีขนาดใหญ่เกินไป (มักเกิดจากไฟล์รูปภาพ) กรุณาลองใหม่อีกครั้ง');
  const data = await res.json().catch(()=>({}));
  // .status lets callers distinguish e.g. a 409 (budget strict-control block) from other failures —
  // every existing catch(e){ toast(e.message,'err') } site is unaffected since it never reads this.
  if(!res.ok){ const err = new Error(data.error || 'เกิดข้อผิดพลาด'); err.status = res.status; throw err; }
  return data;
}
// apiCall's multipart-upload sibling — every existing file-upload site (logo, foreign-worker docs,
// client documents, revenue documents) duplicates this same raw fetch+check boilerplate; new upload
// call sites (BOQ import) use this shared version instead rather than adding a fifth copy.
async function uploadFile(url, formData){
  let res;

// 18s timeout via AbortController — pageFinTenders() shows a loading skeleton while
// !S.tendersLoaded, which would otherwise spin forever if this fetch genuinely stalls (the
// original trigger for adding this: a "Tender List takes 3-5 minutes or never loads" report — see
// the request-timing log in server.js added alongside this for diagnosing it if it recurs).
const TENDERS_LOAD_TIMEOUT_MS = 18000;
async function loadRealTenders(){
  S.tendersLoadError = false;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TENDERS_LOAD_TIMEOUT_MS);
  try{
    const data = await apiCall('GET', '/api/customer/tenders', undefined, controller.signal);
    DB.tenders = data.tenders.map(mapRealTender);
    // Only mark as loaded on success — a failed attempt (e.g. a session invalidated by a server
    // restart, see the "Tender list shows empty after re-login" investigation, 2026-07-24) must not
    // permanently block every later retry for this tab, since logout doesn't reset this flag either.
    S.tendersLoaded = true;
  } catch(e){ toast(e.message, 'err'); S.tendersLoadError = true; }
  finally{ clearTimeout(timer); }
  render();
}

// Client-side estimate only (excludes Sundays, not public holidays — the holiday list may not be
// loaded when this modal is open) used purely to decide whether to show the over-limit warning
// before submitting. The server recalculates the authoritative days_count at save time regardless.
function estimateLeaveDays(startDate, endDate){
  if(!startDate || !endDate) return 0;
  const start = new Date(startDate+'T00:00:00Z'), end = new Date(endDate+'T00:00:00Z');
  if(end < start) return 0;
  let count = 0;
  const cur = new Date(start);
  while(cur <= end){ if(cur.getUTCDay()!==0) count++; cur.setUTCDate(cur.getUTCDate()+1); }
  return count;
}

// (e.g. opening an application to edit) resolve immediately instead of showing disabled
// dropdowns until the user re-types something.
async function ensureGeoForAddress(d){
  await loadGeoProvinces();
  const prov = (S.geoProvinces||[]).find(p=>p.name_th===d.addrProvince);
  if(!prov) return;
  await loadGeoDistricts(prov.id);
  const dist = (GEO_CACHE.districts[prov.id]||[]).find(x=>x.name_th===d.addrAmphoe);
  if(!dist) return;
  await loadGeoSubdistricts(dist.id);
}

// Shared placeholder <tbody> rows for a table whose first fetch hasn't resolved yet (paired with the
// .skel-row/.skel-bar CSS above) — rowCount rows of colCount bars, widths varied per column index so
// the block doesn't look like one bar repeated. Callers wrap the result in <tbody>...</tbody> themselves.
function skeletonTableRows(rowCount, colCount){
  const widths = ['85%','60%','70%','45%','55%','40%','65%','50%'];
  let out = '';
  for(let r=0;r<rowCount;r++){
    out += '<tr class="skel-row">' + Array.from({length:colCount}, (_,c)=>
      `<td><div class="skel-bar" style="width:${widths[(r+c)%widths.length]};"></div></td>`
    ).join('') + '</tr>';
  }
  return out;
}

// เหมาจ่าย (lump-sum) ignores days worked — it's a flat amount per entry.
function computeLaborAmount(employee, days){
  if(!employee) return 0;
  const d = Number(days) || 0;
  if(employee.employmentType === 'daily') return employee.wageRate * d;
  if(employee.employmentType === 'monthly') return Math.round(employee.wageRate / 30 * d);
  return employee.wageRate;
}
function projectLaborCostTotal(pid){ return sumBy(DB.laborCosts.filter(l=>l.projectId===pid), l=>l.amount); }
// Inline onchange/oninput handlers for pageFinLabor()'s row table — these mutate S.laborBatch
// directly (bypassing the generic data-act dispatcher) so typing in one row's number/date inputs
// doesn't trigger a full re-render and lose focus/cursor position in that field.
function laborRowSetEmployee(i, val){
  const row = S.laborBatch.rows[i];
  row.employeeId = val;
  const emp = DB.employees.find(x=>x.id===Number(val));
  if(emp){ row.amount = computeLaborAmount(emp, row.days); row.amountEdited = false; }
  render();
}
function laborRowSetDays(i, val){
  const row = S.laborBatch.rows[i];
  row.days = val;
  const emp = DB.employees.find(x=>x.id===Number(row.employeeId));
  if(emp && !row.amountEdited){
    row.amount = computeLaborAmount(emp, val);
    const amtInput = document.getElementById('lb-amount-'+i);
    if(amtInput) amtInput.value = row.amount;
  }
}
// Autofills the revenue ledger-add modal's retentionPercent field from the selected project's
// default_retention_percent. Updates the input's value directly (not via render()) so the rest of

function onLedgerRevenueProjectChange(projectId){
  const project = DB.projects.find(p=>String(p.id)===String(projectId));
  const input = document.getElementById('lf-retentionPercent');
  if(input && project && project.defaultRetentionPercent!=null){
    input.value = project.defaultRetentionPercent;

// Splits a project's total cost into "ค่าแรง" (labor — both the new per-employee laborCosts
// records AND any ad-hoc category:'labor' entries someone logged the old way via the generic
// costs ledger) vs everything else, so the two can be shown side by side.
function projectCostBreakdown(pid){
  const costsForProject = DB.costs.filter(c=>c.projectId===pid);
  const adHocLabor = sumBy(costsForProject.filter(c=>c.category==='labor'), c=>c.amount);
  const materialAndOther = sumBy(costsForProject.filter(c=>c.category!=='labor'), c=>c.amount);
  const trackedLabor = projectLaborCostTotal(pid);
  const labor = adHocLabor + trackedLabor;
  return { materialAndOther, labor, total: materialAndOther + labor };
}

function projectName(id){ const p = DB.projects.find(x=>x.id===id); return p ? p.name : '—'; }
function sumBy(arr, fn){ return arr.reduce((s,x)=>s+(fn(x)||0),0); }
function projectRevenueTotal(pid){ return sumBy(DB.revenue.filter(r=>r.projectId===pid), r=>r.amount); }
function projectCostTotal(pid){ return sumBy(DB.costs.filter(c=>c.projectId===pid), c=>c.amount) + projectLaborCostTotal(pid); }
// The payable ceiling for "รับชำระเงิน" is (amount - retentionAmount) — retention is a SEPARATE
// receivable (1250) with its own release flow, never collected through here.
function revenueOutstanding(r){ return Math.max(0, Math.round(((r.amount||0) - (r.retentionAmount||0) - (r.paidAmount||0)) * 100) / 100); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
const RETENTION_DUE_SOON_DAYS = 30;
function stockBalance(){
  const map = {};
  DB.stockMoves.forEach(m=>{
    if(!map[m.material]) map[m.material] = {material:m.material, unit:m.unit, in:0, out:0, value:0, lastPrice:0};
    if(m.type==='in'){ map[m.material].in += m.qty; if(m.unitPrice) map[m.material].lastPrice = m.unitPrice; }
    else { map[m.material].out += m.qty; }
  });
  return Object.values(map).map(x=>({...x, balance:x.in-x.out}));
}

// ---- Year-end closing helpers ----
function yearOf(dateStr){ return dateStr ? dateStr.slice(0,4) : ''; }
function availableYears(){
  const years = new Set();
  [...DB.revenue, ...DB.costs, ...DB.officeExpenses, ...DB.cashBank].forEach(r=>{ if(r.date) years.add(yearOf(r.date)); });
  DB.closedYears.forEach(c=>years.add(c.year));
  if(years.size===0) years.add(String(new Date().getFullYear()));
  return Array.from(years).sort();
}
function yearRevenue(year){ return sumBy(DB.revenue.filter(r=>yearOf(r.date)===year), r=>r.amount); }
function yearCost(year){ return sumBy(DB.costs.filter(c=>yearOf(c.date)===year), c=>c.amount) + sumBy(DB.laborCosts.filter(l=>yearOf(l.workDate)===year), l=>l.amount); }
function yearOffice(year){ return sumBy(DB.officeExpenses.filter(e=>yearOf(e.date)===year), e=>e.amount); }
function cashBankBalance(){ return sumBy(DB.cashBank.filter(c=>c.type==='in'), c=>c.amount) - sumBy(DB.cashBank.filter(c=>c.type==='out'), c=>c.amount); }
function receivablesOutstanding(){ return sumBy(DB.receivables, r=>r.amount-(r.paidAmount||0)); }
function payablesOutstanding(){ return sumBy(DB.payables, p=>p.amount-(p.paidAmount||0)); }
function inventoryValue(){ return sumBy(stockBalance(), b=>b.balance*b.lastPrice); }
function retainedEarningsBefore(year){ return sumBy(DB.closedYears.filter(c=>c.year<year), c=>c.snapshot.netProfit); }

function syncSetupFieldsFromDom(){
  // Any re-render while the setup form is open (a toast's cleanup, etc.) would otherwise wipe
  // out whatever the user has already typed, since the form is rebuilt from S.setupData.
  // Snapshot the live inputs first so in-progress typing survives.
  const nameEl = document.getElementById('f-companyName');
  if(!nameEl) return;
  S.setupData.companyName = nameEl.value;
  S.setupData.taxId = document.getElementById('f-taxId').value;
  S.setupData.companyPhone = document.getElementById('f-companyPhone').value;
  S.setupData.companyEmail = document.getElementById('f-companyEmail').value;
  S.setupData.website = document.getElementById('f-website').value;
  S.setupData.address = document.getElementById('f-address').value;
  S.setupData.contactName = document.getElementById('f-contactName').value;
  S.setupData.contactPosition = document.getElementById('f-contactPosition').value;
  S.setupData.contactEmail = document.getElementById('f-contactEmail').value;
  S.setupData.contactPhone = document.getElementById('f-contactPhone').value;
  S.setupData.username = document.getElementById('f-username').value;
}

// Tracks which appForm step's fields are ACTUALLY on screen right now, separately from
// S.appForm.step (which callers like appform-goto-step mutate to the NEW step BEFORE calling
// render()). render()'s safety-net read below must only fire when the DOM still matches
// S.appForm.step — otherwise, on a step-change render, it would call readAppFormStep(newStep, ...)
// against the OLD step's still-on-screen fields, reading back a bunch of empty strings for ids
// that don't exist in that DOM and stomping the values the step-change handler already captured.
let lastRenderedAppFormStep = -1;
function render(){
  if(S.view==='setup') syncSetupFieldsFromDom();
  // Same reasoning as syncSetupFieldsFromDom above: most of the ใบสมัครงาน wizard's ~80 fields
  // (steps 1-9) are only ever read into S.appForm.draft by explicit calls to readAppFormStep() at
  // step-navigation/save/photo-upload points — a background render() from anywhere else (the 45s
  // notification poll being the most common real trigger) would otherwise silently wipe whatever
  // the applicant/HR user is mid-typing on the CURRENT step, since it was never synced yet. Guarded
  // by lastRenderedAppFormStep (see above) so this only runs for a genuine background render, never
  // a step-change render (those are already handled correctly by their own caller).
  if(S.appForm && S.appForm.step===lastRenderedAppFormStep && (S.view==='job-apply' || (S.view==='dashboard' && S.page==='emp_app_form'))) readAppFormStep(S.appForm.step, S.appForm.draft);
  const app = document.getElementById('app');
  // `.modal` (see the fixed-position, internally-scrolling modal CSS) gets destroyed and recreated
  // from scratch on every single render() — including one triggered by something as small as a
  // checkbox toggle inside a long preview table — and a brand-new DOM node always starts at
  // scrollTop 0, which reads as "the whole screen jumped to the top" since the modal fills most of
  // the viewport. Saving/restoring its scrollTop across the re-render is the fix (a full incremental-
  // patch rewrite of every modal's contents isn't worth it just for this). Scoped to `.modal`
  // specifically — normal page navigation (a different view/page entirely) should still land at the
  // top, so this deliberately does NOT touch window.scrollY.
  const prevModalEl = app.querySelector('.modal');
  const savedModalScrollTop = prevModalEl ? prevModalEl.scrollTop : null;
  if(S.view==='landing') app.innerHTML = renderLanding();
  else if(S.view==='setup') app.innerHTML = renderSetup();
  else if(S.view==='trial-thanks') app.innerHTML = renderTrialThanks();
  else if(S.view==='login') app.innerHTML = renderLogin();
  else if(S.view==='dashboard') app.innerHTML = renderDashboard();
  else if(S.view==='job-search') app.innerHTML = renderJobSearch();
  else if(S.view==='job-apply') app.innerHTML = renderJobApply();
  else if(S.view==='job-apply-thanks') app.innerHTML = renderJobApplyThanks();
  else if(S.view==='leave-search') app.innerHTML = renderLeaveSearch();
  else if(S.view==='leave-verify') app.innerHTML = renderLeaveVerify();
  else if(S.view==='leave-self-form') app.innerHTML = renderLeaveSelfForm();
  else if(S.view==='leave-request-thanks') app.innerHTML = renderLeaveRequestThanks();
  lastRenderedAppFormStep = S.appForm ? S.appForm.step : -1;
  attachHandlers();
  if(savedModalScrollTop !== null){
    const newModalEl = app.querySelector('.modal');
    if(newModalEl) newModalEl.scrollTop = savedModalScrollTop;
  }
}

let jobSearchDebounceTimer = null;
function onJobSearchInput(value){
  S.jobSearch.query = value;
  clearTimeout(jobSearchDebounceTimer);
  const resultsEl = document.getElementById('job-search-results');
  if(!value.trim()){
    S.jobSearch.results = []; S.jobSearch.busy = false;
    if(resultsEl) resultsEl.innerHTML = renderJobSearchResults();
    return;
  }
  S.jobSearch.busy = true;
  if(resultsEl) resultsEl.innerHTML = renderJobSearchResults();
  jobSearchDebounceTimer = setTimeout(async ()=>{
    try{
      const data = await apiCall('GET', `/api/public/companies/search?q=${encodeURIComponent(value.trim())}`);
      S.jobSearch.results = data.companies || [];
    } catch(e){ S.jobSearch.results = []; }
    S.jobSearch.busy = false;
    const el = document.getElementById('job-search-results');
    if(el){
      el.innerHTML = renderJobSearchResults();
      // bypassing render() here (on purpose, to keep focus/cursor in #job-search-input) means
      // attachHandlers()'s querySelectorAll('[data-act]') never saw these new buttons — wire
      // this one click target up directly instead of re-running the full handler-attach pass.
      el.querySelectorAll('[data-act="select-job-company"]').forEach(btn=>{
        btn.onclick = ()=>handleAction('select-job-company', btn);
      });
    }
  }, 300);
}

let leaveSearchDebounceTimer = null;
function onLeaveSearchInput(value){
  S.leaveSearch.query = value;
  clearTimeout(leaveSearchDebounceTimer);
  const resultsEl = document.getElementById('leave-search-results');
  if(!value.trim()){
    S.leaveSearch.results = []; S.leaveSearch.busy = false;
    if(resultsEl) resultsEl.innerHTML = renderLeaveSearchResults();
    return;
  }
  S.leaveSearch.busy = true;
  if(resultsEl) resultsEl.innerHTML = renderLeaveSearchResults();
  leaveSearchDebounceTimer = setTimeout(async ()=>{
    try{
      const data = await apiCall('GET', `/api/public/companies/search?q=${encodeURIComponent(value.trim())}`);
      S.leaveSearch.results = data.companies || [];
    } catch(e){ S.leaveSearch.results = []; }
    S.leaveSearch.busy = false;
    const el = document.getElementById('leave-search-results');
    if(el){
      el.innerHTML = renderLeaveSearchResults();
      // Same reasoning as onJobSearchInput: bypass render() here to keep focus/cursor in the
      // search input, so re-wire this batch of result buttons directly instead.
      el.querySelectorAll('[data-act="select-leave-company"]').forEach(btn=>{
        btn.onclick = ()=>handleAction('select-leave-company', btn);
      });
    }
  }, 300);
}

function navFor(role){
  const items = [{key:'overview', label:tr('nav.overview'), icon:'overview'}];
  if(role==='super_user'){
    items.push(
      {key:'create_pr', label:tr('nav.create_pr'), icon:'plus'},
      {key:'all_prs', label:tr('nav.all_prs'), icon:'list'},
      {key:'section', label:tr('nav.section_settings')},

      {key:'users', label:tr('nav.users'), icon:'users'},
      {key:'conditions', label:tr('nav.conditions'), icon:'flag'},
      {key:'approval_permissions', label:tr('nav.approval_permissions'), icon:'lock'},
      {key:'admin_queue', label:tr('nav.admin_queue'), icon:'check'},
    );
  } else if(role==='admin_maker'){
    items.push(
      {key:'section', label:tr('nav.section_settings')},
      {key:'company_settings', label:tr('nav.company_settings'), icon:'settings'},
      {key:'users', label:tr('nav.users'), icon:'users'},
      {key:'conditions', label:tr('nav.conditions'), icon:'flag'},
      {key:'my_admin_requests', label:tr('nav.my_admin_requests'), icon:'hourglass'},
    );
  } else if(role==='admin_approver'){
    items.push({key:'admin_queue', label:tr('nav.admin_queue_approver'), icon:'check'});
  } else if(role==='single_auto'){
    items.push(
      {key:'create_pr', label:tr('nav.create_pr'), icon:'plus'},
      {key:'my_prs', label:tr('nav.my_prs'), icon:'list'},
    );
  } else if(role==='single_dual'){
    items.push(
      {key:'create_pr', label:tr('nav.create_pr'), icon:'plus'},
      {key:'my_prs', label:tr('nav.my_prs'), icon:'list'},
      {key:'approve_queue', label:tr('nav.approve_queue_dual'), icon:'check'},
    );
  } else if(role==='maker'){
    items.push(
      {key:'create_pr', label:tr('nav.create_pr'), icon:'plus'},
      {key:'my_prs', label:tr('nav.my_prs'), icon:'list'},
    );
  } else if(role==='checker'){

    items.push({key:'approve_queue', label:tr('nav.approve_queue'), icon:'check'});

// "ชื่อโครงการ" on the create-PR form is an autocomplete over the real client_projects list
// (DB.projects, already company-scoped by loadRealProjects()) — searches name and code together
// in one field, no separate mode. Renders synchronously (no API round-trip needed, the list is
// already loaded client-side) directly into #pr-project-results, bypassing render() so the search
// input never loses focus/cursor mid-keystroke — same "touch the DOM directly, re-wire the one new
// click target" trick used by onJobSearchInput elsewhere in this file.
function renderPrProjectResults(){
  const f = S.prForm;
  if(!f || !f.projectResultsOpen) return '';
  const q = (f.projectSearchText||'').trim().toLowerCase();
  const matches = q
    ? DB.projects.filter(p=> (p.name||'').toLowerCase().includes(q) || (p.code||'').toLowerCase().includes(q))
    : DB.projects.slice(0, 20);
  const addNewLink = `<button type="button" class="pr-proj-result" data-act="goto-add-project-from-pr" style="display:flex; align-items:center; gap:8px; width:100%; padding:10px 12px; border:none; border-top:1px solid var(--border); background:var(--surface-alt); cursor:pointer; text-align:left; font:inherit; color:var(--steel); font-weight:600;">${ICN.plus} ${tr('create_pr.add_new_project_link')}</button>`;
  if(matches.length===0){
    return `<div class="hint" style="padding:10px 12px;">${q ? tr('create_pr.no_project_match') : tr('create_pr.no_projects_yet')}</div>${addNewLink}`;
  }
  return matches.map(p=>`
    <button type="button" class="pr-proj-result" data-act="select-pr-project" data-id="${p.id}" style="display:block; width:100%; padding:10px 12px; border:none; border-bottom:1px solid var(--border); background:#fff; cursor:pointer; text-align:left; font:inherit;">
      <div style="font-weight:600; color:var(--navy); font-size:13.5px;">${esc(p.name)}</div>
      <div class="mono" style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">${esc(p.code)}</div>
    </button>`).join('') + addNewLink;
}
function wirePrProjectResultClicks(){
  const el = document.getElementById('pr-project-results');
  if(!el) return;
  el.querySelectorAll('[data-act="select-pr-project"], [data-act="goto-add-project-from-pr"]').forEach(btn=>{
    // onmousedown (not onclick) fires BEFORE the search input's onblur — a click alone would lose
    // the race, since blur closes+clears #pr-project-results first and the click never lands.
    btn.onmousedown = (ev)=>{ ev.preventDefault(); handleAction(btn.dataset.act, btn); };
  });
}
function onPrProjectSearchInput(value){
  const f = S.prForm;
  f.projectSearchText = value;
  f.projectId = null; // typing invalidates whatever was previously selected until picked again
  f.projectResultsOpen = true;
  const el = document.getElementById('pr-project-results');
  if(el){ el.innerHTML = renderPrProjectResults(); wirePrProjectResultClicks(); }
}
// Separate from onPrProjectSearchInput on purpose: merely focusing the field (e.g. tabbing back
// into it after already picking a project) must NOT clear the existing selection the way actually
// typing does — it should just re-open the dropdown showing the current match list.
function onPrProjectSearchFocus(){
  const f = S.prForm;
  if(!f) return;

function onPrProjectSearchBlur(){

  setTimeout(()=>{

}

// ================= FINANCE MODULE =================
function financeStatusBadge(paid, amount){
  const outstanding = amount - paid;
  if(outstanding<=0) return `<span class="badge badge-approved">${tr('ledger.status_paid')}</span>`;
  if(paid>0) return `<span class="badge badge-pending">${tr('ledger.status_partial')}</span>`;
  return `<span class="badge badge-rejected">${tr('ledger.status_outstanding')}</span>`;
}
function projectSelectOptions(selected, allowNone){
  return (allowNone?`<option value="">${tr('ledger.no_project')}</option>`:'') +
    DB.projects.map(p=>`<option value="${p.id}" ${String(p.id)===String(selected)?'selected':''}>${p.name}</option>`).join('');
}
function optionsFromMap(map, selected){
  return Object.entries(map).map(([k,v])=>`<option value="${k}" ${k===selected?'selected':''}>${v}</option>`).join('');
}

function tenderStatusLabels(){
  return {
    preparing: tr('fin_tenders.status_preparing'), submitted: tr('fin_tenders.status_submitted'),
    won: tr('fin_tenders.status_won'), lost: tr('fin_tenders.status_lost'), cancelled: tr('fin_tenders.status_cancelled'),
  };
}
function tenderStatusBadgeClass(status){
  // preparing=info(blue, "in progress"), submitted=pending(amber, "awaiting result"), won=approved(green),
  // lost=rejected(light red) vs cancelled=suspended(dark slate) — kept visually distinct per spec,
  // rather than both falling into the same gray as before.
  return status==='won' ? 'badge-approved' : status==='lost' ? 'badge-rejected' : status==='cancelled' ? 'badge-suspended'
    : status==='submitted' ? 'badge-pending' : status==='preparing' ? 'badge-info' : 'badge-draft';
}
function budgetRevisionStatusLabels(){
  return {
    draft: tr('fin_budget.status_draft'), pending_approval: tr('fin_budget.status_pending_approval'),
    approved: tr('fin_budget.status_approved'), rejected: tr('fin_budget.status_rejected'),
  };
}
function budgetRevisionStatusBadgeClass(status){
  return status==='approved' ? 'badge-approved' : status==='pending_approval' ? 'badge-pending' : status==='rejected' ? 'badge-suspended' : 'badge-draft';
}
// Dismissible amber banner for rule #3's non-blocking budgetWarnings — shared by the project-cost
// and labor-cost pages (the only two save flows that can produce them) rather than duplicated markup.

    <div style="font-size:12.5px; color:var(--amber); line-height:1.5;">${esc(S.budgetWarningBanner)}</div>

}

// Maps the badge CSS class each status already resolves to (tenderStatusBadgeClass) onto the

// other status badge in this module instead of inventing a second color mapping.
const STATUS_BAR_COLOR = { 'badge-info':'var(--sky)', 'badge-pending':'var(--amber)', 'badge-approved':'var(--green)', 'badge-rejected':'var(--red)', 'badge-suspended':'var(--slate)' };
function tenderOverviewActivityLabel(type){
  return ({
    tender_created: tr('tender_overview.activity_tender_created'),
    budget_submitted: tr('tender_overview.activity_budget_submitted'),
    budget_approved: tr('tender_overview.activity_budget_approved'),
    budget_rejected: tr('tender_overview.activity_budget_rejected'),
    budget_created: tr('tender_overview.activity_budget_created'),
  })[type] || type;
}

// default). Everything here comes from ONE aggregate endpoint (GET /api/customer/tender-overview,
// loaded by loadTenderOverview()) rather than the page firing several requests and combining them
// client-side — see that endpoint's own comment in server.js for why an "over-limit budgets" section
// was deliberately left out (no such event is ever persisted anywhere in this codebase today).
function pageFinTenderOverview(){
  if(S.dataMode==='demo'){
    return `<div class="page-head"><div><h2>${tr('nav.fin_tender_overview')}</h2><div class="sub">${tr('tender_overview.subtitle')}</div></div></div>
    <div class="card" style="padding:20px 22px;"><div class="empty">${tr('tender_overview.demo_not_available')}</div></div>`;
  }
  const pageHead = `
  <div class="page-head">
    <div><h2>${tr('nav.fin_tender_overview')}</h2><div class="sub">${tr('tender_overview.subtitle')}</div></div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-ghost" data-act="nav" data-page="fin_tender_add">${ICN.plus} ${tr('fin_tenders.add_tender')}</button>
      <button class="btn btn-primary" data-act="nav" data-page="fin_project_add" data-module="bidding">${ICN.plus} ${tr('fin_projects.add_project')}</button>
    </div>
  </div>`;

  if(!S.tenderOverviewLoaded){
    return pageHead + `
    <div class="grid-cards">
      ${Array.from({length:8}).map(()=>`<div class="card stat-card"><div class="skel-bar" style="width:55%; margin-bottom:12px;"></div><div class="skel-bar" style="width:35%; height:20px;"></div></div>`).join('')}
    </div>`;
  }

  const d = S.tenderOverviewData || {};
  const counts = d.statusCounts || {preparing:0,submitted:0,won:0,lost:0,cancelled:0};
  const labels = tenderStatusLabels();
  const statusKeys = ['preparing','submitted','won','lost','cancelled'];
  const totalTenders = statusKeys.reduce((s,k)=>s+(counts[k]||0), 0);

  const pendingBudgetCount = d.pendingBudgetsCount||0;
  const pendingCardStyle = pendingBudgetCount>0 ? 'background:var(--amber-bg); border:1px solid var(--amber);' : '';
  const pendingCard = `
    <div class="card stat-card" style="${pendingCardStyle}">
      <div class="stico">${ICN.wallet}</div>
      <div><span class="eyebrow">${tr('tender_overview.stat_pending_budgets')}</span>
        <div class="num" style="${pendingBudgetCount>0?'color:var(--amber);':''}">${pendingBudgetCount}</div>
        <div class="lbl">${pendingBudgetCount>0 ? tr('tender_overview.stat_pending_budgets_note') : ''}</div>
      </div>
    </div>`;

  const summaryCards = `
  <div class="grid-cards">
    ${statusKeys.map(k=>statCard('flag', labels[k], counts[k]||0, '')).join('')}
    ${statCard('trendUp', tr('tender_overview.stat_active_value'), fmtMoney(d.activeEstimatedValueTotal||0)+' ฿', tr('tender_overview.stat_active_value_note'))}
    ${statCard('building', tr('tender_overview.stat_won_projects'), d.wonProjectsCount||0, '')}
    ${pendingCard}
  </div>`;

  const deadlines = d.upcomingDeadlines||[];
  const deadlinesHtml = deadlines.length===0
    ? `<div class="empty" style="padding:10px 0;">${tr('tender_overview.no_upcoming_deadlines')}</div>`
    : deadlines.map(t=>`
      <div data-act="nav" data-page="fin_tender_detail" data-id="${t.tenderId}" data-id-field="selectedTenderId" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border);">
        <div>
          <div style="font-size:13px; font-weight:600;">${esc(t.name)}</div>
          <div style="font-size:11.5px; color:var(--text-muted);">${esc(t.tenderNo)}</div>
        </div>
        <div style="text-align:right;">
          <div class="mono" style="font-size:12.5px;">${fmtDateTH(t.submissionDeadline)}</div>
          <div style="font-size:11px; ${t.daysLeft<=3?'color:var(--red); font-weight:700;':'color:var(--text-muted);'}">${tr('tender_overview.days_left', {days:t.daysLeft})}</div>
        </div>
      </div>`).join('');

  const pendingBudgets = d.pendingBudgets||[];
  const pendingBudgetsHtml = pendingBudgets.length===0
    ? `<div class="empty" style="padding:10px 0;">${tr('tender_overview.no_pending_budgets')}</div>`
    : pendingBudgets.map(b=>`
      <div data-act="nav" data-page="${b.refPage}" data-id="${b.refId}" data-id-field="${b.refPage==='fin_tender_detail'?'selectedTenderId':'selectedProjectId'}" data-module="bidding" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border);">
        <div style="font-size:13px;">${esc(b.refName)}</div>
        <span class="badge badge-pending">${budgetRevisionStatusLabels().pending_approval}</span>
      </div>`).join('');

  const actionRequired = `
  <div class="split" style="margin-bottom:26px;">
    <div class="card" id="tov-deadlines" style="padding:20px 22px;">
      <div class="section-title" style="margin-top:0;">${tr('tender_overview.section_upcoming_deadlines')}</div>
      ${deadlinesHtml}
    </div>
    <div class="card" id="tov-pending-budgets" style="padding:20px 22px;">
      <div class="section-title" style="margin-top:0;">${tr('tender_overview.section_pending_budgets')}</div>
      ${pendingBudgetsHtml}
    </div>
  </div>`;

  const activity = d.recentActivity||[];
  const activityHtml = activity.length===0
    ? `<div class="empty-cta"><div class="em-icon">${ICN.info}</div><div class="em-title">${tr('tender_overview.no_activity_title')}</div><div class="em-desc">${tr('tender_overview.no_activity_desc')}</div></div>`
    : activity.map(a=>`
      <div data-act="nav" data-page="${a.refPage}" data-id="${a.refId}" data-id-field="${a.refPage==='fin_tender_detail'?'selectedTenderId':'selectedProjectId'}" data-module="bidding" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);">
        <div>
          <div style="font-size:13px; font-weight:600;">${esc(a.label)}</div>
          <div style="font-size:11.5px; color:var(--text-muted);">${tenderOverviewActivityLabel(a.type)}</div>
        </div>
        <div class="mono" style="font-size:11px; color:var(--text-muted); white-space:nowrap;">${new Date(a.timestamp).toLocaleString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      </div>`).join('');

  const recentActivitySection = `
  <div class="card" id="tov-recent-activity" style="padding:20px 22px; margin-bottom:26px;">

  // Non-blocking, CSS-only stacked bar — no chart library exists anywhere in this codebase (checked),
  // but this same "colored div, width:%" technique is already used for the budget-used bars on
  // pageFinProjects()/pageFinProjectDetail(), so it's not a new pattern, just applied to status mix.
  const visibleStatuses = statusKeys.filter(k=>(counts[k]||0)>0);
  const statusBreakdown = totalTenders===0 ? '' : `
  <div class="card" id="tov-status-breakdown" style="padding:20px 22px;">

      ${visibleStatuses.map(k=>{
        const pct = (counts[k]/totalTenders*100).toFixed(1);
        const color = STATUS_BAR_COLOR[tenderStatusBadgeClass(k)];
        return `<div style="width:${pct}%; background:${color};" title="${esc(labels[k])}: ${counts[k]}"></div>`;
      }).join('')}
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:14px; margin-top:12px;">

      }).join('')}
    </div>
  </div>`;

  return pageHead + summaryCards + actionRequired + recentActivitySection + statusBreakdown;
}

// Resizes S.tenderAddForm.installments to match installmentCount, keeping whatever's already in the
// surviving rows — growing appends blank rows at the end, shrinking truncates from the end, so e.g.
// 5→3 keeps rows 1-3 exactly as typed rather than clearing the whole table (per spec: "พยายามคงข้อมูล
// ที่กรอกไว้แล้วในแถวที่ยังอยู่"). Bound to the "จำนวนงวดงาน" input's oninput — auto-generates rows
// immediately, no separate "สร้างตาราง" button, per the spec's preferred option.
// ---- Shared by both "เปิด Tender ใหม่" and "เพิ่มโครงการ" (2026-07-25 Project-form expansion) ----
// Both forms have an identical sector-toggle + งวดงาน-installments shape, differing only in which
// S.*AddForm object they read/write, which id prefix their inputs use, and which translation-key
// namespace their labels come from. Generalized via a params object rather than copy-pasted per form
// — this file has no build step/real closures, so the "which form" distinction is just a literal
// string (formKey) interpolated into the generated oninput="..." attributes, same technique already
// used everywhere else here (e.g. S.budgetItemsForm.items[${idx}]...).
function installmentSetCount(formKey, value){
  const f = S[formKey];
  const n = Math.max(0, parseInt(value, 10) || 0);
  f.installmentCount = value;
  if(!Array.isArray(f.installments)) f.installments = [];
  while(f.installments.length < n) f.installments.push({description:'', amount:'', daysToComplete:''});
  if(f.installments.length > n) f.installments.length = n;
  render();
}
// privateTotalField is the form's own name for its "single value" field (tender: 'estimatedValue',
// project: 'budget' — client_projects.budget_amount already plays this dual role, see schema.sql).
function installmentProjectTotal(f, privateTotalField){
  return f.sectorType==='government' ? (Number(f.budgetAmount)||0) : (Number(f[privateTotalField])||0);
}
function renderInstallmentRows(opts){
  const f = S[opts.formKey];
  const rows = f.installments || [];
  if(rows.length===0) return '';
  const instTotal = rows.reduce((s,r)=>s+(Number(r.amount)||0), 0);
  const total = installmentProjectTotal(f, opts.privateTotalField);
  // Advisory only ("แจ้งเตือน...แต่ไม่ต้อง block การบันทึก") — only shown once there's actually a
  // project total to compare against, so an all-zero/blank form doesn't nag on page load.
  const mismatchHint = total>0 && Math.abs(instTotal-total)>0.01
    ? `<div class="callout callout-warn" style="margin-top:8px;">${tr(opts.trPrefix+'.installment_mismatch_hint', {total: fmtMoney(instTotal), project: fmtMoney(total)})}</div>`
    : '';
  return `
    <div class="table-wrap" style="margin-top:10px;"><table>
      <thead><tr><th style="width:40px;">#</th><th>${tr(opts.trPrefix+'.installment_desc_label')}</th><th class="num-cell" style="width:160px;">${tr(opts.trPrefix+'.installment_amount_label')}</th><th class="num-cell" style="width:160px;">${tr(opts.trPrefix+'.installment_days_label')}</th></tr></thead>
      <tbody>
        ${rows.map((r,i)=>`
          <tr>
            <td class="mono">${i+1}</td>
            <td><input value="${esc(r.description||'')}" oninput="S.${opts.formKey}.installments[${i}].description=this.value;"></td>
            <td><input type="number" min="0" step="0.01" value="${r.amount||''}" style="text-align:right;" oninput="S.${opts.formKey}.installments[${i}].amount=this.value; renderInstallmentTotals('${opts.formKey}','${opts.idPrefix}','${opts.privateTotalField}');"></td>
            <td><input type="number" min="0" step="1" value="${r.daysToComplete||''}" style="text-align:right;" oninput="S.${opts.formKey}.installments[${i}].daysToComplete=this.value;"></td>
          </tr>`).join('')}
      </tbody>
    </table></div>
    <div id="${opts.idPrefix}-installment-total" style="margin-top:8px; text-align:right; font-size:13px;"><span style="color:var(--text-muted);">${tr(opts.trPrefix+'.installment_total_label')}:</span> <span class="mono" style="font-weight:700;">${fmtMoney(instTotal)}</span></div>
    <div id="${opts.idPrefix}-installment-mismatch">${mismatchHint}</div>`;
}
// The amount total/mismatch hint updates on every keystroke, but a full render() would blow away
// focus/cursor position mid-typing in whatever cell the user is on (same reasoning as every other
// live-bound-without-render() field in this file) — so this patches just the 2 small summary nodes
// directly instead. trPrefix isn't needed here since the mismatch hint's HTML is rebuilt fresh (it
// carries its own tr() calls), only formKey/idPrefix/privateTotalField are — so this reuses
// renderInstallmentRows' inner logic via installmentProjectTotal rather than re-deriving it.
function renderInstallmentTotals(formKey, idPrefix, privateTotalField){
  const f = S[formKey];
  const totalEl = document.getElementById(idPrefix+'-installment-total');
  const mismatchEl = document.getElementById(idPrefix+'-installment-mismatch');
  if(!totalEl || !mismatchEl) return;
  const rows = f.installments || [];
  const instTotal = rows.reduce((s,r)=>s+(Number(r.amount)||0), 0);
  const total = installmentProjectTotal(f, privateTotalField);
  const trPrefix = formKey==='projectAddForm' ? 'fin_project_add' : 'fin_tender_add';
  totalEl.innerHTML = `<span style="color:var(--text-muted);">${tr(trPrefix+'.installment_total_label')}:</span> <span class="mono" style="font-weight:700;">${fmtMoney(instTotal)}</span>`;
  mismatchEl.innerHTML = total>0 && Math.abs(instTotal-total)>0.01
    ? `<div class="callout callout-warn" style="margin-top:8px;">${tr(trPrefix+'.installment_mismatch_hint', {total: fmtMoney(instTotal), project: fmtMoney(total)})}</div>`
    : '';
}
// opts: {formKey, idPrefix, trPrefix, privateTotalField, privateFieldLabelKey} — the private branch
// reuses whichever field the caller already has for its "single value" figure (tender's own
// estimatedValue input; project's pre-existing budget input), never a second/new one, per the same
// no-duplicate-column reasoning schema.sql documents for client_tenders.estimated_value.
function renderSectorTypeSection(opts){
  const f = S[opts.formKey];
  const isGov = f.sectorType==='government';
  const isPrivate = f.sectorType==='private';
  const totalsCall = `renderInstallmentTotals('${opts.formKey}','${opts.idPrefix}','${opts.privateTotalField}');`;
  return `
    <div class="section-title">${tr(opts.trPrefix+'.section_sector')}</div>
    <div class="field">
      <label>${tr(opts.trPrefix+'.sector_type_label')} *</label>
      <div class="small-btn-row" style="gap:18px; margin-top:4px;">
        <label style="display:flex; align-items:center; gap:6px; font-weight:400; cursor:pointer;"><input type="radio" name="${opts.idPrefix}-sectorType" value="government" ${isGov?'checked':''} onchange="S.${opts.formKey}.sectorType=this.value; render();">${tr(opts.trPrefix+'.sector_government_label')}</label>
        <label style="display:flex; align-items:center; gap:6px; font-weight:400; cursor:pointer;"><input type="radio" name="${opts.idPrefix}-sectorType" value="private" ${isPrivate?'checked':''} onchange="S.${opts.formKey}.sectorType=this.value; render();">${tr(opts.trPrefix+'.sector_private_label')}</label>
      </div>
    </div>
    ${isGov ? `
    <div class="split">
      <div class="field"><label>${tr(opts.trPrefix+'.budget_amount_label')}</label><input id="${opts.idPrefix}-budgetAmount" type="number" min="0" step="0.01" placeholder="0.00" value="${f.budgetAmount||''}" oninput="S.${opts.formKey}.budgetAmount=this.value; ${totalsCall}"></div>
      <div class="field"><label>${tr(opts.trPrefix+'.reference_price_label')}</label><input id="${opts.idPrefix}-referencePrice" type="number" min="0" step="0.01" placeholder="0.00" value="${f.referencePrice||''}" oninput="S.${opts.formKey}.referencePrice=this.value;"></div>
    </div>` : isPrivate ? `
    <div class="field"><label>${tr(opts.trPrefix+'.'+opts.privateFieldLabelKey)}</label><input id="${opts.idPrefix}-${opts.privateTotalField}" type="number" min="0" step="0.01" placeholder="0.00" value="${f[opts.privateTotalField]||''}" oninput="S.${opts.formKey}.${opts.privateTotalField}=this.value; ${totalsCall}"></div>` : ''}`;
}
// จำนวนเงินประกันผลงานเริ่มต้น (บาท) is never stored — always (approved PM project budget total) ×
// percent / 100, computed fresh wherever it's needed (matches schema.sql's reasoning for not carrying
// a companion amount column). total is null when there's no linked project yet or its PM budget has
// no approved revision — callers must check for null themselves rather than let this silently treat
// it as 0, since "no approved budget yet" and "approved budget of exactly 0" are different states.
function tenderRetentionAmount(total, percent){
  return (Number(total)||0) * (Number(percent)||0) / 100;
}
