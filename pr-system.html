// Shared by the read-only view AND the import-preview modal (both Template and Mapping mode land on
// this exact same table — see the ข้อ "Preview + Import" spec). editable=true adds a live is_group
// checkbox per row (bound via onIsGroupChange rather than a fixed S path, since the preview modal's
// items live at S.modal.items while the page's own items live at S.budgetItemsForm.items).
// Single-row renderer factored out of renderBoqItemsTable. Each row is exactly one of 3 kinds —
// category header (isGroup), summary/subtotal row (isSummaryRow), or a normal line item — mirroring
// buildBoqRow's own mutually-exclusive classification server-side. In editable mode (the import
// preview step, both Tab A and Tab B) 2 checkboxes let the user override either flag per row; ticking
// one clears the other (see boqModalSetItemGroup/boqModalSetItemSummaryRow).
function boqItemRowHtml(it, i, opts){
  opts = opts || {};
  const groupCheckboxHtml = opts.editable
    ? `<td style="text-align:center;"><input type="checkbox" ${it.isGroup?'checked':''} onchange="${opts.onIsGroupChange}(${i}, this.checked)" title="${tr('fin_budget.col_is_group')}"></td>`

}
// A qty/unit-price cell the server had to default to 0 (blank or unparseable in the source file) gets
// a light highlight + tooltip, so "0" never reads as "the file really said zero" when it actually just
// meant "this field was empty" — see qtyDefaulted/materialUnitPriceDefaulted/laborUnitPriceDefaulted
// on buildBoqRow's returned row (server.js).
function boqDefaultedCellHtml(value, isDefaulted, isMoney){
  const text = isMoney ? fmtMoney(value) : value;
  if(!isDefaulted) return `<td class="mono num-cell" style="white-space:nowrap;">${text}</td>`;
  return `<td class="mono num-cell cell-defaulted" style="white-space:nowrap;" title="${tr('fin_budget.value_defaulted_tooltip')}">${text}</td>`;
}
// Explicit width hints on every column EXCEPT รายการงาน (which gets whatever's left) — table-layout is

// Client-side mirror of the server's rollupBoqGroupAmounts — but positional rather than group_id-
// based, since an in-progress editable-form/preview item array has no real group_id yet (that's only
// assigned server-side at save time, see insertFreshBoqItems in server.js). Walks the array using the
// exact same "a group row owns every following non-group row until the next group row" rule the
// server will use, so what's previewed here always matches what gets saved. Returns a parallel array
// (one entry per item, null for non-group rows) of {materialAmount, laborAmount, amount}.
function computeBoqGroupRollups(items){
  const rollups = new Array(items.length).fill(null);
  let groupIdx = -1;
  let acc = null;
  const flush = ()=>{ if(groupIdx>=0 && acc) rollups[groupIdx] = acc; };
  items.forEach((it,i)=>{
    if(it.isGroup){
      flush();
      groupIdx = i;
      acc = {materialAmount:0, laborAmount:0, amount:0};
    } else if(groupIdx>=0){
      const materialAmount = Math.round((Number(it.qty)||0) * (Number(it.materialUnitPrice)||0) * 100) / 100;
      const laborAmount = Math.round((Number(it.qty)||0) * (Number(it.laborUnitPrice)||0) * 100) / 100;
      acc.materialAmount += materialAmount;
      acc.laborAmount += laborAmount;
      acc.amount += materialAmount + laborAmount;
    }
  });
  flush();
  return rollups;
}

// Amounts are deliberately NOT bound inputs (rule: "รวมเงิน คำนวณอัตโนมัติ") — recomputed and written
// straight into DOM cells on every qty/unit-price keystroke, rather than a full render(), so editing
// stays live without resetting every other input's cursor/focus (same reasoning as every other
// live-bound-to-S field in this file). Also refreshes the owning group row's rollup cells, since a
// child row's edit can change its group's subtotal.
function updateBoqRowAmounts(idx){
  const items = S.budgetItemsForm.items;
  const item = items[idx];
  const materialAmount = item.isGroup ? 0 : Math.round((Number(item.qty)||0) * (Number(item.materialUnitPrice)||0) * 100) / 100;
  const laborAmount = item.isGroup ? 0 : Math.round((Number(item.qty)||0) * (Number(item.laborUnitPrice)||0) * 100) / 100;
  const amount = materialAmount + laborAmount;
  const mCell = document.getElementById('boq-material-amount-'+idx);
  const lCell = document.getElementById('boq-labor-amount-'+idx);
  const tCell = document.getElementById('boq-amount-'+idx);
  if(mCell) mCell.textContent = fmtMoney(materialAmount);
  if(lCell) lCell.textContent = fmtMoney(laborAmount);
  if(tCell) tCell.textContent = fmtMoney(amount);
  let groupIdx = -1;
  for(let i=idx-1;i>=0;i--){ if(items[i].isGroup){ groupIdx=i; break; } }
  if(groupIdx>=0){
    const acc = computeBoqGroupRollups(items)[groupIdx] || {materialAmount:0, laborAmount:0, amount:0};
    const gm = document.getElementById('boq-material-amount-'+groupIdx);
    const gl = document.getElementById('boq-labor-amount-'+groupIdx);
    const gt = document.getElementById('boq-amount-'+groupIdx);
    if(gm) gm.textContent = fmtMoney(acc.materialAmount);
    if(gl) gl.textContent = fmtMoney(acc.laborAmount);
    if(gt) gt.textContent = fmtMoney(acc.amount);
  }
}
// Drag-reorder for the editable table — reorders the in-memory array only; idx (this table's
// existing "display order within a revision" column, already ORDER BY'd everywhere — see schema.sql's
// note on why there's no separate sort_order column) gets reassigned from array position when saved,
// same as it always has been for a freshly-imported or freshly-added row. A full render() (rather than
// updateBoqRowAmounts' targeted DOM patch) is used here since reordering can change which group several
// rows belong to at once.
function boqDragStart(e, idx){ e.dataTransfer.setData('text/plain', String(idx)); e.dataTransfer.effectAllowed = 'move'; }
function boqDrop(e, idx){
  e.preventDefault();
  const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
  if(Number.isNaN(from) || from===idx) return;
  const items = S.budgetItemsForm.items;
  const [moved] = items.splice(from, 1);
  items.splice(idx, 0, moved);
  render();
}
function boqItemsFormSetGroup(idx, checked){ S.budgetItemsForm.items[idx].isGroup = checked; render(); }

      <td><input type="number" min="0" step="0.01" value="${it.materialUnitPrice}" style="width:90px; text-align:right;" oninput="S.budgetItemsForm.items[${idx}].materialUnitPrice=this.value; updateBoqRowAmounts(${idx});"></td>
      <td><input type="number" min="0" step="0.01" value="${it.laborUnitPrice}" style="width:90px; text-align:right;" oninput="S.budgetItemsForm.items[${idx}].laborUnitPrice=this.value; updateBoqRowAmounts(${idx});"></td>

// ---------------- BOQ import modal (Tab A: standard template, Tab B: mapping wizard) ----------------
function boqActiveSheet(m){ return m.sheets ? m.sheets.find(s=>s.name===m.activeSheetName && !s.deleted) : null; }
// First surviving (non-excluded) row with any content, mirroring the server's findBoqHeaderRowIndex
// exactly — so the mapping step's dropdowns always show the same header the server will actually use.
function boqFindHeaderRowNum(sheet){
  const excludedRows = new Set(sheet.excludedRows||[]);
  for(let ri=0; ri<sheet.rows.length; ri++){
    const rowNum = ri+1;
    if(excludedRows.has(rowNum)) continue;
    if(sheet.rows[ri].some(v=>String(v||'').trim()!=='')) return rowNum;
  }
  return null;
}
// Client-side mirror of the server's boqCombinedHeaderLabel — combines `headerRowCount` raw-text rows
// starting at `firstRow` into one label per column, skipping blanks and collapsing consecutive
// duplicates (a vertically-merged header cell, e.g. "รหัสงาน" spanning both header rows because it
// has no sub-split, reads the same text on every row it covers). Works entirely off the already-
// fetched raw grid (`sheet.rows`) — that text already carries ExcelJS's own merge-propagated values
// (reading any cell inside a merge range returns the master cell's value), so no separate merge-range
// data needs to travel from the server just for this.
function boqCombinedHeaderLabelClient(sheet, firstRow, headerRowCount, colIdx){
  const parts = [];
  for(let i=0;i<headerRowCount;i++){
    const rowCells = sheet.rows[firstRow-1+i] || [];
    const v = String(rowCells[colIdx-1]==null ? '' : rowCells[colIdx-1]).trim();
    if(v && parts[parts.length-1]!==v) parts.push(v);
  }
  return parts.join(' - ');
}
// headerRowCount comes from `sheet.headerRowCount` (server auto-detected at inspect time, or the
// user's override from the Step 1/2 control — see renderBoqSheetsStep). Labels are de-duplicated the
// same way the server does, so two differently-positioned columns can never collapse onto the same
// dropdown option.
function boqComputeMappingHeaders(sheet){
  const headerRowNum = boqFindHeaderRowNum(sheet);
  if(!headerRowNum) return {headerRowNum:null, headers:[]};
  const headerRowCount = sheet.headerRowCount || 1;
  const excludedCols = new Set(sheet.excludedCols||[]);
  const maxCol = sheet.rows.reduce((mx,r)=>Math.max(mx,r.length),0);
  const headers = [];
  const seen = new Set();
  for(let ci=0; ci<maxCol; ci++){
    const colNum = ci+1;
    if(excludedCols.has(colNum)) continue;
    let label = boqCombinedHeaderLabelClient(sheet, headerRowNum, headerRowCount, colNum);
    if(!label) continue;
    if(seen.has(label)) label = `${label} (คอลัมน์ ${colNum})`;
    seen.add(label);
    headers.push({index:colNum, label});
  }
  return {headerRowNum, headers};
}
// Same as boqComputeMappingHeaders but ignores column exclusions — used to figure out which labels
// the user's excludedCols actually deleted (for saving into a profile's deletedColumnLabels).
function boqAllHeaderLabels(sheet){
  const headerRowNum = boqFindHeaderRowNum(sheet);
  if(!headerRowNum) return [];
  const headerRowCount = sheet.headerRowCount || 1;
  const maxCol = sheet.rows.reduce((mx,r)=>Math.max(mx,r.length),0);
  const headers = [];
  const seen = new Set();
  for(let ci=0; ci<maxCol; ci++){
    const colNum = ci+1;
    let label = boqCombinedHeaderLabelClient(sheet, headerRowNum, headerRowCount, colNum);
    if(!label) continue;
    if(seen.has(label)) label = `${label} (คอลัมน์ ${colNum})`;
    seen.add(label);
    headers.push({index:colNum, label});
  }
  return headers;
}
function loadBoqProfileIntoMapping(profileId){
  const p = S.modal.profiles.find(x=>String(x.id)===String(profileId));
  if(!p) return;
  // Still lands on the same preview step as everything else before anything is committed (per spec:
  // "ยัง preview ให้ตรวจก่อน confirm เสมอ") — this only pre-fills the mapping FORM, it doesn't skip
  // straight to import.
  S.modal.mapping = {
    description:'', qty:'', unit:'', workCode:'', note:'', sequenceNo:'',
    materialUnitPriceColumn:'', laborUnitPriceColumn:'', materialAmountColumn:'', laborAmountColumn:'', totalAmountColumn:'',
    summaryRowKeywords:[],
    ...p.columnMapping,
  };
  // Auto-strip whatever columns were deleted the last time this profile's mapping was saved, so a
  // recurring non-standard file format doesn't need re-trimming by hand every time.
  const deletedLabels = p.columnMapping.deletedColumnLabels || [];
  const active = boqActiveSheet(S.modal);
  if(deletedLabels.length && active){
    const toExclude = boqAllHeaderLabels(active).filter(h=>deletedLabels.includes(h.label)).map(h=>h.index);
    active.excludedCols = Array.from(new Set([...(active.excludedCols||[]), ...toExclude]));
  }
  render();
}
// Mutually exclusive per spec: ticking either checkbox clears the other on the same row.
function boqModalSetItemGroup(idx, checked){
  const it = S.modal.items[idx];
  it.isGroup = checked;
  if(checked) it.isSummaryRow = false;
  render();
}
function boqModalSetItemSummaryRow(idx, checked){
  const it = S.modal.items[idx];
  it.isSummaryRow = checked;
  if(checked) it.isGroup = false;
  render();
}
// User override for "จำนวนแถว Header" (spec: default auto-detect, but always user-adjustable) — the
// server auto-detects on inspect (2 rows when it finds a merged parent header, 1 otherwise) and this
// just lets the user correct it either way before mapping; the confirmed value is sent to
// boq-preview-mapped alongside the mapping (see the preview-boq-mapping handler).
function setBoqHeaderRowCount(sheetName, value){
  const sheet = S.modal.sheets.find(s=>s.name===sheetName);

}

// Steps 1+2 combined: every sheet as a tab, showing the FULL raw grid (no header auto-detection yet)
// with a delete toggle per row/column and a delete-sheet action, per the spec's "import ทั้งไฟล์ →
// แก้ไขแบบ spreadsheet ก่อน mapping" flow. Delete-only (no cell-value editing) — deletions are tracked
// as index sets on each sheet object and re-applied server-side against the ORIGINAL file at the final
// preview-mapped call (see preview-boq-mapping), never materialized into a second copy of the data.
function renderBoqSheetsStep(m){
  const visibleSheets = m.sheets.filter(s=>!s.deleted);
  const active = boqActiveSheet(m) || visibleSheets[0];
  const tabsHtml = visibleSheets.length>1 ? `
    <div class="small-btn-row" style="flex-wrap:wrap; margin-bottom:10px;">
      ${visibleSheets.map(s=>`<button class="btn btn-sm ${active&&s.name===active.name?'btn-primary':'btn-ghost'}" data-act="select-boq-sheet-tab" data-sheet="${esc(s.name)}">${esc(s.name)}</button>`).join('')}
    </div>` : '';
  if(!active){
    return `${tabsHtml}<div class="empty">${tr('fin_budget.no_items_yet')}</div>`;
  }
  const excludedRows = new Set(active.excludedRows||[]);
  const excludedCols = new Set(active.excludedCols||[]);
  const maxCol = active.rows.reduce((mx,r)=>Math.max(mx,r.length),0);
  // Header rows are highlighted (not just deletable) so it's obvious which rows the "จำนวนแถว Header"
  // control below combines into one column label — a merged-header file (e.g. "ราคาค่าวัสดุ" over
  // "ต่อหน่วย"/"เป็นเงิน") needs the user to actually SEE both rows are being treated as header, not
  // guess from the mapping dropdown alone.
  const headerRowNum = boqFindHeaderRowNum(active);
  const headerRowCount = active.headerRowCount || 1;
  const headerRowSet = new Set(headerRowNum ? Array.from({length:headerRowCount}, (_,i)=>headerRowNum+i) : []);
  const colHeaderRow = `<tr>
    <th></th>
    ${Array.from({length:maxCol}, (_,ci)=>{
      const colNum = ci+1;
      const isExcluded = excludedCols.has(colNum);
      return `<th style="cursor:pointer; ${isExcluded?'opacity:.4; text-decoration:line-through;':''}" data-act="toggle-boq-col" data-sheet="${esc(active.name)}" data-col="${colNum}" title="${tr('fin_budget.click_to_toggle_column')}">${tr('fin_budget.col_label',{n:colNum})}</th>`;
    }).join('')}
  </tr>`;
  const rowsHtml = active.rows.map((cells, ri)=>{
    const rowNum = ri+1;
    const isExcluded = excludedRows.has(rowNum);
    const isHeaderRow = headerRowSet.has(rowNum);
    return `<tr style="${isExcluded?'opacity:.4;':''} ${isHeaderRow?'background:var(--surface-alt); font-weight:600;':''}">
      <td><button class="btn btn-ghost btn-sm" data-act="toggle-boq-row" data-sheet="${esc(active.name)}" data-row="${rowNum}">${isExcluded?tr('fin_budget.restore_row'):tr('fin_budget.delete_row')}</button></td>
      ${Array.from({length:maxCol}, (_,ci)=>{
        const colNum = ci+1;
        const colExcluded = excludedCols.has(colNum);
        return `<td style="${(isExcluded||colExcluded)?'text-decoration:line-through;':''}">${esc(cells[ci]||'')}</td>`;
      }).join('')}
    </tr>`;
  }).join('');
  const headerRowCountControl = headerRowNum ? `
    <div class="field" style="max-width:220px;">
      <label>${tr('fin_budget.header_row_count_label')}</label>
      <input type="number" min="1" max="6" value="${headerRowCount}" oninput="setBoqHeaderRowCount('${esc(active.name)}', this.value)">
      <div class="hint">${tr('fin_budget.header_row_count_hint')}</div>
    </div>` : '';
  return `
    ${tabsHtml}
    <div class="small-btn-row" style="justify-content:space-between; margin-bottom:8px;">
      <div class="hint">${tr('fin_budget.raw_grid_hint')}</div>
      ${visibleSheets.length>1 ? `<button class="btn btn-ghost btn-sm" data-act="delete-boq-sheet" data-sheet="${esc(active.name)}">${tr('fin_budget.delete_sheet')}</button>` : ''}
    </div>
    ${headerRowCountControl}
    <div class="table-wrap" style="max-height:360px; overflow:auto; margin-top:10px;"><table>
      <thead>${colHeaderRow}</thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
    ${m.error ? `<div class="callout callout-error" style="margin-top:10px;">${esc(m.error)}</div>` : ''}
    <div class="small-btn-row" style="justify-content:flex-end; margin-top:14px;">
      <button class="btn btn-ghost" data-act="close-modal">${tr('common.cancel')}</button>
      <button class="btn btn-primary" data-act="continue-boq-sheet">${tr('common.next')}</button>
    </div>`;
}
function renderBoqMappingStep(m){

    </div>
    <div class="split">
      <div class="field"><label>${tr('fin_budget.map_qty')} *</label><select onchange="S.modal.mapping.qty=this.value;">${colOptions(map.qty)}</select></div>
      <div class="field"><label>${tr('fin_budget.map_note')}</label><select onchange="S.modal.mapping.note=this.value;">${colOptions(map.note)}</select></div>
    </div>
    <div class="split">
      <div class="field"><label>${tr('fin_budget.map_material_unit_price')}</label><select onchange="S.modal.mapping.materialUnitPriceColumn=this.value;">${colOptions(map.materialUnitPriceColumn)}</select></div>
      <div class="field"><label>${tr('fin_budget.map_labor_unit_price')}</label><select onchange="S.modal.mapping.laborUnitPriceColumn=this.value;">${colOptions(map.laborUnitPriceColumn)}</select></div>

      <div class="hint">${tr('fin_budget.map_amount_hint')}</div>
    </div>
    ${m.error ? `<div class="callout callout-error" style="margin-top:10px;">${esc(m.error)}</div>` : ''}
    <div class="section-title">${tr('fin_budget.save_profile_section')}</div>
    <div class="split">
      <div class="field"><label>${tr('fin_budget.profile_name_label')}</label><input id="boq-profile-name" value="${esc(m.profileNameToSave||'')}" oninput="S.modal.profileNameToSave=this.value;"></div>
      <div class="field" style="display:flex; align-items:flex-end;"><button class="btn btn-ghost btn-sm" data-act="save-boq-profile">${tr('fin_budget.save_profile_btn')}</button></div>

    <div class="small-btn-row" style="justify-content:flex-end; margin-top:14px;">
      <button class="btn btn-ghost" data-act="close-modal">${tr('common.cancel')}</button>
      <button class="btn btn-primary" data-act="preview-boq-mapping">${tr('fin_budget.preview_import')}</button>
    </div>`;
}
function renderBoqPreviewStep(m){
  const groupCount = m.items.filter(it=>it.isGroup).length;
  const summaryCount = m.items.filter(it=>it.isSummaryRow).length;
  const importableCount = m.items.length - groupCount - summaryCount;
  const countsHint = tr('fin_budget.import_preview_breakdown', {importable: importableCount, groups: groupCount, summary: summaryCount});
  const warnings = m.summaryRowWarnings || [];
  const warningsHtml = warnings.length>0 ? `
    <div class="callout callout-warn" style="white-space:pre-line; margin-bottom:12px;">
      ${warnings.map(w=>tr('fin_budget.summary_row_mismatch_warning', {description:w.description, expected: fmtMoney(w.expected.amount), actual: fmtMoney(w.actual.amount)})).join('\n')}
    </div>` : '';
  // Recomputed on the client (rather than trusting the server's `total` verbatim) so toggling a row's
  // checkboxes in the table below reflects in this figure immediately, without a round-trip back to
  // boq-preview/boq-preview-mapped — a summary row's amount is only ever cross-check info, never part
  // of what actually gets inserted (see the confirm route filtering isSummaryRow rows out).
  const previewTotal = Math.round(m.items.filter(it=>!it.isSummaryRow).reduce((s,it)=>s+it.amount,0) * 100) / 100;
  return `
    <div class="hint" style="margin-bottom:12px;">${countsHint}</div>
    ${warningsHtml}
    ${renderBoqItemsTable(m.items, {editable:true, onIsGroupChange:'boqModalSetItemGroup', onIsSummaryRowChange:'boqModalSetItemSummaryRow'})}
    <div style="margin-top:10px; text-align:right; font-size:13px;"><span style="color:var(--text-muted);">${tr('fin_budget.total_amount_label')}:</span> <span class="mono" style="font-weight:700;">${fmtMoney(previewTotal)}</span></div>
    <div class="small-btn-row" style="justify-content:flex-end; margin-top:14px;">
      <button class="btn btn-ghost" data-act="close-modal">${tr('common.cancel')}</button>
      <button class="btn btn-primary" data-act="confirm-boq-import">${tr('fin_budget.confirm_import')}</button>
    </div>`;
}
function renderBoqImportModal(m){
  const tabsHtml = `
    <div class="small-btn-row" style="gap:0; margin-bottom:16px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); overflow:hidden;">
      <button class="btn btn-sm" style="flex:1; border-radius:0; ${m.tab==='template'?'background:var(--navy); color:#fff;':'background:transparent;'}" data-act="set-boq-import-tab" data-tab="template">${tr('fin_budget.tab_template')}</button>
      <button class="btn btn-sm" style="flex:1; border-radius:0; ${m.tab==='mapping'?'background:var(--navy); color:#fff;':'background:transparent;'}" data-act="set-boq-import-tab" data-tab="mapping">${tr('fin_budget.tab_mapping')}</button>
    </div>`;
  let body;
  if(m.step==='preview') body = renderBoqPreviewStep(m);
  else if(m.tab==='template') body = renderBoqTemplateUploadStep(m);
  else if(m.step==='sheets') body = renderBoqSheetsStep(m);
  else if(m.step==='mapping') body = renderBoqMappingStep(m);
  else body = renderBoqMappingUploadStep(m);
  const wide = m.step==='sheets' || m.step==='preview';
  return `<div class="modal-overlay" data-act="close-modal">
    <div class="modal" data-stop="1" style="max-width:${wide?'1180px':'820px'};">
      <h3>${tr('fin_budget.import_boq')}</h3>
      ${m.step==='upload' ? tabsHtml : ''}
      ${body}
    </div>
  </div>`;
}

            <td>${(!latest || r.id!==latest.id) ? `<button class="btn btn-ghost btn-sm" data-act="view-budget-revision" data-budget-id="${b.id}" data-revision-id="${r.id}">${tr('fin_budget.view_revision')}</button>` : ''}</td>

// ---- "ชื่อโครงการ" search-as-you-type (2026-07-25) — replaces what used to be a separate #pa-tender
// <select> alongside a plain-text name field, consolidated into one so there's only one place to pick
// "which tender is this" instead of two UI elements doing overlapping jobs. Matches DB.tenders by name
// OR tender_no substring, mirroring create_pr's onPrProjectSearchInput/renderPrProjectResults pattern
// (same onmousedown-before-blur race handling — see wireProjectTenderResultClicks) but against tenders
// instead of projects, and with a different "no match" outcome: PR's search forces picking an existing
// project (or a button to go create one); here NOT matching anything is itself a valid, expected
// result — the typed text just becomes a manual (not tender-linked) project name, no button needed.
// No debounce: this filters the already-loaded DB.tenders array in memory (no per-keystroke request),
// so there's no network cost to avoid — the technical note's 300ms-debounce ask was conditioned on
// searching through a real API call, which this deliberately isn't (see PROJECT_DEPENDENT_PAGES /
// the fin_project_add-specific loadRealTenders() call that already guarantees DB.tenders is populated
// before this page renders).
function renderProjectTenderResults(){
  const f = S.projectAddForm;
  if(!f || !f.tenderResultsOpen) return '';
  const q = (f.name||'').trim().toLowerCase();
  const matches = q
    ? DB.tenders.filter(t=> (t.name||'').toLowerCase().includes(q) || (t.tenderNo||'').toLowerCase().includes(q))
    : DB.tenders.slice(0, 20);
  if(matches.length===0){
    return q ? `<div class="hint" style="padding:10px 12px;">${tr('fin_project_add.tender_search_no_match')}</div>` : '';
  }
  return matches.map(t=>`
    <button type="button" class="pa-tender-result" data-act="select-project-tender" data-id="${t.id}" style="display:block; width:100%; padding:10px 12px; border:none; border-bottom:1px solid var(--border); background:#fff; cursor:pointer; text-align:left; font:inherit;">
      <div style="font-weight:600; color:var(--navy); font-size:13.5px;">${esc(t.name)}</div>
      <div class="mono" style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">${esc(t.tenderNo)}</div>
    </button>`).join('');
}
function wireProjectTenderResultClicks(){
  const el = document.getElementById('pa-tender-results');
  if(!el) return;
  el.querySelectorAll('[data-act="select-project-tender"]').forEach(btn=>{
    // onmousedown (not onclick) fires BEFORE the search input's onblur — a click alone would lose the
    // race, since blur closes+clears #pa-tender-results first and the click never lands.
    btn.onmousedown = (ev)=>{ ev.preventDefault(); handleAction(btn.dataset.act, btn); };
  });
}
function onProjectNameInput(value){
  const f = S.projectAddForm;
  f.name = value;
  f.tenderId = ''; // typing invalidates whatever was previously selected until picked again
  f.tenderResultsOpen = true;
  const el = document.getElementById('pa-tender-results');
  if(el){ el.innerHTML = renderProjectTenderResults(); wireProjectTenderResultClicks(); }
}
// Separate from onProjectNameInput on purpose: merely focusing the field (e.g. tabbing back into it
// after already picking a tender) must NOT clear the existing selection the way actually typing does —
// it should just re-open the dropdown showing the current match list.
function onProjectNameFocus(){
  const f = S.projectAddForm;
  if(!f) return;
  f.tenderResultsOpen = true;
  const el = document.getElementById('pa-tender-results');
  if(el){ el.innerHTML = renderProjectTenderResults(); wireProjectTenderResultClicks(); }
}
function onProjectNameBlur(){
  // Delayed so a mousedown on a result row (see wireProjectTenderResultClicks) still gets to run first.
  setTimeout(()=>{
    if(!S.projectAddForm) return;
    S.projectAddForm.tenderResultsOpen = false;
    const el = document.getElementById('pa-tender-results');
    if(el) el.innerHTML = '';
  }, 200);
}
// Auto-fill hook, called both from select-project-tender (a suggestion picked from the name search
// above) and directly by tests. Only overwrites already-typed data behind a confirm() — the common
// case (freshly opened blank form) just fills unconditionally. Nothing gets locked: every value lands
// in the same plain S.projectAddForm.* fields every other input on this form reads/writes, so the user
// can edit anything afterward (real contract terms at signing can differ from what was in the bid).
async function onProjectAddTenderChange(tenderIdStr){
  const f = S.projectAddForm;
  f.tenderId = tenderIdStr;
  const tenderId = tenderIdStr ? parseInt(tenderIdStr, 10) : null;
  if(!tenderId){ render(); return; }
  const t = DB.tenders.find(x=>x.id===tenderId);
  if(!t){ render(); return; }
  const hasExistingData = !!(f.biddingMethod || f.sectorType || f.phoneNumber || f.siteCoordinates ||
    f.submissionConditions || f.budgetAmount || f.referencePrice || f.budget || (f.installments||[]).length);
  if(hasExistingData && !confirm(tr('fin_project_add.autofill_confirm'))){ render(); return; }
  f.name = t.name; // replace whatever partial search text is in the box with the tender's actual name
  f.sectorType = t.sectorType || f.sectorType;
  f.biddingMethod = t.biddingMethod || '';
  f.address = t.location || f.address; // tender's "location" and project's "address"/site_address mean the same thing
  f.phoneNumber = t.phoneNumber || '';
  f.siteCoordinates = t.siteCoordinates || '';
  f.submissionOpenDate = t.submissionOpenDate || '';
  f.submissionConditions = t.submissionConditions || '';
  if(t.sectorType==='government'){ f.budgetAmount = t.budgetAmount||''; f.referencePrice = t.referencePrice||''; }
  else { f.budget = t.estimatedValue || f.budget; }
  render();
  try{
    // The tender LIST payload (DB.tenders) doesn't carry installment rows — only the detail endpoint does.
    const data = await apiCall('GET', `/api/customer/tenders/${tenderId}`);
    f.installments = (data.installments||[]).map(r=>({description:r.description, amount:r.amount, daysToComplete:r.daysToComplete}));
    f.installmentCount = f.installments.length;
    render();
  } catch(e){ toast(e.message, 'err'); }
}

// ---------------- แผนงาน — S-curve style task table (2026-07-26 rewrite, Phase 1) ----------------
// Replaces the old MS-Project-style WBS/Gantt-chart view (renderTaskGanttView + its bar/dependency-
// arrow/baseline SVG, drag-reorder, WBS/parent-task/milestone/total-float columns, the standalone
// S-curve chart) entirely — none of that renders on this page anymore. The backend tables/endpoints
// those used (client_project_task_dependencies, client_project_task_baseline, applyAutoSchedule, the
// dependency/baseline/reorder routes in server.js) were deliberately left in place, just unreached
// from this UI now — not a one-way door if parent/critical-path/dependency turn out to still be
// wanted (see the phase-1 request's "Note ทั่วไป").
// Task rows still come from the same BOQ-pull workflow as before — loadProjectTasks(),
// taskTableSetField(), resetTaskTableEditState(), taskRowIsDirty(), taskTableHasUnsavedChanges() are
// unchanged in spirit, just trimmed to the fields this table actually edits.
function taskTableSetField(taskId, field, value){
  const t = S.projectTasks.find(x=>x.id===taskId);
  if(t) t[field] = value;
}
// วันเริ่ม's onchange goes through this validating wrapper instead of the raw taskTableSetField —
// added after a real crash was reproduced and traced to this exact field (see MAX_SCHEDULE_GRID_DAYS's
// comment for the full root-cause writeup): a value typed/picked here feeds directly into
// computeScheduleDateRange()/scheduleBuildColumns() on every subsequent render, so an out-of-sane-range
// year must be rejected HERE, before it ever reaches S.projectTasks, not just defended against
// downstream. Confirmed trigger: typing "08152026" into the native <input type="date"> (an entirely
// normal-looking keystroke sequence — no obviously "wrong" input) produced a raw value of
// "0001-08-01", which alone turned a ~30-day project into a 700,000+ day grid.
const SCHEDULE_MIN_YEAR = 1970, SCHEDULE_MAX_YEAR = 2200;
function taskTableSetStartDate(taskId, value){
  const t = S.projectTasks.find(x=>x.id===taskId);
  if(!t) return;
  if(!value){ t.startDate = ''; render(); return; } // clearing the field is always allowed
  const year = parseInt(value.slice(0,4),10);
  if(!(year>=SCHEDULE_MIN_YEAR && year<=SCHEDULE_MAX_YEAR)){
    toast(tr('fin_project_schedule.start_date_year_out_of_range', {min:SCHEDULE_MIN_YEAR, max:SCHEDULE_MAX_YEAR}), 'err');
    render(); // re-render resets the <input>'s displayed value back to t.startDate (left unchanged)
    return;
  }
  // Also reject a per-task-reasonable date that would still blow up the COMBINED project range (e.g.
  // this task jumping to a year far from every other task's) — same cap the grid itself enforces, just
  // checked here too so the user gets an immediate, specific toast instead of the grid silently
  // collapsing to the generic "range too wide" empty state.
  const prev = t.startDate;
  t.startDate = value;
  if(scheduleRangeTooWide(computeScheduleDateRange(S.projectTasks))){
    t.startDate = prev;
    toast(tr('fin_project_schedule.start_date_range_too_wide'), 'err');
  }
  render();
}
// วันเริ่ม/วันเสร็จ (ผลงาน) — same year-sanity guard as taskTableSetStartDate above (a stray keystroke
// producing e.g. year "0001" is just as possible here), but WITHOUT the combined-project-range check:
// unlike t.startDate/t.endDate, these actual-side dates never feed computeScheduleDateRange()/
// scheduleBuildColumns() (confirmed — that function only reads startDate/endDate), so there's no time-
// grid-explosion risk to guard against, only the plain out-of-range-year sanity check.
function taskTableSetActualDate(taskId, field, value){
  const t = S.projectTasks.find(x=>x.id===taskId);
  if(!t) return;
  if(!value){ t[field] = ''; render(); return; }
  const year = parseInt(value.slice(0,4),10);
  if(!(year>=SCHEDULE_MIN_YEAR && year<=SCHEDULE_MAX_YEAR)){
    toast(tr('fin_project_schedule.start_date_year_out_of_range', {min:SCHEDULE_MIN_YEAR, max:SCHEDULE_MAX_YEAR}), 'err');
    render();
    return;
  }
  t[field] = value;
  render();
}
// Only the fields this table edits pre-save — taskName/durationDays/startDate, plus the ผลงาน (actual)
// counterparts (actualStartDate/actualEndDate/actualAmount/actualPercent — see schema.sql's comment on
// these columns). parentTaskId/isMilestone/percentComplete are never sent, so PUT .../tasks/:taskId's
// own "undefined -> keep current value" fallback (server.js) leaves them untouched server-side.
function taskEditableFields(t){
  return {
    taskName: (t.taskName||'').trim(),
    durationDays: parseInt(t.durationDays,10)||1,
    startDate: t.startDate || null,
    actualStartDate: t.actualStartDate || null,
    actualEndDate: t.actualEndDate || null,
    actualAmount: Number(t.actualAmount)||0,
    actualPercent: Math.min(100, Math.max(0, Number(t.actualPercent)||0)),
  };
}
function resetTaskTableEditState(){
  S.taskTableOriginal = new Map(S.projectTasks.map(t=>[t.id, JSON.stringify(taskEditableFields(t))]));
  S.taskTableNewRows = [];
}
function taskRowIsDirty(t){
  const orig = S.taskTableOriginal && S.taskTableOriginal.get(t.id);
  return orig !== undefined && orig !== JSON.stringify(taskEditableFields(t));
}
function taskTableHasUnsavedChanges(){
  if(!S.taskTableOriginal) return false;
  return S.projectTasks.some(taskRowIsDirty) || (S.taskTableNewRows||[]).length>0;
}

// งบประมาณ(%) = this row's budget_amount ÷ SUM(budget_amount of every row currently shown, saved +
// not-yet-saved) × 100 — computed here at render time only, never persisted (per the phase-1 request).
// Saved rows carry budget_amount as a SNAPSHOT taken when the row was pulled from BOQ (see server.js's
// POST .../tasks/batch) — it does NOT track later BOQ revisions, by design: a task's planned budget
// share should stay fixed once schedule work has started, not silently reshuffle every task's % the
// next time the BOQ gets revised. Not-yet-saved pulled rows carry the same figure as budgetAmount,
// read from GET .../available-boq-items-for-task's bi.amount at pull time.
function projectScheduleTotalBudget(tasks, newRows){
  const savedTotal = tasks.reduce((s,t)=>s+(Number(t.budgetAmount)||0), 0);
  const newTotal = (newRows||[]).reduce((s,r)=>s+(Number(r.budgetAmount)||0), 0);
  return savedTotal + newTotal;
}
function projectScheduleBudgetPercent(amount, totalBudget){
  return totalBudget>0 ? Math.round((Number(amount)||0)/totalBudget*1000)/10 : 0;
}

// ---------------- แผนงาน Phase 2: day/week/month time grid + แผนงาน(planned)/ผลงาน(actual) % rows ----
// Storage is always at DAY granularity (client_project_task_periods, one row per task+calendar day) —
// see the long comment above PUT .../tasks/periods in server.js. วัน/สัปดาห์ zoom show one column per
// day (สัปดาห์ only changes the header grouping); เดือน zoom groups days into 7-day display buckets
// (ว1-4 per calendar month) and spreads a bucket-cell edit evenly back across whichever of its
// underlying days actually fall inside the task's own [startDate,endDate] window.
function scheduleAddDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
function scheduleDayDiff(a, b){
  return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z')) / 86400000);
}
// Project date range = earliest startDate .. latest endDate across every SAVED task that has both
// (not-yet-saved pulled rows never have dates). null if nothing is scheduled yet.
function computeScheduleDateRange(tasks){
  const dates = [];
  for(const t of tasks){ if(t.startDate) dates.push(t.startDate); if(t.endDate) dates.push(t.endDate); }
  if(dates.length===0) return null;
  dates.sort();
  return {start:dates[0], end:dates[dates.length-1]};
}
// Hard ceiling on how wide the whole-project date range is allowed to be before building a time grid
// from it — ~20 years, generous for any real construction schedule. Exists specifically because
// scheduleBuildColumns()'s 'day'/'week' branch allocates one array element (and later, one <td> in the
// rendered HTML string) PER DAY in the range: a single bad date (a typo, or — confirmed via an actual
// crash repro — a native <input type="date"> landing on a stray tiny/huge year from an awkward
// keystroke sequence, e.g. year "0001") turns a 30-day project into a 700,000+ day range, which blows
// past V8's ~1GB max string length while building the table's HTML ("RangeError: Invalid string
// length", uncaught, inside render()'s `app.innerHTML = renderDashboard()` — this is what actually
// produced the reported white-screen crash). See scheduleRangeTooWide()/computeScheduleRenderContext().
const MAX_SCHEDULE_GRID_DAYS = 7305; // 20 years
function scheduleRangeTooWide(range){
  return !!range && scheduleDayDiff(range.start, range.end) > MAX_SCHEDULE_GRID_DAYS;
}
// Every display column as {key, dayStart, dayEnd} (dayEnd inclusive). 'day'/'week' zoom: exactly 1 day
// per column. 'month' zoom: ~7-day buckets anchored to each calendar month (ว1:1-7, ว2:8-14, ว3:15-21,
// ว4:22-end), so a 30/31-day month's last bucket absorbs the extra days rather than spilling into a
// 5th column. Returns [] (same as "no range yet") if the range is unreasonably wide — see
// MAX_SCHEDULE_GRID_DAYS above; this is the actual backstop that prevents the crash regardless of how
// a bad date got in (bad user input, a future bug elsewhere, imported/legacy data, etc.).
function scheduleBuildColumns(range, zoom){
  if(!range || scheduleRangeTooWide(range)) return [];
  if(zoom!=='month'){
    const totalDays = scheduleDayDiff(range.start, range.end);
    return Array.from({length: totalDays+1}, (_,i)=>{
      const d = scheduleAddDays(range.start, i);
      return {key:d, dayStart:d, dayEnd:d};
    });
  }
  const cols = [];
  let monthCursor = range.start.slice(0,7)+'-01';
  while(monthCursor <= range.end){
    const y = parseInt(monthCursor.slice(0,4),10), m = parseInt(monthCursor.slice(5,7),10);
    const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
    [1,8,15,22].forEach((bStart, bi)=>{
      const bEnd = bi<3 ? bStart+6 : daysInMonth;
      const dayStart = `${monthCursor.slice(0,8)}${String(bStart).padStart(2,'0')}`;
      const dayEnd = `${monthCursor.slice(0,8)}${String(Math.min(bEnd,daysInMonth)).padStart(2,'0')}`;
      cols.push({key:`${monthCursor.slice(0,7)}-w${bi+1}`, dayStart, dayEnd});
    });
    const nd = new Date(monthCursor+'T00:00:00Z'); nd.setUTCMonth(nd.getUTCMonth()+1);
    monthCursor = nd.toISOString().slice(0,10);
  }
  return cols;
}
// Header row 1 groups (month name for 'day'/'month' zoom, "สัปดาห์ N" for 'week' zoom) + row 2 per-
// column sub-labels (day-of-month number, or ว1-4 for 'month' zoom).
function scheduleColumnGroupsAndSubLabels(columns, zoom){
  if(zoom==='month'){
    const subLabels = columns.map((c,i)=>`ว${(i%4)+1}`);
    const groups = [];
    for(let i=0; i<columns.length; i+=4){
      groups.push({label:new Date(columns[i].dayStart+'T00:00:00Z').toLocaleDateString('th-TH',{month:'short', year:'2-digit', timeZone:'UTC'}), colspan:4});
    }
    return {groups, subLabels};
  }
  const subLabels = columns.map(c=>String(parseInt(c.dayStart.slice(8,10),10)));
  const groups = [];
  if(zoom==='week'){
    let i=0, weekNo=1;
    while(i<columns.length){
      const span = Math.min(7, columns.length-i);
      groups.push({label:`${tr('fin_project_schedule.week_short')} ${weekNo}`, colspan:span});
      i+=span; weekNo++;
    }
  } else {
    let i=0;
    while(i<columns.length){
      const monthKey = columns[i].dayStart.slice(0,7);
      let span=0;
      while(i+span<columns.length && columns[i+span].dayStart.slice(0,7)===monthKey) span++;
      groups.push({label:new Date(columns[i].dayStart+'T00:00:00Z').toLocaleDateString('th-TH',{month:'short', year:'2-digit', timeZone:'UTC'}), colspan:span});
      i+=span;
    }
  }
  return {groups, subLabels};
}
// Day strings inside BOTH a task's [startDate,endDate] and a column's [dayStart,dayEnd] — empty if the
// task has no dates, or the two ranges don't overlap at all (that column is not editable for this task).
function taskOverlapDays(t, col){
  if(!t.startDate || !t.endDate) return [];
  const lo = t.startDate > col.dayStart ? t.startDate : col.dayStart;
  const hi = t.endDate < col.dayEnd ? t.endDate : col.dayEnd;
  if(lo > hi) return [];
  const n = scheduleDayDiff(lo, hi);
  return Array.from({length:n+1}, (_,i)=>scheduleAddDays(lo,i));
}
function schedulePeriodsMap(){
  const m = new Map();
  for(const p of (S.taskPeriods||[])) m.set(p.taskId+'|'+p.periodDate, p);
  return m;
}
function scheduleGetDayValue(periodsMap, taskId, date, field){
  const p = periodsMap.get(taskId+'|'+date);
  return p ? (Number(p[field])||0) : 0;
}
// Sum of a field across a column's overlap days for one task — null (not just 0) when the column
// doesn't apply to this task at all, so the caller can tell "0% entered" apart from "not editable here".
function scheduleCellValue(periodsMap, t, col, field){
  const days = taskOverlapDays(t, col);
  if(days.length===0) return null;
  const sum = days.reduce((s,d)=>s+scheduleGetDayValue(periodsMap, t.id, d, field), 0);
  return Math.round(sum*10)/10;
}
// Cumulative % for a task/field = sum of EVERY period entered so far for that task, regardless of
// which columns are currently visible (per the phase-2 request: "ผลรวมของทุกงวดที่กรอกไปแล้ว").
function scheduleCumulative(taskId, field){
  return Math.round((S.taskPeriods||[]).filter(p=>p.taskId===taskId).reduce((s,p)=>s+(Number(p[field])||0),0)*10)/10;
}
// Spreads an entered bucket-cell total evenly across whichever underlying days actually overlap the
// task's own scheduled window (1 day for วัน/สัปดาห์ zoom — a no-op split; up to 7 for เดือน zoom). The
// last day absorbs the rounding remainder so the days always sum to exactly the entered total.
function scheduleSetCellValue(taskId, dayStart, dayEnd, field, rawValue){
  const t = S.projectTasks.find(x=>x.id===taskId);
  if(!t) return;
  const days = taskOverlapDays(t, {dayStart, dayEnd});
  if(days.length===0) return;
  const v = Math.max(0, Math.min(100, Number(rawValue)||0));
  const base = Math.round((v/days.length)*10)/10;
  days.forEach((d,i)=>{
    const val = (i===days.length-1) ? Math.round((v - base*(days.length-1))*10)/10 : base;
    let p = S.taskPeriods.find(x=>x.taskId===taskId && x.periodDate===d);
    if(!p){ p = {taskId, periodDate:d, plannedPercent:0, actualPercent:0}; S.taskPeriods.push(p); }
    p[field] = val;
  });
  render();
}
// Canonical (sorted, zero-rows-dropped, rounded) JSON of a periods array — used both as the "last
// saved" snapshot and to detect whether anything has changed since, the same snapshot-diff convention
// as taskTableOriginal/taskRowIsDirty() above (a simple boolean dirty flag would miss the case where an
// edit exactly cancels out an earlier one).
function canonicalPeriodsJson(periods){
  return JSON.stringify(
    (periods||[])
      .filter(p=>(Number(p.plannedPercent)||0)>0 || (Number(p.actualPercent)||0)>0)
      .map(p=>({taskId:p.taskId, periodDate:p.periodDate, plannedPercent:Math.round((Number(p.plannedPercent)||0)*10)/10, actualPercent:Math.round((Number(p.actualPercent)||0)*10)/10}))
      .sort((a,b)=> a.taskId-b.taskId || a.periodDate.localeCompare(b.periodDate))
  );
}
function resetTaskPeriodsEditState(){
  S.taskPeriodsOriginal = canonicalPeriodsJson(S.taskPeriods);
}
function taskPeriodsHasUnsavedChanges(){
  if(S.taskPeriodsOriginal==null) return false;
  return canonicalPeriodsJson(S.taskPeriods) !== S.taskPeriodsOriginal;
}
// Fills in an even แผนงาน(planned) split across a task's own duration — ONLY for tasks that have both
// dates set and no planned % entered yet at all (a task the user has already started filling in, even
// partially, is never touched). ผลงาน(actual) never gets an auto-default — it only ever comes from
// real site progress, per the phase-2 request. Called once right after every load, AFTER
// resetTaskPeriodsEditState() snapshots the true "as saved" state, so a freshly-defaulted plan
// correctly shows as unsaved (it isn't in the DB yet) rather than silently looking already-saved.
function scheduleAutoDistributePlanned(){
  for(const t of S.projectTasks){
    if(!t.startDate || !t.endDate) continue;
    if((S.taskPeriods||[]).some(p=>p.taskId===t.id && (Number(p.plannedPercent)||0)>0)) continue;
    const days = scheduleDayDiff(t.startDate, t.endDate)+1;
    if(days<=0) continue;
    const base = Math.round((100/days)*10)/10;
    for(let i=0;i<days;i++){
      const d = scheduleAddDays(t.startDate, i);
      const val = (i===days-1) ? Math.round((100-base*(days-1))*10)/10 : base;
      let p = S.taskPeriods.find(x=>x.taskId===t.id && x.periodDate===d);
      if(!p){ p = {taskId:t.id, periodDate:d, plannedPercent:0, actualPercent:0}; S.taskPeriods.push(p); }
      p.plannedPercent = val;
    }
  }
}
// Per-task sum check (แต่ละแถวรวมกันได้ไม่เกิน 100%) — mirrors the server's own check in
// PUT .../tasks/periods, run client-side first so a bad save shows a specific, translated error
// immediately instead of round-tripping to the server for it.
function taskPeriodsValidationErrors(){
  const sums = new Map();
  for(const p of S.taskPeriods){
    const s = sums.get(p.taskId) || {planned:0, actual:0};
    s.planned += Number(p.plannedPercent)||0;
    s.actual += Number(p.actualPercent)||0;
    sums.set(p.taskId, s);
  }
  const errors = [];
  for(const [taskId, s] of sums){
    const t = S.projectTasks.find(x=>x.id===taskId);
    const name = t ? t.taskName : String(taskId);
    const planned = Math.round(s.planned*10)/10, actual = Math.round(s.actual*10)/10;
    if(planned > 100.01) errors.push(tr('fin_project_schedule.periods_planned_exceeded', {name, percent:planned}));
    if(actual > 100.01) errors.push(tr('fin_project_schedule.periods_actual_exceeded', {name, percent:actual}));
  }
  return errors;
}

// Shared by renderProjectScheduleTable() (which also draws the S-curve overlay's underlying data via
// updateScheduleChartOverlay()) so every part of this page uses the exact same tasks/budget/date-range/
// column-set for a given render — computed once by pageFinProjectSchedule() and passed through, rather
// than each recomputing (and risking drifting out of sync with each other, e.g. if S.projectTasks/
// S.scheduleZoom changed mid-render, which can't happen here but would be an easy bug to introduce later
// if these ever computed this independently).
function computeScheduleRenderContext(){
  const tasks = S.projectTasks;
  const newRows = S.taskTableNewRows || [];
  const totalBudget = projectScheduleTotalBudget(tasks, newRows);
  const range = computeScheduleDateRange(tasks);
  const rangeTooWide = scheduleRangeTooWide(range);
  const columns = scheduleBuildColumns(range, S.scheduleZoom);
  const periodsMap = schedulePeriodsMap();
  const colWidth = S.scheduleZoom==='month' ? 44 : 28;
  const todayColIdx = scheduleTodayColumnIndex(columns);
  return {tasks, newRows, totalBudget, range, rangeTooWide, columns, periodsMap, colWidth, todayColIdx};
}

// Custom-drawn (not native) horizontal scrollbars at BOTH the top and bottom of #schedule-scroll-main
// (the task table's own .table-wrap) so a wide day-zoom time grid can be scrolled sideways from either
// end, without hunting for a real scrollbar that might be far below the fold — same "one drives the
// other" idea as the old Gantt chart's wireGanttScrollSync(), just horizontal instead of vertical, and
// custom-drawn instead of relying on the browser's own scrollbar chrome (which some platforms/browsers
// render as a fade-out "overlay" scrollbar that's invisible except mid-gesture — a real usability trap
// for a bar whose only job is "be a visible, obvious place to grab and drag").
// #schedule-scroll-main keeps its native overflow-x:auto too (wheel/trackpad/native-drag all still
// work directly on the table) — the custom thumbs are an additional, always-visible, always-draggable
// affordance layered on top and bottom, kept in sync with main.scrollLeft in both directions.
// Called from attachHandlers() after every render() (a no-op when this page isn't currently showing,
// since the elements won't exist yet) — must re-measure scrollWidth every time since the table's width
// changes with the task count, zoom level, and time-grid column count. Uses property-assignment
// handlers (`el.onX = fn`, including on `window` during a drag) rather than addEventListener
// specifically so re-running this on every render() never accumulates duplicate listeners — a fresh
// assignment simply replaces the previous one (same convention as every other on-render wiring
// function in this file, e.g. taskDrop's ondragover inline attrs).
function wireScheduleScrollSync(){
  const main = document.getElementById('schedule-scroll-main');
  const topTrack = document.getElementById('schedule-scroll-top-track'), topThumb = document.getElementById('schedule-scroll-top-thumb');
  const botTrack = document.getElementById('schedule-scroll-bottom-track'), botThumb = document.getElementById('schedule-scroll-bottom-thumb');
  if(!main || !topTrack || !topThumb || !botTrack || !botThumb) return;
  const table = main.querySelector('table');
  const scrollWidth = table ? table.scrollWidth : 0;

  // Recomputed on every layout() call (not cached) since main.clientWidth can change (window resize)
  // independently of a re-render.
  function metrics(){
    const clientWidth = main.clientWidth;
    const trackWidth = topTrack.clientWidth;
    const maxScroll = Math.max(0, scrollWidth - clientWidth);
    const thumbWidth = maxScroll<=0 ? trackWidth : Math.max(20, trackWidth * Math.min(1, clientWidth/scrollWidth));
    const draggable = Math.max(0, trackWidth - thumbWidth);
    return {trackWidth, thumbWidth, draggable, maxScroll};
  }
  function layout(){
    const {thumbWidth, draggable, maxScroll} = metrics();
    const left = maxScroll>0 ? (main.scrollLeft/maxScroll)*draggable : 0;
    topThumb.style.width = botThumb.style.width = thumbWidth+'px';
    topThumb.style.left = botThumb.style.left = left+'px';
  }
  main.onscroll = layout;

  function startDrag(e){
    e.preventDefault();
    const {draggable, maxScroll} = metrics();
    const startX = e.clientX, startScrollLeft = main.scrollLeft;
    window.onmousemove = (ev)=>{
      const scrollDelta = draggable>0 ? ((ev.clientX-startX)/draggable)*maxScroll : 0;
      main.scrollLeft = Math.max(0, Math.min(maxScroll, startScrollLeft+scrollDelta));
    };
    window.onmouseup = ()=>{ window.onmousemove = null; window.onmouseup = null; };
  }
  topThumb.onmousedown = startDrag;
  botThumb.onmousedown = startDrag;
  // Clicking the track itself (not the thumb) jumps the thumb's CENTER to the click point.
  function onTrackClick(e){
    if(e.target===topThumb || e.target===botThumb) return;
    const {thumbWidth, draggable, maxScroll} = metrics();
    const rect = e.currentTarget.getBoundingClientRect();
    const frac = draggable>0 ? Math.max(0, Math.min(1, (e.clientX-rect.left-thumbWidth/2)/draggable)) : 0;
    main.scrollLeft = frac*maxScroll;
  }
  topTrack.onclick = onTrackClick;
  botTrack.onclick = onTrackClick;
  layout();
}

function renderProjectScheduleTable(ctx){
  const {tasks, newRows, totalBudget, columns, rangeTooWide, periodsMap, colWidth, todayColIdx} = ctx;

  // Pre-save (not-yet-saved pulled) rows only ever expose Duration for editing — same deliberate scope
  // limit the old table had: POST .../tasks/batch's body is {tasks:[{sourceBoqItemId, durationDays}]},
  // it doesn't accept a start date, so Start/End for these rows show as "-" until after the row is
  // actually saved (at which point it becomes a normal editable existing row, and only then can it
  // carry แผนงาน/ผลงาน periods — a row with no real task id has nothing to attach them to; see
  // newRowHtml() below). Existing/saved tasks render as 2 <tr> — PLAN (แผนงาน, orange) on top and
  // ACTUAL (ผลงาน, sky) below, per a reference image the user supplied. No./ชื่องาน (and the delete
  // button) carry rowspan="2" — shared identity for the task, not duplicated per row. Every OTHER
  // master field (ระยะเวลา/วันเริ่ม/วันเสร็จ/บาท/%) now renders TWICE, once per row, holding that row's
  // own plan-vs-actual value — this replaced an earlier "parallel columns" layout (actual fields as 5
  // extra columns to the right) per explicit user follow-up request; colors reuse the SAME
  // var(--orange-dark)/var(--sky) already used by the row_label_planned/row_label_actual labels and the
  // day-grid/S-curve elsewhere on this page (asked to match, not invent new colors).
  const PLAN_COLOR = 'color:var(--orange-dark);';
  const ACTUAL_COLOR = 'color:var(--sky);';
  // เส้นประคั่นระหว่าง task แต่ละรายการ — every cell in the ACTUAL (bottom) row of a task's pair gets a
  // dashed bottom border; the rowspan'd No./name/delete cells (declared once, in the PLAN row's <tr>,
  // but visually ending at the ACTUAL row's bottom) get the SAME border directly so the dashed line
  // reads as one continuous rule under the whole task, not just under the non-rowspan columns.
  const DIVIDER = 'border-bottom:1px dashed var(--border-strong);';
  const savedRowHtml = (t, no) => {
    const nameContent = t.sourceBoqItemId
      ? esc(t.taskName)
      : `<input id="task-name-${t.id}" value="${esc(t.taskName)}" style="width:100%; box-sizing:border-box;" oninput="taskTableSetField(${t.id},'taskName',this.value);">`;
    const budgetAmount = Number(t.budgetAmount)||0;
    const budgetPercent = projectScheduleBudgetPercent(budgetAmount, totalBudget);
    const delCell = `<button class="btn btn-ghost btn-sm" data-act="delete-task" data-id="${t.id}" title="${tr('fin_project_schedule.delete_task')}">${ICN.trash}</button>`;

    // ---- PLAN (แผนงาน) row's own master fields — ระยะเวลา(วัน)/วันเริ่ม stay borderless (.sched-plain-input,
    // per the earlier border-removal request), tinted orange to match the row.
    const planDurationCell = `<input id="task-duration-${t.id}" type="number" min="1" step="1" value="${t.durationDays}" class="sched-plain-input" style="width:64px; box-sizing:border-box; ${PLAN_COLOR}" onchange="taskTableSetField(${t.id},'durationDays',this.value); render();">`;
    const planStartCell = `<input id="task-start-${t.id}" type="date" value="${t.startDate||''}" class="sched-plain-input" style="width:100%; box-sizing:border-box; ${PLAN_COLOR}" onchange="taskTableSetStartDate(${t.id}, this.value);">`;
    const planEndCell = t.endDate || '-';

    // ---- ACTUAL (ผลงาน) row's own master fields — a manually-entered, per-task snapshot parallel to
    // the PLAN row above, NOT the per-day แผนงาน/ผลงาน %-grid further right (see schema.sql's comment on
    // actual_start_date/actual_end_date/actual_amount/actual_percent). ระยะเวลา(วัน) is ALWAYS derived
    // from the two actual dates, never its own input (matches "ไม่ต้องให้กรอก" from the original
    // request) — shown as plain text, so it's trivially borderless like PLAN's ระยะเวลา(วัน). วันเริ่ม
    // ALSO stays borderless (.sched-plain-input) per this follow-up's explicit "ทั้ง 2 แถว"; วันเสร็จ/
    // บาท/% keep normal bordered inputs, same as every other editable field in this table.
    const actualStartCell = `<input id="task-actual-start-${t.id}" type="date" value="${t.actualStartDate||''}" class="sched-plain-input" style="width:100%; box-sizing:border-box; ${ACTUAL_COLOR}" onchange="taskTableSetActualDate(${t.id},'actualStartDate',this.value);">`;
    const actualEndCell = `<input id="task-actual-end-${t.id}" type="date" value="${t.actualEndDate||''}" class="sched-plain-input" style="width:100%; box-sizing:border-box; ${ACTUAL_COLOR}" onchange="taskTableSetActualDate(${t.id},'actualEndDate',this.value);">`;
    const actualDurationDays = (t.actualStartDate && t.actualEndDate) ? (scheduleDayDiff(t.actualStartDate, t.actualEndDate)+1) : null;
    const actualAmount = Number(t.actualAmount)||0;
    const actualAmountCell = `<input id="task-actual-amount-${t.id}" type="number" min="0" step="0.01" value="${actualAmount||''}" placeholder="0" class="sched-plain-input" style="width:100%; min-width:90px; box-sizing:border-box; text-align:right; ${ACTUAL_COLOR}" onchange="taskTableSetField(${t.id},'actualAmount',this.value); render();">`;
    const actualPercent = Number(t.actualPercent)||0;
    const actualPercentCell = `<input id="task-actual-percent-${t.id}" type="number" min="0" max="100" step="0.1" value="${actualPercent||''}" placeholder="0" class="sched-plain-input" style="width:100%; min-width:64px; box-sizing:border-box; text-align:right; ${ACTUAL_COLOR}" onchange="taskTableSetField(${t.id},'actualPercent',this.value); render();">`;

    const sharedCellsRowspan = `
      <td class="num-cell mono sched-col-no" rowspan="2" style="vertical-align:middle; ${DIVIDER}">${no}</td>
      <td class="sched-col-name" rowspan="2" style="vertical-align:middle; ${DIVIDER}">${nameContent}</td>`;

    if(columns.length===0){
      return `
      <tr class="sched-task-row">
        ${sharedCellsRowspan}
        <td class="num-cell sched-col-duration" style="${PLAN_COLOR}">${planDurationCell}</td>
        <td class="sched-col-date" style="${PLAN_COLOR}">${planStartCell}</td>
        <td class="mono sched-col-date" style="${PLAN_COLOR}">${esc(planEndCell)}</td>
        <td class="mono num-cell sched-col-budget" style="${PLAN_COLOR}">${fmtMoney(budgetAmount)}</td>
        <td class="mono num-cell sched-col-budget-pct" style="${PLAN_COLOR}">${budgetPercent.toFixed(1)}%</td>
        <td class="mono sched-col-rowlabel" style="${PLAN_COLOR} font-weight:600; white-space:nowrap; border-left:1px solid var(--border-strong);">${tr('fin_project_schedule.row_label_planned')}</td>
        <td colspan="${columns.length+1}" style="background:var(--amber-bg);"></td>
        <td rowspan="2" style="text-align:right; vertical-align:middle; ${DIVIDER}">${delCell}</td>
      </tr>
      <tr class="sched-task-row">
        <td class="num-cell mono sched-col-duration" style="${ACTUAL_COLOR} ${DIVIDER}">${actualDurationDays!=null ? actualDurationDays : '-'}</td>
        <td class="sched-col-date" style="${ACTUAL_COLOR} ${DIVIDER}">${actualStartCell}</td>
        <td class="sched-col-date" style="${ACTUAL_COLOR} ${DIVIDER}">${actualEndCell}</td>
        <td class="mono num-cell sched-col-budget" style="${ACTUAL_COLOR} ${DIVIDER}">${actualAmountCell}</td>
        <td class="mono num-cell sched-col-budget-pct" style="${ACTUAL_COLOR} ${DIVIDER}">${actualPercentCell}</td>
        <td class="mono sched-col-rowlabel" style="${ACTUAL_COLOR} font-weight:600; white-space:nowrap; border-left:1px solid var(--border-strong); ${DIVIDER}">${tr('fin_project_schedule.row_label_actual')}</td>
        <td colspan="${columns.length+1}" style="background:var(--sky-bg); ${DIVIDER}"></td>
      </tr>`;
    }
    // sched-grid-td (2026-07-27 overlay rewrite) marks every real grid cell — updateScheduleChartOverlay()
    // reads the FIRST one's offsetLeft to find exactly where the day/week/month grid starts (this table
    // has no table-layout:fixed and the label columns before it have no fixed width, so that X offset
    // can't be hardcoded, only measured live).
    const gridRow = (field, rowType) => columns.map((col,ci)=>{
      const todayStyle = scheduleTodayCellStyle(ci, todayColIdx);
      const val = scheduleCellValue(periodsMap, t, col, field);
      const bottomBorder = rowType==='actual' ? DIVIDER : '';
      // The inner span (not just a bare empty <td>) matters — an entirely empty table cell's own
      // explicit `width` is NOT reliably honored by table-layout:auto's column-width computation
      // (confirmed live: forcing width:500px !important directly on an empty .sched-grid-td left it
      // stuck around ~70px while a SIBLING cell with real <input> content correctly reached ~500px) —
      // giving it a real (invisible) child element to carry the width, matching how a value-holding
      // cell's <input> does, makes print's width-fill feature (below) work on placeholder cells too.
      if(val===null) return `<td class="sched-grid-td" style="background:${rowType==='planned'?'var(--amber-bg)':'var(--sky-bg)'}; opacity:.3; padding:2px; border-left:1px solid var(--border); ${todayStyle} ${bottomBorder}"><span class="sched-period-cell-spacer" style="display:inline-block; width:${colWidth}px; height:1px;"></span></td>`;
      return `<td class="sched-grid-td" style="background:${rowType==='planned'?'var(--amber-bg)':'var(--sky-bg)'}; padding:1px; border-left:1px solid var(--border); ${todayStyle} ${bottomBorder}">
        <input type="number" min="0" max="100" step="0.1" value="${val===0?'':val}" placeholder="0"
          class="sched-period-cell"
          style="width:${colWidth}px; box-sizing:border-box; text-align:center; border:none; background:transparent; font-size:11.5px; padding:4px 1px;"
          onchange="scheduleSetCellValue(${t.id}, '${col.dayStart}', '${col.dayEnd}', '${field}', this.value)">
      </td>`;
    }).join('');
    const cumCell = (val, rowType) => `<td class="mono num-cell" style="background:${rowType==='planned'?'var(--amber-bg)':'var(--sky-bg)'}; font-weight:700; border-left:1px solid var(--border-strong); ${rowType==='actual'?DIVIDER:''}">${val.toFixed(1)}%</td>`;
    // sched-task-row (2026-07-27 overlay rewrite) marks every SAVED task's PLAN+ACTUAL row pair —
    // updateScheduleChartOverlay() uses the first/last one's offsetTop/offsetHeight to find exactly where
    // the task-rows band starts/ends (excludes the total row and summary rows below, and any not-yet-
    // saved rows, which have no real grid cells / period data for the overlay to plot anyway).
    return `
    <tr class="sched-task-row">
      ${sharedCellsRowspan}
      <td class="num-cell sched-col-duration" style="${PLAN_COLOR}">${planDurationCell}</td>
      <td class="sched-col-date" style="${PLAN_COLOR}">${planStartCell}</td>
      <td class="mono sched-col-date" style="${PLAN_COLOR}">${esc(planEndCell)}</td>
      <td class="mono num-cell sched-col-budget" style="${PLAN_COLOR}">${fmtMoney(budgetAmount)}</td>
      <td class="mono num-cell sched-col-budget-pct" style="${PLAN_COLOR}">${budgetPercent.toFixed(1)}%</td>
      <td class="mono sched-col-rowlabel" style="${PLAN_COLOR} font-weight:600; white-space:nowrap; border-left:1px solid var(--border-strong);">${tr('fin_project_schedule.row_label_planned')}</td>
      ${gridRow('plannedPercent','planned')}
      ${cumCell(scheduleCumulative(t.id,'plannedPercent'), 'planned')}
      <td rowspan="2" style="text-align:right; vertical-align:middle; ${DIVIDER}">${delCell}</td>
    </tr>
    <tr class="sched-task-row">
      <td class="num-cell mono sched-col-duration" style="${ACTUAL_COLOR} ${DIVIDER}">${actualDurationDays!=null ? actualDurationDays : '-'}</td>
      <td class="sched-col-date" style="${ACTUAL_COLOR} ${DIVIDER}">${actualStartCell}</td>
      <td class="sched-col-date" style="${ACTUAL_COLOR} ${DIVIDER}">${actualEndCell}</td>
      <td class="mono num-cell sched-col-budget" style="${ACTUAL_COLOR} ${DIVIDER}">${actualAmountCell}</td>
      <td class="mono num-cell sched-col-budget-pct" style="${ACTUAL_COLOR} ${DIVIDER}">${actualPercentCell}</td>
      <td class="mono sched-col-rowlabel" style="${ACTUAL_COLOR} font-weight:600; white-space:nowrap; border-left:1px solid var(--border-strong); ${DIVIDER}">${tr('fin_project_schedule.row_label_actual')}</td>
      ${gridRow('actualPercent','actual')}
      ${cumCell(scheduleCumulative(t.id,'actualPercent'), 'actual')}
    </tr>`;
  };
  // Two kinds of not-yet-saved row share this same renderer: BOQ-pulled (r.sourceBoqItemId set —
  // name/budget come from the BOQ item and stay read-only pre-save, same restriction as before: only
  // Duration is editable until the row is actually saved, since POST .../tasks/batch's body is
  // {sourceBoqItemId, durationDays} only) and manual entry (r.isManual — a plain user-typed row with
  // NO BOQ link at all, so name/duration/start/budget are ALL editable pre-save; saved individually via
  // POST .../tasks, which already accepts all four — see save-task-table below).
  const newRowHtml = (r, idx, no) => {
    const delCell = `<button class="btn btn-ghost btn-sm" data-act="remove-task-table-row" data-idx="${idx}" title="${tr('fin_project_schedule.batch_add_remove_row')}">${ICN.trash}</button>`;
    const budgetAmount = Number(r.budgetAmount)||0;
    const nameCell = r.isManual
      ? `<input id="new-task-name-${idx}" value="${esc(r.taskName||'')}" placeholder="${tr('fin_project_schedule.manual_row_name_placeholder')}" style="width:100%; box-sizing:border-box;" oninput="S.taskTableNewRows[${idx}].taskName=this.value;">`
      : esc(r.taskName);
    const startCell = r.isManual
      ? `<input id="new-task-start-${idx}" type="date" value="${r.startDate||''}" class="sched-plain-input" style="width:100%; box-sizing:border-box;" onchange="S.taskTableNewRows[${idx}].startDate=this.value; render();">`
      : `<span class="mono" style="color:var(--text-muted);">-</span>`;
    const budgetCell = r.isManual
      ? `<input id="new-task-budget-${idx}" type="number" min="0" step="0.01" value="${budgetAmount||''}" placeholder="0" style="width:100%; box-sizing:border-box; text-align:right;" onchange="S.taskTableNewRows[${idx}].budgetAmount=this.value; render();">`
      : fmtMoney(budgetAmount);
    return `
    <tr class="sched-newrow">
      <td class="num-cell mono sched-col-no">${no}</td>
      <td class="sched-col-name">${nameCell}</td>
      <td class="num-cell sched-col-duration"><input id="new-task-duration-${idx}" type="number" min="1" step="1" value="${r.durationDays||1}" class="sched-plain-input" style="width:64px; box-sizing:border-box;" onchange="S.taskTableNewRows[${idx}].durationDays=this.value; render();"></td>
      <td class="sched-col-date">${startCell}</td>
      <td class="mono sched-col-date">-</td>
      <td class="mono num-cell sched-col-budget">${budgetCell}</td>
      <td class="mono num-cell sched-col-budget-pct">${projectScheduleBudgetPercent(budgetAmount, totalBudget).toFixed(1)}%</td>
      <td colspan="${columns.length+2}" class="hint" style="text-align:center; color:var(--text-muted); border-left:1px solid var(--border-strong);">${tr('fin_project_schedule.periods_save_first_hint')}</td>
      <td style="text-align:right;">${delCell}</td>
    </tr>`;
  };

  const rows = tasks.map((t,i)=>savedRowHtml(t,i+1)).join('')
    + newRows.map((r,idx)=>newRowHtml(r,idx,tasks.length+idx+1)).join('');

  const dirty = taskTableHasUnsavedChanges();
  const periodsDirty = taskPeriodsHasUnsavedChanges();
  const pulledIds = new Set(newRows.map(r=>String(r.sourceBoqItemId)));
  const remainingToPull = (S.taskTableAvailableBoqItems||[]).filter(it=>!pulledIds.has(String(it.id))).length;
  const noBoqHint = remainingToPull===0
    ? `<div class="hint" style="margin-top:10px;">${tr('fin_project_schedule.batch_add_no_boq')}</div>` : '';
  // Two distinct empty-grid reasons need two distinct messages — "nothing scheduled yet" (routine,
  // just hasn't been set up) vs. "a date is clearly wrong" (needs the user to go fix a specific field,
  // e.g. a stray tiny/huge year from a mistyped date — see MAX_SCHEDULE_GRID_DAYS/scheduleRangeTooWide()).
  const noDatesHint = rangeTooWide
    ? `<div class="hint" style="margin-top:10px; color:var(--red);">${tr('fin_project_schedule.schedule_range_too_wide_hint')}</div>`
    : (columns.length===0 && tasks.length>0)
      ? `<div class="hint" style="margin-top:10px;">${tr('fin_project_schedule.no_schedule_dates_hint')}</div>` : '';

  const totalCols = 7 /* No..budget% */ + 1 /* label */ + columns.length + 1 /* cumulative */ + 1 /* delete */;
  const totalRow = (tasks.length+newRows.length>0) ? `
    <tr style="font-weight:700; border-top:2px solid var(--border-strong);">
      <td colspan="5" style="text-align:right;">${tr('fin_project_schedule.total_row_label')}</td>
      <td class="mono num-cell">${fmtMoney(totalBudget)}</td>
      <td class="mono num-cell">${totalBudget>0?'100.0%':'0.0%'}</td>
      <td colspan="${totalCols-7}"></td>
    </tr>` : '';

  // ---- Project summary rows (4 แผนงาน + 4 ผลงาน), aggregating every task into one project-wide view
  // — see computeProjectSummaryRows()/scheduleMonthSpans() above. Only shown once there's an actual
  // range/budget to summarize (same guard the S-curve chart uses).
  let summaryRows = '';
  if(columns.length>0 && totalBudget>0 && tasks.length>0){
    const summary = computeProjectSummaryRows(tasks, columns, totalBudget);
    const unitLabel = S.scheduleZoom==='month' ? tr('fin_project_schedule.unit_period') : tr('fin_project_schedule.unit_day');
    const labelCell = (text, rowType) => `<td colspan="8" class="mono" style="text-align:right; font-weight:600; white-space:nowrap; ${rowType==='planned'?'color:var(--orange-dark);':'color:var(--sky);'}">${esc(text)}</td>`;
    // width:${colWidth}px + box-sizing:border-box on EVERY per-column cell here, matching the grid's own
    // input width exactly (`.sched-period-cell`) — without this, these cells (plain text like "100.0%",
    // no width hint) have no explicit width, and table-layout:auto sizes the WHOLE shared column to fit
    // their natural (wider) content instead of the intended colWidth. Since #schedule-chart-overlay's
    // entire width/toX() math assumes every column is EXACTLY colWidth wide, that mismatch silently
    // undersizes the whole overlay relative to the table's real rendered width — for a long/many-column
    // grid the accumulated gap (a few tens of px × hundreds of columns) becomes large enough that the
    // S-curve line's line, whose LAST point can only ever reach the (undersized) overlay's own edge, ends
    // up positioned far short of the table's true scrollable width — visually indistinguishable from the
    // line just "stopping mid-grid" once you scroll past where the overlay actually ends (2026-07-27,
    // 3rd report of this same visual symptom — confirmed via real getBoundingClientRect() measurements:
    // a 196-column project's grid <td> measured 65px actual vs the 28px colWidth constant, table
    // scrollWidth 16317px vs the overlay's own computed 5488px).
    const perColumnRow = (label, values, rowType, suffix) => {
      const cells = values.map((v,ci)=>`<td class="mono num-cell" style="width:${colWidth}px; box-sizing:border-box; background:${rowType==='planned'?'var(--amber-bg)':'var(--sky-bg)'}; border-left:1px solid var(--border); font-weight:600; ${scheduleTodayCellStyle(ci, todayColIdx)}">${v}${suffix}</td>`).join('');
      return `<tr>${labelCell(label, rowType)}${cells}<td colspan="2"></td></tr>`;
    };
    // text-align:CENTER (not the usual num-cell right-align) — deliberate: these <td>s are merged
    // (colspan) across every day/week column in a calendar month, which can be much wider than the
    // viewport at 'day'/'week' zoom, so a right-aligned number would sit at the far right edge of the
    // WHOLE month's merged cell — often scrolled out of view — instead of centered where it's actually
    // visible, matching "ตัวเลข...คร่อมหลายคอลัมน์" (the number straddles/centers across the merged
    // columns) from the reference image.
    const perMonthRow = (label, values, rowType) => {
      const cells = summary.monthSpans.map((span,si)=>{
        const spansToday = todayColIdx>=span.startIdx && todayColIdx<span.startIdx+span.span;
        return `<td colspan="${span.span}" class="mono" style="text-align:center; background:${rowType==='planned'?'var(--amber-bg)':'var(--sky-bg)'}; border-left:1px solid var(--border); font-weight:600; ${spansToday?'box-shadow: inset 0 0 0 1000px rgba(216,27,96,0.16);':''}">${fmtMoney(values[si])}</td>`;
      }).join('');
      return `<tr>${labelCell(label, rowType)}${cells}<td colspan="2"></td></tr>`;
    };
    summaryRows = `
    <tr style="border-top:2px solid var(--border-strong);">
      <td colspan="${totalCols}" class="section-title" style="margin:0; padding:10px 6px;">${tr('fin_project_schedule.section_summary')}</td>
    </tr>
    ${perColumnRow(tr('fin_project_schedule.summary_row_period_pct', {unit:unitLabel}), summary.periodPlanned.map(v=>v.toFixed(1)), 'planned', '%')}
    ${perColumnRow(tr('fin_project_schedule.summary_row_cumulative_pct', {unit:unitLabel}), summary.cumulative.map(c=>c.planned.toFixed(1)), 'planned', '%')}
    ${perMonthRow(tr('fin_project_schedule.summary_row_monthly_baht'), summary.monthlyPlanned, 'planned')}
    ${perMonthRow(tr('fin_project_schedule.summary_row_cumulative_baht'), summary.cumMonthlyPlanned, 'planned')}
    ${perColumnRow(tr('fin_project_schedule.summary_row_period_pct', {unit:unitLabel}), summary.periodActual.map(v=>v.toFixed(1)), 'actual', '%')}
    ${perColumnRow(tr('fin_project_schedule.summary_row_cumulative_pct', {unit:unitLabel}), summary.cumulative.map(c=>c.actual.toFixed(1)), 'actual', '%')}
    ${perMonthRow(tr('fin_project_schedule.summary_row_monthly_baht'), summary.monthlyActual, 'actual')}
    ${perMonthRow(tr('fin_project_schedule.summary_row_cumulative_baht'), summary.cumMonthlyActual, 'actual')}`;
  }

  const {groups, subLabels} = scheduleColumnGroupsAndSubLabels(columns, S.scheduleZoom);
  const groupHeaderCells = groups.map(g=>`<th colspan="${g.colspan}" style="text-align:center; border-left:1px solid var(--border-strong);">${esc(g.label)}</th>`).join('');
  const subHeaderCells = subLabels.map((lbl,i)=>`<th class="num-cell" style="width:${colWidth}px; padding:6px 2px; font-weight:500; ${i===0?'border-left:1px solid var(--border-strong);':''} ${scheduleTodayCellStyle(i, todayColIdx)}">${esc(lbl)}</th>`).join('');

  const zoomButtons = `
    <div class="small-btn-row" style="margin:0;">
      ${['day','week','month'].map(z=>`<button class="btn ${S.scheduleZoom===z?'btn-navy':'btn-ghost'} btn-sm" data-act="set-schedule-zoom" data-zoom="${z}">${tr('fin_project_schedule.schedule_zoom_'+z)}</button>`).join('')}
    </div>`;
  // The 2 extra entries (thin colored LINES, not the cell-background swatches above them) distinguish
  // the S-curve overlay's cumulative lines from the per-cell แผนงาน/ผลงาน background tint legend already
  // above — same var(--orange)/var(--sky) colors buildScheduleChartOverlaySvgContent() actually draws.
  const legend = `
    <div style="display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--text-muted);">
      <span style="display:flex; align-items:center; gap:5px;"><span style="width:14px; height:9px; background:var(--amber-bg); border:1px solid var(--amber); border-radius:2px; display:inline-block;"></span>${tr('fin_project_schedule.row_label_planned')}</span>
      <span style="display:flex; align-items:center; gap:5px;"><span style="width:14px; height:9px; background:var(--sky-bg); border:1px solid var(--sky); border-radius:2px; display:inline-block;"></span>${tr('fin_project_schedule.row_label_actual')}</span>
      <span style="display:flex; align-items:center; gap:5px;"><span style="width:14px; height:2px; background:var(--orange); display:inline-block;"></span>${tr('fin_project_schedule.scurve_line_planned')}</span>
      <span style="display:flex; align-items:center; gap:5px;"><span style="width:14px; height:2px; background:var(--sky); display:inline-block;"></span>${tr('fin_project_schedule.scurve_line_actual')}</span>
    </div>`;

  return `
  <div id="task-table-section" class="card" style="padding:26px 30px; margin-bottom:20px;">
    <div class="section-title no-print" style="margin-top:0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <span>${tr('fin_project_schedule.section_tasks')}</span>
      ${zoomButtons}
    </div>
    <div class="no-print" style="margin-bottom:10px;">${legend}</div>
    <div id="schedule-scroll-top-track" class="schedule-scrollbar-track" style="margin-bottom:6px;"><div id="schedule-scroll-top-thumb" class="schedule-scrollbar-thumb"></div></div>

          <th class="sched-col-date" rowspan="2">${tr('fin_project_schedule.col_start')}</th>
